<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platform Issues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --side:#EFEDE8; --surface:#FFFFFF; --surface-2:#FAF9F6;
  --hover:rgba(40,35,25,.045); --press:rgba(40,35,25,.08);
  --line:#E6E3DC; --line-strong:#D6D2C9;
  --ink:#1C1B19; --ink-2:#45423D; --muted:#7A766E; --faint:#A8A39A;
  --accent:#2F5BDB; --accent-ink:#FFFFFF; --accent-soft:rgba(47,91,219,.09); --accent-line:rgba(47,91,219,.35);
  --focus-row:rgba(47,91,219,.07);
  --urgent:#DD3B2A; --high:#E07B16;
  --st-triage:#8A5CF0; --st-backlog:#A8A39A; --st-todo:#8F8A80; --st-progress:#E2A008; --st-review:#13987F; --st-done:#2F5BDB; --st-canceled:#A8A39A;
  --shadow-1:0 1px 2px rgba(30,25,15,.06),0 0 0 1px rgba(30,25,15,.06);
  --shadow-pop:0 12px 32px -8px rgba(30,25,15,.22),0 2px 6px rgba(30,25,15,.08),0 0 0 1px rgba(30,25,15,.08);
  --scrim:rgba(20,18,14,.32);
  --r-sm:6px; --r-md:8px; --r-lg:12px;
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131312; --side:#181817; --surface:#1C1C1A; --surface-2:#20201E;
    --hover:rgba(255,250,240,.05); --press:rgba(255,250,240,.09);
    --line:#2A2927; --line-strong:#383633;
    --ink:#EDEBE6; --ink-2:#C9C5BD; --muted:#8E8A82; --faint:#625F59;
    --accent:#7D9BFF; --accent-ink:#0E1220; --accent-soft:rgba(125,155,255,.12); --accent-line:rgba(125,155,255,.4);
    --focus-row:rgba(125,155,255,.08);
    --urgent:#F0604F; --high:#F09A3E;
    --st-triage:#A585FF; --st-backlog:#6E6A63; --st-todo:#9A958C; --st-progress:#F0B92E; --st-review:#2DBE9E; --st-done:#7D9BFF; --st-canceled:#6E6A63;
    --shadow-1:0 0 0 1px rgba(255,255,255,.06);
    --shadow-pop:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
    --scrim:rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131312; --side:#181817; --surface:#1C1C1A; --surface-2:#20201E;
  --hover:rgba(255,250,240,.05); --press:rgba(255,250,240,.09);
  --line:#2A2927; --line-strong:#383633;
  --ink:#EDEBE6; --ink-2:#C9C5BD; --muted:#8E8A82; --faint:#625F59;
  --accent:#7D9BFF; --accent-ink:#0E1220; --accent-soft:rgba(125,155,255,.12); --accent-line:rgba(125,155,255,.4);
  --focus-row:rgba(125,155,255,.08);
  --urgent:#F0604F; --high:#F09A3E;
  --st-triage:#A585FF; --st-backlog:#6E6A63; --st-todo:#9A958C; --st-progress:#F0B92E; --st-review:#2DBE9E; --st-done:#7D9BFF; --st-canceled:#6E6A63;
  --shadow-1:0 0 0 1px rgba(255,255,255,.06);
  --shadow-pop:0 16px 40px -8px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.5);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"ss01","cv11"}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:4px}
.i{flex:none;display:block}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--surface);color:var(--muted);font:500 10.5px/1 var(--mono)}
.kbd + .kbd{margin-left:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (hover:none){ .kbd,.hide-touch{display:none!important} }

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100vh;height:100dvh}
.app.panel-open{grid-template-columns:236px minmax(0,1fr) minmax(420px,34vw)}

/* ---------- sidebar ---------- */
.sidebar{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 8px}
.ws{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-radius:var(--r-sm)}
.ws-mark{width:22px;height:22px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px/1 var(--font)}
.ws-name{font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:28px;height:28px;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.icon-btn:active{background:var(--press)}
.side-search{display:flex;align-items:center;gap:8px;margin:8px 0 6px;height:30px;padding:0 8px;border-radius:var(--r-sm);color:var(--muted);width:100%;background:var(--surface);box-shadow:var(--shadow-1)}
.side-search .lbl{flex:1;text-align:left;white-space:nowrap}
.side-search:hover{color:var(--ink)}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:6px}
.nav-h{font-size:11.5px;font-weight:500;color:var(--faint);padding:14px 8px 4px;display:flex;align-items:center;gap:6px}
.nav a{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;cursor:pointer;user-select:none}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1);font-weight:500}
.nav a .i{color:var(--muted)}
.nav a[aria-current="page"] .i{color:var(--ink)}
.nav a .count{margin-left:auto;font:500 11.5px/1 var(--mono);color:var(--faint)}
.nav a .count.hot{background:var(--st-triage);color:#fff;border-radius:9px;padding:3px 6px}
.members a .av{width:18px;height:18px;font-size:8.5px}
.members a.on{background:var(--accent-soft);color:var(--ink)}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:4px;padding-top:8px;border-top:1px solid var(--line)}
.side-foot .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0;padding:4px 6px;font-size:12.5px;color:var(--ink-2)}

/* ---------- main ---------- */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--surface)}
.topbar{display:flex;align-items:center;gap:10px;height:52px;padding:0 14px 0 18px;border-bottom:1px solid var(--line);flex:none}
.topbar h1{font-size:14px;font-weight:600;margin:0;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.topbar h1 .n{font:500 12px/1 var(--mono);color:var(--faint)}
.menu-btn{display:none}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);width:min(280px,30vw);color:var(--muted);transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:100%;font-size:13px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:var(--r-sm);font-weight:500;font-size:13px;white-space:nowrap}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-primary:hover{opacity:.9}
.btn-primary .kbd{background:transparent;border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:color-mix(in srgb,var(--bg) 75%,transparent)}
.btn-ghost{border:1px solid var(--line);background:var(--surface)}
.btn-ghost:hover{background:var(--hover)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.05)}

.filterbar{display:flex;align-items:center;gap:6px;padding:8px 14px 8px 18px;border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.filterbar::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:13px;border:1px dashed var(--line-strong);color:var(--muted);font-size:12.5px;white-space:nowrap;flex:none}
.fchip:hover{color:var(--ink);border-color:var(--faint)}
.fchip.on{border-style:solid;border-color:var(--accent-line);background:var(--accent-soft);color:var(--ink);padding-right:3px}
.fchip .k{color:var(--muted)}
.fchip .icons{display:inline-flex}
.fchip .icons > *{margin-left:-3px}
.fchip .icons > *:first-child{margin-left:0}
.fchip .x{width:20px;height:20px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.fchip .x:hover{background:var(--press);color:var(--ink)}
.filterbar .spacer{flex:1}
.filterbar .clear{font-size:12.5px;color:var(--muted);padding:0 6px;height:26px;border-radius:var(--r-sm);white-space:nowrap}
.filterbar .clear:hover{color:var(--ink);background:var(--hover)}

/* ---------- list ---------- */
.list{flex:1;min-height:0;overflow-y:auto;outline:none;container:list/inline-size;padding-bottom:80px;overscroll-behavior:contain}
.ghead{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;background:color-mix(in srgb,var(--surface-2) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.ghead .chev{color:var(--faint);transition:transform .15s var(--ease)}
.ghead.collapsed .chev{transform:rotate(-90deg)}
.ghead .name{font-weight:500;font-size:13px}
.ghead .cnt{font:500 11.5px/1 var(--mono);color:var(--faint)}
.ghead .add{margin-left:auto;opacity:0}
.ghead:hover .add{opacity:1}
.ghead .add:focus-visible{opacity:1}
.ghead .hint{font-size:12px;color:var(--muted);margin-left:6px}

.row{position:relative;display:grid;grid-template-columns:18px 18px 62px 18px minmax(0,1fr) auto 22px 50px;align-items:center;column-gap:8px;height:38px;padding:0 14px 0 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);cursor:default;user-select:none}
.row:hover{background:var(--hover)}
.row.focus{background:var(--focus-row)}
.row.open::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;background:var(--accent)}
.row.sel{background:var(--accent-soft)}
.row .cb{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-strong);display:grid;place-items:center;opacity:0;transition:opacity .1s;color:var(--accent-ink);background:var(--surface)}
.row:hover .cb,.list.selecting .cb,.row.focus .cb{opacity:1}
.row.sel .cb{background:var(--accent);border-color:var(--accent);opacity:1}
.row .hit{display:grid;place-items:center;width:22px;height:22px;margin:-2px;border-radius:5px}
.row .hit:hover{background:var(--press)}
.row .id{color:var(--muted)}
.row .title{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row.closed .title{color:var(--muted)}
.row .labels{display:flex;gap:4px;justify-content:flex-end;overflow:hidden}
.row .date{font-size:12px;color:var(--faint);text-align:right;white-space:nowrap}
.row .meta{display:none}
.row .new-dot{display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--st-triage);margin-right:7px;vertical-align:1px}
@container list (max-width:720px){ .row .labels > *{display:none} }

.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:10px;border:1px solid var(--line);font-size:11.5px;color:var(--ink-2);white-space:nowrap;background:var(--surface)}
.dot{width:7px;height:7px;border-radius:50%;flex:none}

.av{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font:600 9px/1 var(--font);letter-spacing:.02em;flex:none;box-shadow:0 0 0 1.5px var(--surface)}
.av.lg{width:26px;height:26px;font-size:10.5px}
.av.none{background:none;border:1.5px dashed var(--faint);box-shadow:none}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:80px 24px;color:var(--muted)}
.empty .glyph{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--faint)}
.empty h2{margin:4px 0 0;font-size:14px;color:var(--ink);font-weight:600}
.empty p{margin:0;max-width:300px}

/* ---------- panel ---------- */
.panel{display:none;flex-direction:column;min-width:0;min-height:0;background:var(--surface);border-left:1px solid var(--line)}
.app.panel-open .panel{display:flex;animation:panelIn .22s var(--ease)}
@keyframes panelIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.p-head{display:flex;align-items:center;gap:4px;height:52px;padding:0 10px 0 16px;border-bottom:1px solid var(--line);flex:none}
.p-crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;min-width:0}
.p-crumb b{color:var(--ink);font-weight:500}
.p-head .pos{font:500 11.5px/1 var(--mono);color:var(--faint);margin:0 4px 0 auto}
.p-body{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 24px;overscroll-behavior:contain}
.triage-card{border:1px solid color-mix(in srgb,var(--st-triage) 35%,var(--line));background:color-mix(in srgb,var(--st-triage) 7%,var(--surface));border-radius:var(--r-lg);padding:12px 12px 12px 14px;margin-bottom:16px}
.triage-card .t{display:flex;align-items:center;gap:8px;font-weight:500}
.triage-card .s{color:var(--muted);font-size:12.5px;margin:3px 0 10px 22px}
.triage-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-left:22px}
.triage-card .btn{height:28px;padding:0 9px}
.p-title{display:block;width:100%;border:0;outline:0;resize:none;background:none;font:600 19px/1.3 var(--font);letter-spacing:-.012em;padding:2px 0;margin:0 0 12px;overflow:hidden;color:var(--ink);border-radius:4px}
.p-title:focus{box-shadow:0 0 0 3px var(--accent-soft)}
.props{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.prop{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.prop:hover{background:var(--hover);border-color:var(--line-strong);color:var(--ink)}
.prop.ghost{border-style:dashed;color:var(--muted)}
.desc{font-size:14px;line-height:1.6;color:var(--ink-2);border-radius:var(--r-sm);margin:0 -8px;padding:4px 8px;cursor:text}
.desc:hover{background:var(--hover)}
.desc p{margin:0 0 10px}
.desc ul{margin:0 0 10px;padding-left:20px}
.desc li{margin:2px 0}
.desc code,.c-body code{font:12.5px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.desc pre{font:12.5px/1.5 var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;overflow-x:auto;margin:0 0 10px}
.desc .placeholder{color:var(--faint)}
.desc-edit{display:block;width:calc(100% + 16px);margin:0 -8px;min-height:140px;padding:8px;border:1px solid var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);border-radius:var(--r-sm);background:var(--surface);font:13.5px/1.6 var(--mono);outline:0;resize:vertical}
.pr{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
.pr .pr-ic{color:var(--st-review)}
.pr .pr-ic.draft{color:var(--faint)}
.pr .t{flex:1;min-width:0}
.pr .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:13px}
.pr .t div:last-child{font-size:12px;color:var(--muted)}
.pr .diff{font:500 11.5px var(--mono);white-space:nowrap}
.pr .diff .a{color:var(--st-review)} .pr .diff .d{color:var(--urgent)}
.checks{display:inline-flex;align-items:center;gap:4px}
.checks .dot{width:6px;height:6px}
.p-meta{font-size:12px;color:var(--faint);margin:16px 0 0;padding-bottom:16px;border-bottom:1px solid var(--line)}
.p-sec{font-size:12px;font-weight:500;color:var(--muted);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:9.5px;top:8px;bottom:8px;width:1px;background:var(--line)}
.ev{position:relative;display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:12.5px;color:var(--muted)}
.ev .bullet{width:20px;height:20px;display:grid;place-items:center;flex:none;background:var(--surface);position:relative}
.ev .bullet .av{width:16px;height:16px;font-size:7px}
.ev b{color:var(--ink-2);font-weight:500}
.ev .when{color:var(--faint);white-space:nowrap}
.cm{position:relative;display:flex;gap:10px;padding:8px 0}
.cm .card{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r-md);padding:9px 12px;background:var(--surface)}
.cm .hd{display:flex;gap:8px;align-items:baseline;font-size:12.5px;margin-bottom:3px}
.cm .hd b{font-weight:500}
.cm .hd span{color:var(--faint)}
.c-body{font-size:13.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap;word-wrap:break-word}
.cm.fresh .card{animation:fresh 1.2s var(--ease)}
@keyframes fresh{from{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft)}}
.composer{flex:none;padding:10px 16px 14px;border-top:1px solid var(--line);background:var(--surface)}
.composer .box{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);transition:border-color .15s,box-shadow .15s}
.composer .box:focus-within{border-color:var(--accent-line);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
.composer textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;padding:9px 12px 4px;min-height:38px;max-height:180px;font-size:13.5px}
.composer .bar{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:4px 6px 6px 12px}
.composer .bar .tip{margin-right:auto;font-size:11.5px;color:var(--faint)}
.composer .btn{height:26px;padding:0 10px;font-size:12.5px}
.composer .btn[disabled]{opacity:.4;cursor:default}

/* ---------- picker / palette ---------- */
.layer{position:fixed;inset:0;z-index:50}
.layer.dim{background:var(--scrim);animation:fade .14s ease-out}
@keyframes fade{from{opacity:0}}
.picker{position:absolute;width:280px;max-height:min(420px,70vh);display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);overflow:hidden;animation:pop .14s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.picker.center{left:50%;top:12vh;width:min(640px,calc(100vw - 32px));transform:translateX(-50%);max-height:min(520px,72vh);animation:popc .16s var(--ease)}
@keyframes popc{from{opacity:0;transform:translateX(-50%) translateY(-6px) scale(.985)}}
.picker .ctx{display:flex;align-items:center;gap:6px;padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.picker .ctx .tag{font:500 11px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.picker .q{display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--faint)}
.picker .q input{flex:1;border:0;outline:0;background:none;height:40px;font-size:13.5px;color:var(--ink)}
.picker.center .q input{height:52px;font-size:15px}
.picker .items{overflow-y:auto;padding:4px;overscroll-behavior:contain}
.picker .gh{font-size:11px;font-weight:500;color:var(--faint);padding:8px 10px 4px}
.picker .it{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink-2);font-size:13px}
.picker.center .it{height:38px}
.picker .it[aria-selected="true"]{background:var(--hover);color:var(--ink)}
.picker .it .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker .it .lbl .sub{color:var(--faint);margin-left:6px}
.picker .it .chk{color:var(--accent);width:16px}
.picker .it .box{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--accent-ink)}
.picker .it .box.on{background:var(--accent);border-color:var(--accent)}
.picker .none{padding:22px 12px;text-align:center;color:var(--muted);font-size:13px}
.picker .foot{display:flex;gap:14px;padding:7px 12px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);background:var(--surface-2)}
.picker .foot span{display:inline-flex;align-items:center;gap:5px}

/* ---------- modal ---------- */
.modal{position:absolute;left:50%;top:10vh;transform:translateX(-50%);width:min(640px,calc(100vw - 32px));background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-pop);display:flex;flex-direction:column;max-height:80vh;animation:popc .16s var(--ease)}
.modal .mh{display:flex;align-items:center;gap:8px;padding:12px 12px 0 18px;font-size:12.5px;color:var(--muted)}
.modal .mh .tag{font:500 11px var(--mono);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-2)}
.modal .mb{padding:10px 18px 4px;overflow-y:auto}
.modal .mb input{width:100%;border:0;outline:0;background:none;font:600 18px/1.3 var(--font);padding:6px 0}
.modal .mb input::placeholder,.modal .mb textarea::placeholder{color:var(--faint)}
.modal .mb textarea{width:100%;border:0;outline:0;background:none;resize:none;min-height:96px;font-size:14px;line-height:1.6;padding:4px 0}
.modal .mprops{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px 14px}
.modal .mf{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.modal .mf .tip{margin-right:auto;padding-left:6px;font-size:12px;color:var(--faint)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;padding:6px 18px 18px}
.keys h3{grid-column:1/-1;font-size:11.5px;color:var(--faint);font-weight:500;margin:12px 0 4px}
.keys div{display:flex;align-items:center;justify-content:space-between;gap:12px;height:30px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-2)}

/* ---------- bulk bar + toasts ---------- */
.bulk{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:2px;padding:4px;background:var(--ink);color:var(--bg);border-radius:12px;box-shadow:var(--shadow-pop);animation:rise .18s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
.bulk .n{padding:0 10px 0 8px;font-weight:500;font-size:12.5px;white-space:nowrap}
.bulk button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;font-size:12.5px;white-space:nowrap}
.bulk button:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.bulk .kbd{background:transparent;border-color:color-mix(in srgb,var(--bg) 30%,transparent);color:color-mix(in srgb,var(--bg) 70%,transparent)}
.bulk .sep{width:1px;height:18px;background:color-mix(in srgb,var(--bg) 20%,transparent);margin:0 2px}
.toasts{position:fixed;left:252px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-width:240px;max-width:380px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow-pop);font-size:13px;animation:toastIn .2s var(--ease)}
.toast .msg{flex:1;min-width:0}
.toast .msg b{font-weight:500}
.toast button{height:26px;padding:0 8px;border-radius:6px;color:var(--accent);font-weight:500;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.toast button:hover{background:var(--accent-soft)}
.toast.out{animation:toastOut .18s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
@keyframes toastOut{to{opacity:0;transform:translateY(6px)}}
.fab{display:none}
.scrim{display:none}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .app.panel-open{grid-template-columns:236px minmax(0,1fr)}
  .panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,94vw);z-index:30;box-shadow:var(--shadow-pop)}
}
@media (max-width:760px){
  .ghead .hint{display:none}
  .app,.app.panel-open{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(288px,84vw);z-index:35;transform:translateX(-102%);transition:transform .24s var(--ease);padding-top:max(10px,env(safe-area-inset-top))}
  .app.nav-open .sidebar{transform:none;box-shadow:var(--shadow-pop)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:34;animation:fade .2s}
  .menu-btn{display:grid;margin-left:-6px}
  .topbar{padding:0 8px 0 12px;gap:6px;padding-top:env(safe-area-inset-top);height:calc(52px + env(safe-area-inset-top))}
  .topbar .search{display:none}
  .topbar .new-btn{display:none}
  .topbar .palette-btn{margin-left:auto}
  .filterbar{padding:8px 12px}
  .panel{width:100vw;border-left:0;padding-top:env(safe-area-inset-top)}
  .app.panel-open .panel{animation:sheetIn .26s var(--ease)}
  @keyframes sheetIn{from{transform:translateX(100%)}}
  .p-body{padding:16px 16px 24px}
  .composer{padding-bottom:max(14px,env(safe-area-inset-bottom))}
  .row{grid-template-columns:18px 18px minmax(0,1fr) 22px;grid-template-areas:"pri st title av" ". . meta meta";height:auto;min-height:58px;padding:9px 14px 9px 12px;row-gap:3px;column-gap:9px}
  .row .cb,.row .id,.row .labels,.row .date{display:none}
  .row .pri{grid-area:pri} .row .st{grid-area:st} .row .title{grid-area:title;font-size:14px} .row .asg{grid-area:av}
  .row .meta{grid-area:meta;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);min-width:0;overflow:hidden;white-space:nowrap}
  .row .meta .dot{width:6px;height:6px}
  .row .hit{width:30px;height:30px;margin:-6px}
  .ghead{height:38px}
  .ghead .add{opacity:1}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:16px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow-pop);z-index:20}
  .app.panel-open ~ .fab{display:none}
  .toasts{left:16px;right:16px;bottom:84px;align-items:center}
  .toast{min-width:0;width:100%}
  .bulk{bottom:max(16px,env(safe-area-inset-bottom));max-width:calc(100vw - 24px);overflow-x:auto}
  .bulk .kbd{display:none}
  .picker:not(.center){left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto;max-height:62vh;animation:sheetUp .2s var(--ease)}
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0}}
  .picker.center{top:8px}
  .modal{top:8px}
  .keys{grid-template-columns:1fr}
  .picker .foot{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation"></button>
      <h1 id="viewTitle"></h1>
      <label class="search" id="searchBox">
        <span id="searchIc"></span>
        <input id="search" type="search" placeholder="Filter by title or ID" autocomplete="off" aria-label="Filter issues by title or ID">
        <span class="kbd">/</span>
      </label>
      <button class="icon-btn palette-btn" id="paletteBtn" aria-label="Open command palette (Command K)"></button>
      <button class="btn btn-primary new-btn" id="newBtn"><span id="newIc"></span>New issue <span class="kbd">C</span></button>
    </header>
    <div class="filterbar" id="filterbar" role="toolbar" aria-label="Filters"></div>
    <div class="list" id="list" role="listbox" tabindex="0" aria-label="Issues"></div>
  </main>
  <section class="panel" id="panel" aria-label="Issue details">
    <div class="p-head" id="phead"></div>
    <div class="p-body" id="pbody"></div>
    <div class="composer">
      <div class="box">
        <textarea id="composer" rows="1" placeholder="Leave a comment…" aria-label="Comment"></textarea>
        <div class="bar"><span class="tip hide-touch"><span class="kbd">⌘</span><span class="kbd">↵</span> to send</span><button class="btn btn-accent" id="sendBtn" disabled>Comment</button></div>
      </div>
    </div>
  </section>
</div>
<button class="fab" id="fab" aria-label="New issue"></button>
<div id="layer"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="bulk"></div>

<script>
(() => {
'use strict';
/* ================= icons ================= */
const P = {
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',

  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',

  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',

  link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  pr:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V9a3 3 0 0 0-3-3h-4"/><path d="m13 3.5-2.5 2.5L13 8.5"/>',
  tag:'<path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
  filter:'<path d="M3 6h18M7 12h10M10 18h4"/>',
  command:'<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
  copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  dup:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/>',
  ban:'<circle cx="12" cy="12" r="9"/><path d="m5.7 5.7 12.6 12.6"/>',
  arrowr:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  sidebar:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  sparkle:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
};
const ic = (n, s = 16, sw = 1.75) => `<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;

function pie(f) {
  if (f >= 1) return '<circle cx="7" cy="7" r="3" fill="currentColor"/>';
  const a = 2 * Math.PI * f, x = 7 + 3 * Math.sin(a), y = 7 - 3 * Math.cos(a);
  return `<path d="M7 7V4A3 3 0 ${f > .5 ? 1 : 0} 1 ${x.toFixed(2)} ${y.toFixed(2)}Z" fill="currentColor"/>`;
}
function statusIcon(id, s = 14) {
  const c = { triage:'--st-triage', backlog:'--st-backlog', todo:'--st-todo', progress:'--st-progress', review:'--st-review', done:'--st-done', canceled:'--st-canceled' }[id];
  let inner;
  switch (id) {
    case 'triage': inner = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.6 6h4.6M7.6 4.4 9.2 6 7.6 7.6M9.4 8.2H4.8M6.4 6.6 4.8 8.2l1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>'; break;
    case 'backlog': inner = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="1.6 1.8"/>'; break;
    case 'todo': inner = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/>'; break;
    case 'progress': inner = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/>' + pie(.5); break;
    case 'review': inner = '<circle cx="7" cy="7" r="5.6" fill="none" stroke="currentColor" stroke-width="1.5"/>' + pie(.75); break;
    case 'done': inner = '<circle cx="7" cy="7" r="6.3" fill="currentColor"/><path d="m4.3 7.1 1.9 1.9 3.6-3.7" fill="none" stroke="var(--surface)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'; break;
    case 'canceled': inner = '<circle cx="7" cy="7" r="6.3" fill="currentColor"/><path d="m5 5 4 4M9 5 5 9" fill="none" stroke="var(--surface)" stroke-width="1.5" stroke-linecap="round"/>'; break;
  }
  return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 14 14" style="color:var(${c})" aria-hidden="true">${inner}</svg>`;
}
function priIcon(p, s = 14) {
  if (p === 1) return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="12" rx="3" fill="var(--urgent)"/><rect x="6.3" y="3.4" width="1.4" height="4.6" rx=".7" fill="#fff"/><rect x="6.3" y="9.1" width="1.4" height="1.5" rx=".7" fill="#fff"/></svg>`;
  if (!p) return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 14 14" aria-hidden="true" style="color:var(--faint)"><rect x="1.5" y="6.3" width="2.6" height="1.4" rx=".7" fill="currentColor"/><rect x="5.7" y="6.3" width="2.6" height="1.4" rx=".7" fill="currentColor"/><rect x="9.9" y="6.3" width="2.6" height="1.4" rx=".7" fill="currentColor"/></svg>`;
  const lvl = { 2: 3, 3: 2, 4: 1 }[p];
  const col = p === 2 ? 'var(--high)' : 'var(--ink-2)';
  const bars = [[1.5, 8, 4], [5.75, 5, 7], [10, 2, 10]].map(([x, y, h], i) => `<rect x="${x}" y="${y}" width="2.6" height="${h}" rx=".8" fill="currentColor" opacity="${i < lvl ? 1 : .25}"/>`).join('');
  return `<svg class="i" width="${s}" height="${s}" viewBox="0 0 14 14" aria-hidden="true" style="color:${col}">${bars}</svg>`;

/* ================= data ================= */
const M = 6e4, H = 36e5, D = 864e5, NOW = Date.now();
const PEOPLE = {
  maya:  { name:'Maya Chen',    first:'Maya',  ini:'MC', c:'#C2532E', role:'Eng lead' },
  tomas: { name:'Tomás Rivera', first:'Tomás', ini:'TR', c:'#1E7F6E', role:'Infra' },
  priya: { name:'Priya Nair',   first:'Priya', ini:'PN', c:'#7A4FD6', role:'Backend' },
  jonah: { name:'Jonah Weiss',  first:'Jonah', ini:'JW', c:'#2F67C9', role:'Backend' },
  ade:   { name:'Ade Okafor',   first:'Ade',   ini:'AO', c:'#A8661A', role:'On call' },
  lena:  { name:'Lena Fischer', first:'Lena',  ini:'LF', c:'#B83C78', role:'Frontend' },
};
const ME = 'maya';
const STATUSES = [
  { id:'triage', name:'Triage' }, { id:'progress', name:'In Progress' }, { id:'review', name:'In Review' },
  { id:'todo', name:'Todo' }, { id:'backlog', name:'Backlog' }, { id:'done', name:'Done' }, { id:'canceled', name:'Canceled' },
];
const STATUS_PICK_ORDER = ['triage','backlog','todo','progress','review','done','canceled'];
const PRIS = [{ id:1, name:'Urgent' }, { id:2, name:'High' }, { id:3, name:'Medium' }, { id:4, name:'Low' }, { id:0, name:'No priority' }];
const PRI_RANK = { 1:0, 2:1, 3:2, 4:3, 0:4 };
const LABELS = {
  bug:{ name:'Bug', c:'#E0533D' }, feature:{ name:'Feature', c:'#3E7BE6' }, perf:{ name:'Performance', c:'#D99A0B' },
  infra:{ name:'Infra', c:'#1E9C86' }, api:{ name:'API', c:'#8A5CF0' }, web:{ name:'Web', c:'#D9488F' },
  debt:{ name:'Tech debt', c:'#8F8A80' }, security:{ name:'Security', c:'#B4442B' },
};
const sName = id => STATUSES.find(s => s.id === id).name;
const pName = id => PRIS.find(p => p.id === id).name;

const C = (who, ago, text) => ({ who, at: NOW - ago, text });
const E = (who, ago, text) => ({ who, at: NOW - ago, text });
function I(n, title, status, pri, who, labels, created, updated, reporter, desc, more = {}) {
  return { n, title, status, pri, who, labels, created: NOW - created, updated: NOW - updated, reporter, desc,
    via: more.via || null, comments: more.comments || [], events: more.events || [], pr: more.pr || null };
}

let issues = [
  I(412, 'Webhook retries fire twice after a 502 from the receiver', 'triage', 0, null, ['bug','api'], 41*M, 19*M, 'ade',
`Receivers that answer **502** get the same event delivered twice, about 400 ms apart. Two customers have reported it since Friday's deploy (\`v2026.11.13\`).

- The retry worker picks the job up before the first attempt's timeout handler marks it failed
- Both attempts carry the same \`Webhook-Id\`, so idempotent receivers are fine; most aren't
- Started after we dropped the visibility timeout from 30s to 5s in #2198

Repro: point a test endpoint at \`httpbin.org/status/502\` and watch \`webhook_attempts\` for the event.`,
    { via:'Sentry alert', comments:[ C('ade', 38*M, 'Pulled 24h of logs: 1,142 duplicate deliveries across 31 workspaces. Acme and Brightline both opened tickets.'), C('tomas', 19*M, "That's my visibility-timeout change. Happy to take it. The fix is to extend the lease while the HTTP call is still in flight.") ] }),
  I(411, 'CSV export silently truncates at 65,535 rows', 'triage', 0, null, ['bug'], 1.6*H, 1.4*H, 'lena',
`Support ticket #48213 (Halden Logistics). Their audit export stops at row 65,535 with no error, and the file looks complete.

Looks like the legacy XLSX row cap leaking into the CSV writer through \`ExportLimits.default\`.`, { via:'Support' }),
  I(410, 'Login page flashes unstyled content on Safari 18', 'triage', 0, null, ['bug','web'], 3.2*H, 3.2*H, 'jonah',
`On a cold load in Safari 18.1 the login form renders without styles for ~300 ms. Chrome and Firefox are fine.

Probably the \`media="print"\` font-loading trick; Safari doesn't swap the stylesheet until after first paint.` ),

/* ================= state ================= */
const VIEWS = {
  triage:  { name:'Triage',      icon:'inbox',   pred: i => i.status === 'triage' },
  mine:    { name:'My issues',   icon:'user',    pred: i => i.who === ME && !['done','canceled'].includes(i.status) },
  active:  { name:'Active',      icon:'active',  pred: i => ['progress','review','todo'].includes(i.status) },
  backlog: { name:'Backlog',     icon:'archive', pred: i => i.status === 'backlog' },
  all:     { name:'All issues',  icon:'list',    pred: () => true },
};
const isPhone = () => matchMedia('(max-width:760px)').matches;
const state = {
  view:'all', q:'',
  f:{ status:new Set(), pri:new Set(), who:new Set() },
  collapsed:new Set(['done','canceled']),
  focus:412, open: null, sel:new Set(),
  editingDesc:false, drafts:{}, freshComment:null,
};
state.open = isPhone() ? null : 412;
const undoStack = [];

/* ================= helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const byN = n => issues.find(i => i.n === n);
const key = n => 'PLT-' + n;
function ago(t, long) {
  const d = Date.now() - t;
  if (d < M) return 'just now';
  if (d < H) return Math.floor(d / M) + (long ? ' min ago' : 'm');
  if (d < D) return Math.floor(d / H) + (long ? (Math.floor(d / H) === 1 ? ' hour ago' : ' hours ago') : 'h');
  if (d < 7 * D) return Math.floor(d / D) + (long ? (Math.floor(d / D) === 1 ? ' day ago' : ' days ago') : 'd');
  return new Date(t).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
const fullDate = t => new Date(t).toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
const av = (who, cls = '') => who ? `<span class="av ${cls}" style="--c:${PEOPLE[who].c}" title="${esc(PEOPLE[who].name)}">${PEOPLE[who].ini}</span>` : `<span class="av none ${cls}" title="Unassigned"></span>`;
const labelPill = l => `<span class="pill"><span class="dot" style="background:${LABELS[l].c}"></span>${LABELS[l].name}</span>`;
function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); }
function md(src) {
  if (!src.trim()) return '<p class="placeholder">Add a description…</p>';
  return src.trim().split(/\n{2,}/).map(b => {
    if (b.startsWith('```')) return '<pre><code>' + esc(b.replace(/^```\w*\n?/, '').replace(/\n?```$/, '')) + '</code></pre>';
    const lines = b.split('\n');
    if (lines.every(l => /^\s*[-*] /.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*[-*] /, '')) + '</li>').join('') + '</ul>';
    return '<p>' + lines.map(inline).join('<br>') + '</p>';
  }).join('');
}
function autosize(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

/* ================= derived ================= */
function filtered() {
  const q = state.q.trim().toLowerCase();
  return issues.filter(i => VIEWS[state.view].pred(i))
    .filter(i => !state.f.status.size || state.f.status.has(i.status))
    .filter(i => !state.f.pri.size || state.f.pri.has(i.pri))
    .filter(i => !state.f.who.size || state.f.who.has(i.who || 'none'))
    .filter(i => !q || i.title.toLowerCase().includes(q) || key(i.n).toLowerCase().includes(q) || String(i.n).includes(q))
    .sort((a, b) => PRI_RANK[a.pri] - PRI_RANK[b.pri] || b.updated - a.updated);
}
function grouped() {
  const list = filtered();
  return STATUSES.map(s => ({ s, items: list.filter(i => i.status === s.id) })).filter(g => g.items.length);
}
function navOrder() {
  return grouped().flatMap(g => state.collapsed.has(g.s.id) ? [] : g.items.map(i => i.n));
}
const filtersActive = () => state.f.status.size + state.f.pri.size + state.f.who.size > 0 || !!state.q.trim();
const targets = () => state.sel.size ? [...state.sel] : (state.focus && byN(state.focus) ? [state.focus] : []);
const tLabel = ids => ids.length === 1 ? key(ids[0]) : ids.length + ' issues';

/* ================= render: sidebar ================= */
const sidebar = $('#sidebar');
function renderSidebar() {

  const link = v => `<a data-view="${v}" ${state.view === v ? 'aria-current="page"' : ''} tabindex="0">${ic(VIEWS[v].icon)}<span>${VIEWS[v].name}</span>${v === 'triage' ? `<span class="count ${cnt('triage') ? 'hot' : ''}">${cnt('triage')}</span>` : `<span class="count">${cnt(v)}</span>`}</a>`;
  sidebar.innerHTML = `
    <div class="ws"><span class="ws-mark">N</span><span class="ws-name">Northwind</span>
      <button class="icon-btn" data-act="new" aria-label="New issue" title="New issue  C">${ic('plus')}</button></div>
    <button class="side-search" data-act="palette">${ic('search', 15)}<span class="lbl">Search or jump to…</span><span class="kbd">⌘K</span></button>
    <nav class="nav">${link('triage')}${link('mine')}
      <div class="nav-h"><span class="ws-mark" style="width:16px;height:16px;font-size:9px;border-radius:4px;background:var(--accent);color:var(--accent-ink)">P</span>Platform team</div>
      ${link('active')}${link('backlog')}${link('all')}
      <div class="nav-h">Members</div>
      <div class="members nav">${Object.keys(PEOPLE).map(p => `<a data-member="${p}" class="${state.f.who.size === 1 && state.f.who.has(p) ? 'on' : ''}" tabindex="0" title="Show ${esc(PEOPLE[p].first)}'s issues">${av(p)}<span>${esc(PEOPLE[p].name)}${p === ME ? ' <span style="color:var(--faint)">(you)</span>' : ''}</span><span class="count">${open(p)}</span></a>`).join('')}</div>
    </nav>
    <div class="side-foot">
      <span class="who">${av(ME)}${PEOPLE[ME].name}</span>
      <button class="icon-btn" data-act="keys" aria-label="Keyboard shortcuts" title="Keyboard shortcuts  ?">${ic('keyboard')}</button>
      <button class="icon-btn" data-act="theme" aria-label="Toggle theme" title="Toggle theme">${ic(theme === 'dark' ? 'sun' : 'moon')}</button>
    </div>`;
}

/* ================= render: topbar + filters ================= */
function renderTop() {
  const n = filtered().length;
  $('#viewTitle').innerHTML = `${esc(VIEWS[state.view].name)}<span class="n">${n}</span>`;
}
function fchip(dim, label) {
  const set = state.f[dim];
  if (!set.size) return `<button class="fchip" data-filter="${dim}">${ic('plus', 13)}${label}</button>`;
  const vals = [...set];
  let icons = '', text;
  if (dim === 'status') { icons = vals.slice(0, 3).map(v => statusIcon(v, 13)).join(''); text = vals.length === 1 ? sName(vals[0]) : vals.length + ' statuses'; }
  if (dim === 'pri') { icons = vals.slice(0, 3).map(v => priIcon(v, 13)).join(''); text = vals.length === 1 ? pName(vals[0]) : vals.map(pName).join(', '); }
  if (dim === 'who') { icons = vals.slice(0, 3).map(v => v === 'none' ? av(null) : av(v)).join('').replace(/class="av/g, 'style="width:16px;height:16px;font-size:7px" class="av'); text = vals.length === 1 ? (vals[0] === 'none' ? 'Unassigned' : PEOPLE[vals[0]].first) : vals.length + ' people'; }
  return `<span class="fchip on"><button data-filter="${dim}" style="display:inline-flex;align-items:center;gap:6px"><span class="k">${label} ${vals.length > 1 ? 'is any of' : 'is'}</span><span class="icons">${icons}</span>${esc(text)}</button><button class="x" data-clear="${dim}" aria-label="Remove ${label} filter">${ic('x', 12, 2)}</button></span>`;
}
function renderFilters() {
  $('#filterbar').innerHTML = `${fchip('status', 'Status')}${fchip('pri', 'Priority')}${fchip('who', 'Assignee')}
    <span class="spacer"></span>
    ${filtersActive() ? `<button class="clear" data-act="clear-filters">Clear</button>` : `<span class="kbd hide-touch" title="Filter">F</span>`}`;
}

/* ================= render: list ================= */
const list = $('#list');
function rowHTML(i) {
  const closed = ['done','canceled'].includes(i.status);
  const isNew = i.status === 'triage' && Date.now() - i.created < 24 * H;
  return `<div class="row${state.focus === i.n ? ' focus' : ''}${state.open === i.n ? ' open' : ''}${state.sel.has(i.n) ? ' sel' : ''}${closed ? ' closed' : ''}" id="r-${i.n}" data-n="${i.n}" role="option" aria-selected="${state.open === i.n}">

  </div>`;
}
function renderList() {
  const groups = grouped();
  list.classList.toggle('selecting', state.sel.size > 0);
  if (!groups.length) {
    const triageClear = state.view === 'triage' && !filtersActive();
    list.innerHTML = `<div class="empty"><div class="glyph">${ic(triageClear ? 'check' : 'filter', 20)}</div>

      ${triageClear ? `<button class="btn btn-ghost" data-act="goto-active">Go to Active ${ic('arrowr', 14)}</button>` : `<button class="btn btn-ghost" data-act="clear-filters">Clear filters</button>`}</div>`;
    list.removeAttribute('aria-activedescendant');

  }
  list.innerHTML = groups.map(g => {
    const col = state.collapsed.has(g.s.id);

      <button class="icon-btn add" data-act="add" aria-label="New issue in ${g.s.name}" tabindex="-1">${ic('plus', 15)}</button>
    </div>${col ? '' : g.items.map(rowHTML).join('')}`;
  }).join('');
  if (state.focus && $('#r-' + state.focus)) list.setAttribute('aria-activedescendant', 'r-' + state.focus);
}
function scrollFocus() {
  const el = state.focus && $('#r-' + state.focus);
  if (!el) return;
  const top = el.offsetTop - 34, bottom = el.offsetTop + el.offsetHeight;
  if (top < list.scrollTop) list.scrollTop = top;
  else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 8;
}

/* ================= mutations ================= */
function snapshot(ids) { return ids.map(n => structuredClone(byN(n))); }
function commit(ids, mutate, msg) {
  const snap = snapshot(ids);
  let changed = false;
  ids.forEach(n => { const i = byN(n); if (mutate(i) !== false) { i.updated = Date.now(); changed = true; } });
  if (!changed) return;
  undoStack.push(snap);
  render();
  toast(msg, true);
}
function setStatus(ids, s, verb) {
  commit(ids, i => { if (i.status === s) return false; i.status = s; i.events.push(E(ME, 0, verb || `changed status to <b>${sName(s)}</b>`)); },
    `${tLabel(ids)} → <b>${sName(s)}</b>`);
}
function setPri(ids, p) {
  commit(ids, i => { if (i.pri === p) return false; i.pri = p; i.events.push(E(ME, 0, p ? `set priority to <b>${pName(p)}</b>` : 'removed priority')); },
    `${tLabel(ids)} priority → <b>${pName(p)}</b>`);
}
function setWho(ids, w) {
  commit(ids, i => { if (i.who === w) return false; i.who = w; i.events.push(E(ME, 0, w ? (w === ME ? 'self-assigned the issue' : `assigned to <b>${esc(PEOPLE[w].name)}</b>`) : 'removed the assignee')); },
    w ? `${tLabel(ids)} assigned to <b>${esc(w === ME ? 'you' : PEOPLE[w].first)}</b>` : `${tLabel(ids)} unassigned`);
}
function toggleLabel(ids, l) {
  const all = ids.every(n => byN(n).labels.includes(l));
  commit(ids, i => {
    if (all) { i.labels = i.labels.filter(x => x !== l); i.events.push(E(ME, 0, `removed label <b>${LABELS[l].name}</b>`)); }
    else { if (i.labels.includes(l)) return false; i.labels.push(l); i.events.push(E(ME, 0, `added label <b>${LABELS[l].name}</b>`)); }
  }, `${all ? 'Removed' : 'Added'} <b>${LABELS[l].name}</b> ${all ? 'from' : 'to'} ${tLabel(ids)}`);
}
function undo() {
  const snap = undoStack.pop();
  if (!snap) { toast('Nothing to undo'); return; }
  if (snap.remove) {
    issues = issues.filter(i => i.n !== snap.remove);
    if (state.open === snap.remove) state.open = null;
    state.sel.delete(snap.remove); ensureFocusVisible();
  } else snap.forEach(s => { const k = issues.findIndex(i => i.n === s.n); if (k >= 0) issues[k] = s; });
  render(); toast('Undone');
}

/* triage */
function triageAct(kind, n = state.open || state.focus) {
  const i = byN(n); if (!i || i.status !== 'triage') return;
  const order = navOrder().filter(x => byN(x).status === 'triage');
  const k = order.indexOf(n), next = order[k + 1] ?? order[k - 1] ?? null;
  const advance = () => {
    if (next) { state.focus = next; if (state.open) state.open = next; }
    else { state.focus = n; }
    render(); scrollFocus();
  };
  if (kind === 'accept') {
    const snap = snapshot([n]);
    i.status = 'todo'; i.updated = Date.now(); i.events.push(E(ME, 0, 'accepted the issue into <b>Todo</b>'));
    undoStack.push(snap); toast(`Accepted ${key(n)} into <b>Todo</b>`, true); advance();
  } else if (kind === 'decline') {
    const snap = snapshot([n]);
    i.status = 'canceled'; i.updated = Date.now(); i.events.push(E(ME, 0, 'declined the issue'));
    undoStack.push(snap); toast(`Declined ${key(n)}`, true); advance();
  } else if (kind === 'duplicate') {
    openPicker({
      ctx:`Mark ${key(n)} as duplicate of…`, placeholder:'Search issues', center:true,
      items: q => issues.filter(x => x.n !== n && !['canceled'].includes(x.status)).map(x => ({ label:x.title, sub:key(x.n), icon:statusIcon(x.status), kw:key(x.n),
        run: () => {
          const snap = snapshot([n]);
          i.status = 'canceled'; i.updated = Date.now(); i.events.push(E(ME, 0, `marked as duplicate of <b>${key(x.n)}</b>`));
          undoStack.push(snap); toast(`${key(n)} marked duplicate of <b>${key(x.n)}</b>`, true); advance();
        } })),
    });
  }
}

/* create */
function createIssue(d) {
  const n = Math.max(...issues.map(i => i.n)) + 1;
  const it = I(n, d.title, d.status, d.pri, d.who, d.labels, 0, 0, ME, d.desc);
  issues.push(it);
  undoStack.push({ remove: n });
  const visible = () => filtered().some(i => i.n === n);
  if (!visible()) { state.view = 'all'; state.f = { status:new Set(), pri:new Set(), who:new Set() }; state.q = ''; $('#search').value = ''; }
  state.collapsed.delete(d.status);
  state.focus = n; state.open = n; lastPanel = null;
  render(); scrollFocus();
  toast(`Created <b>${key(n)}</b>`, true);
}

/* ================= toasts ================= */
function toast(html, withUndo) {
  const box = $('#toasts');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span class="msg">${html}</span>${withUndo ? `<button>${ic('undo', 13)}Undo <span class="kbd hide-touch">⌘Z</span></button>` : ''}`;
  if (withUndo) t.querySelector('button').onclick = () => { dismiss(); undo(); };
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  let timer = setTimeout(dismiss, 4800);
  t.onmouseenter = () => clearTimeout(timer);
  t.onmouseleave = () => { timer = setTimeout(dismiss, 2000); };
  function dismiss() { clearTimeout(timer); t.classList.add('out'); setTimeout(() => t.remove(), 180); }
}

function openCreate(preset = {}) {
  closePicker();
  const d = { title:'', desc:'', status: preset.status || (state.view === 'triage' ? 'triage' : state.view === 'backlog' ? 'backlog' : 'todo'), pri:0, who: state.view === 'mine' ? ME : null, labels:[] };
  layer.innerHTML = `<div class="layer dim" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="New issue">
    <div class="mh"><span class="tag">PLT</span>${ic('right', 12)}New issue<button class="icon-btn" data-close-btn style="margin-left:auto" aria-label="Close">${ic('x')}</button></div>
    <div class="mb"><input id="ntitle" placeholder="Issue title" aria-label="Issue title"><textarea id="ndesc" placeholder="Add a description… what happened, what you expected, how to reproduce" aria-label="Description"></textarea></div>
    <div class="mprops" id="nprops"></div>
    <div class="mf"><span class="tip hide-touch"><span class="kbd">⌘</span><span class="kbd">↵</span> to create</span><button class="btn btn-ghost" data-close-btn>Cancel</button><button class="btn btn-primary" id="ncreate" disabled>Create issue</button></div>
  </div></div>`;
  const props = $('#nprops');
  const draw = () => {
    props.innerHTML = `<button class="prop" data-np="status">${statusIcon(d.status)}${sName(d.status)}</button>
      <button class="prop" data-np="pri">${priIcon(d.pri)}${pName(d.pri)}</button>
      <button class="prop" data-np="who">${av(d.who)}${d.who ? esc(PEOPLE[d.who].name) : 'Assignee'}</button>
      ${d.labels.map(l => `<button class="prop" data-np="labels"><span class="dot" style="background:${LABELS[l].c}"></span>${LABELS[l].name}</button>`).join('')}
      <button class="prop ghost" data-np="labels">${ic('tag', 13)}${d.labels.length ? '' : 'Label'}</button>`;
  };
  draw();
  const title = $('#ntitle'), btn = $('#ncreate'), modalEl = layer.firstElementChild;
  title.addEventListener('input', () => { btn.disabled = !title.value.trim(); });
  const submit = () => { if (!title.value.trim()) { title.focus(); return; } d.title = title.value.trim(); d.desc = $('#ndesc').value; layer.innerHTML = ''; createIssue(d); };
  btn.onclick = submit;
  layer.querySelectorAll('[data-close-btn]').forEach(b => b.onclick = closeModal);
  modalEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
    else if (e.key === 'Enter' && e.target === title) { e.preventDefault(); $('#ndesc').focus(); }
    else if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    e.stopPropagation();
  });
  // nested pickers render into a second layer so the modal stays
  props.addEventListener('click', e => {
    const b = e.target.closest('[data-np]'); if (!b) return;
    const kind = b.dataset.np;
    const items = {
      status: () => STATUS_PICK_ORDER.map(s => ({ label:sName(s), icon:statusIcon(s), selected:d.status === s, run: () => { d.status = s; } })),
      pri: () => [0,1,2,3,4].map(p => ({ label:pName(p), icon:priIcon(p), selected:d.pri === p, run: () => { d.pri = p; } })),
      who: () => [null, ...Object.keys(PEOPLE)].map(p => ({ label: p ? PEOPLE[p].name : 'No assignee', sub: p === ME ? 'you' : '', icon:av(p), selected:d.who === p, run: () => { d.who = p; } })),
      labels: () => Object.keys(LABELS).map(l => ({ label:LABELS[l].name, icon:`<span class="dot" style="background:${LABELS[l].c}"></span>`, selected:d.labels.includes(l), run: () => { d.labels = d.labels.includes(l) ? d.labels.filter(x => x !== l) : [...d.labels, l]; draw(); } })),
    }[kind];
    subPicker(b, items, kind === 'labels', () => { draw(); title.focus(); });
  });
  setTimeout(() => title.focus(), 10);
}
/* picker stacked over a modal: separate element */
function subPicker(anchor, items, multi, done) {
  const host = document.createElement('div');
  document.body.appendChild(host);
  const r = anchor.getBoundingClientRect();
  host.innerHTML = `<div class="layer" data-sclose><div class="picker" style="left:${Math.min(r.left, innerWidth - 288)}px;top:${r.bottom + 6}px"><div class="q">${ic('search', 15)}<input placeholder="Filter…" autocomplete="off"></div><div class="items"></div></div></div>`;
  const input = host.querySelector('input'), box = host.querySelector('.items');
  let idx = 0, cur = [];
  const draw = () => {
    const q = input.value.trim().toLowerCase();
    cur = items().filter(it => !q || (it.label + ' ' + (it.sub || '')).toLowerCase().includes(q));
    idx = Math.min(idx, Math.max(0, cur.length - 1));
    box.innerHTML = cur.map((it, k) => `<div class="it" data-k="${k}" aria-selected="${k === idx}">${multi ? `<span class="box ${it.selected ? 'on' : ''}">${it.selected ? ic('check', 10, 3.2) : ''}</span>` : ''}${it.icon}<span class="lbl">${esc(it.label)}${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</span>${!multi && it.selected ? `<span class="chk">${ic('check', 14, 2.2)}</span>` : ''}</div>`).join('') || '<div class="none">No results</div>';
  };
  const close = () => { host.remove(); done(); };
  const pick = k => { const it = cur[k]; if (!it) return; it.run(); if (multi) draw(); else close(); };
  input.addEventListener('input', () => { idx = 0; draw(); });
  input.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'ArrowDown') { e.preventDefault(); idx = (idx + 1) % cur.length; draw(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); idx = (idx - 1 + cur.length) % cur.length; draw(); }
    else if (e.key === 'Enter') { e.preventDefault(); pick(idx); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
  });
  host.addEventListener('mousedown', e => { if (e.target.matches('[data-sclose]')) { e.preventDefault(); close(); } });
  host.addEventListener('click', e => { const it = e.target.closest('.it'); if (it) pick(+it.dataset.k); });
  draw(); input.focus();
}

/* ================= actions ================= */
function setView(v) {
  state.view = v; state.sel.clear();
  app.classList.remove('nav-open');
  const order = navOrder();
  if (!order.includes(state.focus)) state.focus = order[0] ?? null;
  if (state.open && !order.includes(state.open)) state.open = isPhone() ? null : state.focus;
  render(); list.scrollTop = 0; scrollFocus();
}
function clearFilters() { state.f = { status:new Set(), pri:new Set(), who:new Set() }; state.q = ''; $('#search').value = ''; onFilterChange(); }
function toggleAllGroups() {
  const ids = grouped().map(g => g.s.id);
  const allOpen = ids.every(id => !state.collapsed.has(id));
  ids.forEach(id => allOpen ? state.collapsed.add(id) : state.collapsed.delete(id));
  ensureFocusVisible(); renderList(); renderPanel();
}
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('plt-theme', document.documentElement.dataset.theme); } catch (_) {}
  renderSidebar(); renderList(); renderPanel();
}
async function copyLink(n) {
  const url = `https://tracker.northwind.dev/platform/${key(n)}`;
  try { await navigator.clipboard.writeText(url); } catch (_) {}
  toast(`Copied link to <b>${key(n)}</b>`);
}
function openIssue(n) { state.focus = n; state.open = n; state.editingDesc = false; renderList(); renderPanel(); }
function move(d) {
  const order = navOrder(); if (!order.length) return;
  let k = order.indexOf(state.focus);
  k = k < 0 ? 0 : Math.max(0, Math.min(order.length - 1, k + d));
  state.focus = order[k];
  if (state.open) { state.open = state.focus; state.editingDesc = false; }
  renderList(); renderPanel(); scrollFocus();
}
function toggleSel(n) { state.sel.has(n) ? state.sel.delete(n) : state.sel.add(n); renderList(); renderBulk(); }
let anchorN = null;

/* ================= events ================= */
$('#menuBtn').innerHTML = ic('menu', 18);
$('#searchIc').innerHTML = ic('search', 14);
$('#paletteBtn').innerHTML = ic('command', 16);
$('#newIc').innerHTML = ic('plus', 15, 2);
$('#fab').innerHTML = ic('plus', 22, 2);
$('#menuBtn').onclick = () => app.classList.add('nav-open');
$('#scrim').onclick = () => app.classList.remove('nav-open');
$('#paletteBtn').onclick = openPalette;
$('#newBtn').onclick = () => openCreate();
$('#fab').onclick = () => openCreate();

const search = $('#search');
search.addEventListener('input', () => { state.q = search.value; onFilterChange(); list.scrollTop = 0; });
search.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (search.value) { search.value = ''; state.q = ''; onFilterChange(); } else search.blur(); e.preventDefault(); e.stopPropagation(); }
  if (e.key === 'Enter' || e.key === 'ArrowDown') { e.preventDefault(); search.blur(); list.focus(); ensureFocusVisible(); renderList(); }
});

sidebar.addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if (v) return setView(v.dataset.view);
  const m = e.target.closest('[data-member]');
  if (m) {
    const p = m.dataset.member;
    const only = state.f.who.size === 1 && state.f.who.has(p);
    state.f.who = only ? new Set() : new Set([p]);
    if (!only && state.view !== 'all' && state.view !== 'active') state.view = 'active';
    app.classList.remove('nav-open'); onFilterChange(); return;
  }
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'new') openCreate();
  if (a === 'palette') { app.classList.remove('nav-open'); openPalette(); }
  if (a === 'keys') openKeys();
  if (a === 'theme') toggleTheme();
});
sidebar.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('a')) { e.target.click(); e.stopPropagation(); } });

$('#filterbar').addEventListener('click', e => {
  const c = e.target.closest('[data-clear]');
  if (c) { state.f[c.dataset.clear].clear(); onFilterChange(); return; }
  const f = e.target.closest('[data-filter]');
  if (f) { filterPicker(f.dataset.filter, f.closest('.fchip')); return; }
  if (e.target.closest('[data-act="clear-filters"]')) clearFilters();
});

list.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'clear-filters') return clearFilters();
  if (act === 'goto-active') return setView('active');
  const gh = e.target.closest('.ghead');
  if (gh) {
    if (act === 'add') return openCreate({ status: gh.dataset.group });
    const g = gh.dataset.group;
    state.collapsed.has(g) ? state.collapsed.delete(g) : state.collapsed.add(g);
    ensureFocusVisible(); renderList(); renderPanel(); return;
  }
  const row = e.target.closest('.row'); if (!row) return;
  const n = +row.dataset.n;
  if (act === 'check') { anchorN = n; return toggleSel(n); }
  if (act === 'pri' || act === 'status' || act === 'who') {
    state.focus = n; renderList();
    const ids = state.sel.has(n) ? [...state.sel] : [n];
    return propPicker(act, ids, $('#r-' + n + ' [data-act="' + act + '"]'));
  }
  if (e.shiftKey && anchorN != null) {
    const order = navOrder(), a = order.indexOf(anchorN), b = order.indexOf(n);
    if (a >= 0 && b >= 0) { order.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(x => state.sel.add(x)); state.focus = n; renderList(); renderBulk(); return; }
  }
  if (e.metaKey || e.ctrlKey) { anchorN = n; return toggleSel(n); }
  anchorN = n;
  if (state.sel.size) { toggleSel(n); return; }
  openIssue(n);
  if (!isPhone()) list.focus({ preventScroll:true });
});
list.addEventListener('dblclick', e => { if (e.target.closest('.row')) $('#ptitle')?.focus(); });

phead.addEventListener('click', e => {
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (a === 'close') { state.open = null; renderList(); renderPanel(); list.focus({ preventScroll:true }); }
  if (a === 'prev') move(-1);
  if (a === 'next') move(1);
  if (a === 'copy') copyLink(state.open);
});
pbody.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, ids = [state.open];
  if (a === 'status' || a === 'pri' || a === 'who' || a === 'labels') propPicker(a, ids, el);
  if (a === 'accept' || a === 'decline' || a === 'duplicate') triageAct(a);
  if (a === 'edit-desc' && !e.target.closest('a')) startDesc();
});
pbody.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.desc')) { e.preventDefault(); startDesc(); } });
function startDesc() { state.editingDesc = true; renderPanel(); const d = $('#descEdit'); d.focus(); d.setSelectionRange(d.value.length, d.value.length); d.addEventListener('blur', saveDesc, { once:true }); d.addEventListener('input', () => autosize(d)); }
function saveDesc() {
  const d = $('#descEdit'); if (!d) return;
  const i = byN(state.open), v = d.value;
  state.editingDesc = false;
  if (i && v !== i.desc) { const snap = snapshot([i.n]); i.desc = v; i.updated = Date.now(); i.events.push(E(ME, 0, 'edited the description')); undoStack.push(snap); render(); toast('Description saved', true); }
  else renderPanel();
}
pbody.addEventListener('input', e => { if (e.target.id === 'ptitle') autosize(e.target); });
pbody.addEventListener('keydown', e => {
  if (e.target.id === 'ptitle' && e.key === 'Enter') { e.preventDefault(); e.target.blur(); }
  if (e.target.id === 'ptitle' && e.key === 'Escape') { e.target.value = byN(state.open).title; e.target.blur(); e.stopPropagation(); }
  if (e.target.id === 'descEdit' && e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); e.target.blur(); }
  if (e.target.id === 'descEdit' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); e.target.blur(); }
});
pbody.addEventListener('focusout', e => {
  if (e.target.id !== 'ptitle') return;
  const i = byN(state.open), v = e.target.value.trim();
  if (i && v && v !== i.title) { const snap = snapshot([i.n]); i.title = v; i.updated = Date.now(); i.events.push(E(ME, 0, 'renamed the issue')); undoStack.push(snap); renderList(); toast('Title updated', true); }
});

composer.addEventListener('input', () => { autosize(composer); syncSend(); if (state.open) state.drafts[state.open] = composer.value; });
composer.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendComment(); }
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); composer.blur(); list.focus({ preventScroll:true }); }
});
$('#sendBtn').onclick = sendComment;
function sendComment() {
  const i = byN(state.open), t = composer.value.trim();
  if (!i || !t) return;
  i.comments.push(C(ME, 0, t)); i.updated = Date.now();
  state.freshComment = i.n + ':' + (i.comments.length - 1);
  composer.value = ''; delete state.drafts[i.n]; autosize(composer); syncSend();
  renderList(); renderPanel();
  pbody.scrollTop = pbody.scrollHeight;
}

$('#bulk').addEventListener('click', e => {
  const b = e.target.closest('[data-bulk]'); if (!b) return;
  if (b.dataset.bulk === 'clear') { state.sel.clear(); renderList(); renderBulk(); return; }
  propPicker(b.dataset.bulk, [...state.sel], isPhone() ? null : b);
});

let gPending = 0;
document.addEventListener('keydown', e => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); pk.opts ? closePicker() : (closeModal(), openPalette()); return; }
  if (pk.opts || layer.querySelector('.modal')) { if (e.key === 'Escape') { closePicker(); closeModal(); } return; }
  const typing = e.target.closest('input, textarea, [contenteditable="true"]');
  if (typing) return;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  if (mod && e.key.toLowerCase() === 'a') { e.preventDefault(); navOrder().forEach(n => state.sel.add(n)); renderList(); renderBulk(); return; }
  if (mod || e.altKey) return;

  if (gPending && Date.now() - gPending < 1000) {
    gPending = 0;
    const v = { t:'triage', m:'mine', a:'active', b:'backlog', i:'all' }[e.key.toLowerCase()];
    if (v) { e.preventDefault(); setView(v); }
    return;
  }
  const k = e.key;
  const run = fn => { e.preventDefault(); fn(); };
  switch (k) {
    case 'j': case 'ArrowDown': return run(() => move(1));
    case 'k': case 'ArrowUp': return run(() => move(-1));
    case 'Enter': case 'o': return run(() => { if (state.focus) { openIssue(state.focus); scrollFocus(); } });
    case 'Escape':
      if (app.classList.contains('nav-open')) return run(() => app.classList.remove('nav-open'));
      if (state.sel.size) return run(() => { state.sel.clear(); renderList(); renderBulk(); });
      if (state.open) return run(() => { state.open = null; renderList(); renderPanel(); });
      if (filtersActive()) return run(clearFilters);
      return;
    case 'x': return run(() => { if (state.focus) { anchorN = state.focus; toggleSel(state.focus); } });
    case 's': return run(() => propPicker('status', targets()));
    case 'p': return run(() => propPicker('pri', targets()));
    case 'a': return run(() => propPicker('who', targets()));
    case 'l': return run(() => propPicker('labels', targets()));
    case 'i': return run(() => { const t = targets(); t.length && setWho(t, ME); });
    case 'c': return run(() => openCreate());
    case 'f': return run(() => filterPicker('all'));
    case 'm': return run(() => { if (!state.open && state.focus) openIssue(state.focus); if (state.open) composer.focus(); });
    case '/': return run(() => { if (isPhone()) openPalette(); else search.focus(); });
    case '?': return run(openKeys);
    case 'g': gPending = Date.now(); e.preventDefault(); return;
    case '1': return run(() => triageAct('accept', state.focus));
    case '2': return run(() => triageAct('decline', state.focus));
    case '3': return run(() => triageAct('duplicate', state.focus));
    case 'e': return run(() => { if (state.open) startDesc(); });
  }
});

matchMedia('(max-width:760px)').addEventListener('change', () => renderPanel());
try { const t = localStorage.getItem('plt-theme'); if (t) document.documentElement.dataset.theme = t; } catch (_) {}
render();
requestAnimationFrame(scrollFocus);
if (!isPhone()) list.focus({ preventScroll:true });
// keep relative times fresh
setInterval(() => { if (!pk.opts && !document.activeElement.closest('textarea,input')) { renderList(); } }, 60000);
})();
</script>
