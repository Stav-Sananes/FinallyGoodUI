<!doctype html>
<!-- finally-good-ui build: Brindle booking, key screen "book-time" (direction C: Brindle Coat)
     Thesis: the salon is named after a coat pattern, so the screen wears it: fawn and chocolate from a brindle
       dog, a grooming comb as the day's ruler, and the owner's day (drop-off -> ready) as the one big figure.
     Axes: density=balanced contrast=stark type=neutral grotesk layout=stage material=soft-elevated motion=expressive
     Palette: tokens below (from .design/tokens.json): fawn canvas, chocolate ink/primary, bandana-teal "mark"; dark re-derived.
     Type: Archivo (Google Fonts, wdth 100/125, wght 400-800); 125 width for the stamped figures.
     Motion: tokens 50-500ms; enter/exit/move/snappy/enter-emphasized. Expressive moments: .comb-signature (span
       draws along the day comb, first pick), .booked-signature (comb stub fills, tick, fact).
     Material: soft-elevated, tinted shadows hue 45. Motif: grooming comb (day comb, step progress, skeleton,
       full-day empty state, booked stub). Accent moment: teal span + selected row edge.
     States: ?state=loading | error | empty | conflict (direct entry for verification). Also reachable in use:
       Saturday 21 is fully booked (empty), groomer filter (partial), "Try again" after error.
     Icons: Phosphor regular (unpkg, pinned 2.1.1). -->

.skeleton .sk-row { min-block-size: 60px; border-radius: var(--radius-md); background: var(--color-muted); display: flex; align-items: center; padding-inline: var(--space-4); gap: var(--space-1); }

/* ---- sticky bar ---- */

.cta-sum strong { font-weight: 700; font-variant-numeric: tabular-nums; }
.cta-sum span { font-size: var(--text-sm); color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }

/* ---- sheet (native dialog) ---- */
dialog.sheet { margin: 0; margin-block-start: auto; inline-size: 100%; max-inline-size: 100%; max-block-size: 88dvh; padding: 0; border: 0;
  border-radius: var(--radius-lg) var(--radius-lg) 0 0; background: var(--color-card); color: var(--color-foreground);
  box-shadow: var(--shadow-lg); overscroll-behavior: contain; }

.sheet-inner { padding: var(--space-3) var(--space-5) calc(var(--space-6) + env(safe-area-inset-bottom)); display: grid; gap: var(--space-4); }

.btn-book { position: relative; }

  border: 2px solid currentColor; border-inline-end-color: transparent; animation: spin calc(var(--duration-hero) + var(--duration-long) + var(--duration-micro)) linear infinite; }
@keyframes spin { to { transform: rotate(1turn); } }

.booked-signature { display: grid; justify-items: start; gap: var(--space-3); padding-block: var(--space-2) var(--space-2); }
.booked-signature-stub { display: flex; align-items: flex-start; gap: var(--space-3); }

  animation: tooth-in var(--duration-short) var(--ease-enter) both; animation-delay: calc(var(--i) * var(--stagger)); }

@keyframes tooth-in { from { transform: scaleY(0.2); opacity: 0; } }
.booked-signature-mark { inline-size: 40px; block-size: 40px; }
.booked-signature-ring { fill: var(--color-accent); stroke: var(--color-mark); stroke-width: 2; transform-box: fill-box; transform-origin: center;
  animation: ring-in var(--duration-long) var(--ease-enter-emphasized) both; }
.booked-signature-tick { fill: none; stroke: var(--color-mark); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
  transform-box: fill-box; transform-origin: 30% 80%; animation: tick-in var(--duration-medium) var(--ease-snappy) var(--duration-short) both; }
@keyframes ring-in { from { transform: scale(0.6); opacity: 0; } }
@keyframes tick-in { from { transform: scale(0.6) rotate(-12deg); opacity: 0; } }
.booked-signature h2 { font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); letter-spacing: var(--text-3xl--letter-spacing);
  font-weight: 700; font-stretch: 125%; }
.booked-signature h2, .booked-signature-fact { animation: rise var(--duration-standard) var(--ease-enter) var(--duration-short) both; }
@keyframes rise { from { transform: translateY(12px); opacity: 0; } }
.booked-signature-fact { font-size: var(--text-lg); font-variant-numeric: tabular-nums; }
.booked-signature-fact span { color: var(--color-muted-foreground); }

.toast { position: fixed; inset-inline: var(--space-4); inset-block-end: calc(var(--space-16) + var(--space-12) + env(safe-area-inset-bottom)); z-index: 30;
  margin-inline: auto; max-inline-size: 420px; display: flex; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-primary-foreground); box-shadow: var(--shadow-lg);
  opacity: 0; transform: translateY(12px); pointer-events: none;
  transition: opacity var(--duration-standard) var(--ease-enter), transform var(--duration-standard) var(--ease-enter); }
.toast.on { opacity: 1; transform: none; pointer-events: auto; }

/* first paint, once per session */
.fp .stage { animation: rise var(--duration-medium) var(--ease-enter) both; }
.fp .times-head { animation: rise var(--duration-medium) var(--ease-enter) var(--stagger) both; }

/* ---- wide screens: stage spans, times in three columns ---- */
@media (min-width: 768px) {
  .wrap { padding-inline: var(--space-8); }
  .intro { grid-template-columns: 1fr auto; align-items: end; padding-block: var(--space-6) var(--space-6); }
  .intro h1 { font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); letter-spacing: var(--text-3xl--letter-spacing); }
  .stage { padding: var(--space-6); grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); column-gap: var(--space-10); row-gap: var(--space-6); }
  .stage > .week { grid-column: 1 / -1; }

  .toast { inset-block-end: calc(var(--space-16) + var(--space-16)); }
}

@media (prefers-reduced-motion: reduce) {
  .days[data-enter], .times-layer[data-enter], .fig-layer[data-enter], .fp .stage, .fp .times-head,
  .booked-signature h2, .booked-signature-fact, .booked-signature-ring, .booked-signature-comb i { animation-name: fade-in; animation-duration: var(--duration-short); }
  .days[data-leave], .fig-layer[data-leave] { animation-name: fade-out; }
  dialog.sheet[open] { animation-name: fade-in; }
  dialog.sheet.closing { animation-name: fade-out; }
  .comb-span { transition: opacity var(--duration-short) var(--ease-move); }
  .comb-span.comb-signature { animation: fade-in var(--duration-short) var(--ease-move) both; }
  .booked-signature-tick { animation-name: fade-in; animation-duration: var(--duration-short); }
  .skeleton, .btn-book .spin { animation: none; }
  .seg-ind, .toast, .slot .tick { transition-property: opacity; }
  .slot:active, .btn:active { transform: none; }
}
</style>

<body>
<a class="skip" href="#times">Skip to times</a>

<header class="bar">
  <div class="wrap">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back to service"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>
    <div class="brand"><span class="wordmark" translate="no">Brindle</span><small>14 Mercer Lane</small></div>
    <div class="progress" role="img" aria-label="Step 3 of 4: time">
      <div class="progress-comb" aria-hidden="true"><i></i><i></i><i class="now"></i><i class="todo"></i></div>
      <span aria-hidden="true">Step 3 of 4</span>
    </div>
  </div>
</header>

<main id="main" class="wrap">
  <div class="intro">
    <h1 id="title">Pick a drop-off time</h1>
    <div class="summary">
      <button class="chip" id="dogChip" type="button" aria-haspopup="dialog"></button>
      <button class="chip svc" id="svcChip" type="button" aria-haspopup="dialog"></button>
    </div>
  </div>

  <section class="stage" aria-labelledby="dayHeading">
    <div class="week">
      <div class="week-head">
        <h2 id="weekLabel" class="num"></h2>
        <button class="icon-btn" id="prevWeek" type="button" aria-label="Earlier week"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
        <button class="icon-btn" id="nextWeek" type="button" aria-label="Later week"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      </div>
      <div class="week-view" id="weekView"></div>
      <p class="week-note">Closed Sundays and Mondays. Drop-offs from 8 am, pick-ups by 5 pm.</p>
    </div>
    <div class="figure-row">
      <h2 class="day-heading" id="dayHeading"></h2>
      <div class="figure" id="figure"></div>
    </div>
    <div class="comb" id="comb">
      <div class="comb-pins" aria-hidden="true"><span class="pin" id="pin"></span></div>
      <div class="comb-track" aria-hidden="true">
        <div class="comb-spine"></div>
        <div class="comb-span" id="combSpan"></div>
        <div class="comb-teeth" id="teeth"></div>
      </div>
      <div class="comb-hours" aria-hidden="true" id="hours"></div>
      <p class="visually-hidden" id="combText"></p>
      <div class="comb-legend" aria-hidden="true"><span><i></i>Free</span><span><i class="b"></i>Booked</span><span><i class="m"></i>Biscuit's visit</span></div>
    </div>
  </section>

  <section class="times" id="times" aria-labelledby="timesHeading" tabindex="-1">
    <div class="times-head">
      <h2 id="timesHeading">Drop-off times</h2>
      <div class="seg" id="seg" role="radiogroup" aria-label="Groomer">
        <span class="seg-ind no-anim" id="segInd" aria-hidden="true"></span>
        <button type="button" role="radio" data-g="any">Any groomer</button>
        <button type="button" role="radio" data-g="Maya">Maya</button>
        <button type="button" role="radio" data-g="Theo">Theo</button>
      </div>
    </div>
    <div class="times-view" id="timesView" aria-live="off"></div>
  </section>
  <p class="visually-hidden" id="live" aria-live="polite"></p>
</main>

<div class="cta-bar">
  <div class="wrap">
    <p class="cta-sum" id="ctaSum"></p>
    <button class="btn btn-primary" id="reviewBtn" type="button" aria-haspopup="dialog">Review booking</button>
  </div>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"><div class="sheet-inner" id="sheetInner"></div></dialog>
<div class="toast" id="toast" role="status"><i class="ph ph-check-circle" aria-hidden="true"></i><span id="toastText"></span></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const root = document.documentElement;
  const token = (name) => parseFloat(getComputedStyle(root).getPropertyValue('--duration-' + name)) || 0;
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const params = new URLSearchParams(location.search);
  const FORCED = params.get('state');            // loading | error | empty | conflict (verification entry points)
  const NETWORK_MS = 450;                          // simulated availability request, not motion
  const SHOW_LOADER_AFTER = 300, LOADER_MIN = 400; // states.loading-perceived
  const LOCALE = 'en-GB';

  /* ---------- data: the salon's real week ---------- */
  const OPEN = 480, CLOSE = 1020, GRID = 30, QUARTERS = 36;
  const DOGS = {
    biscuit: { name: 'Biscuit', initial: 'B', breed: 'Cockapoo', coat: 'Medium, curly coat',
      prices: { full: [135, 62], bath: [75, 38], nails: [20, 12] } },
    pepper: { name: 'Pepper', initial: 'P', breed: 'Miniature schnauzer', coat: 'Small, wiry coat',
      prices: { full: [105, 52], bath: [60, 32], nails: [20, 12] } },
  };
  const SERVICES = {
    full: { name: 'Full groom', what: 'Bath, cut and style, nails, ears' },
    bath: { name: 'Bath & tidy', what: 'Bath, face and paw tidy, nails' },
    nails: { name: 'Nail trim', what: 'Clip and file' },
  };
  const GROOMERS = { Maya: 'Curly coats and nervous dogs', Theo: 'Doodles and hand-stripping' };
  const hm = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const B = (...r) => r.map((x) => x.split('-').map(hm));
  const BUSY = {
    '2026-11-17': { Maya: B('8:00-14:00'), Theo: B('8:00-13:30', '16:00-17:00') },
    '2026-11-18': { Maya: B('8:00-10:00', '12:30-15:00'), Theo: B('10:00-12:00', '14:30-17:00') },
    '2026-11-19': { Maya: B('11:45-14:00'), Theo: B('8:00-10:30', '13:00-14:00') },
    '2026-11-20': { Maya: B('8:00-11:00', '13:30-17:00'), Theo: B('8:00-14:00') },
    '2026-11-21': { Maya: B('8:00-17:00'), Theo: B('8:00-12:30', '13:00-17:00') },
    '2026-11-24': { Maya: B('8:00-9:00', '13:00-15:00'), Theo: B('9:30-12:00') },
    '2026-11-25': { Maya: B('8:00-12:00'), Theo: B('8:00-17:00') },
    '2026-11-26': { Maya: B('10:00-13:00'), Theo: B('8:00-10:00', '14:00-17:00') },
    '2026-11-27': { Maya: B('8:00-17:00'), Theo: B('12:00-15:00') },
    '2026-11-28': { Maya: B('8:00-10:30', '13:00-17:00'), Theo: B('8:00-16:00') },
  };
  const WEEKS = [Object.keys(BUSY).slice(0, 5), Object.keys(BUSY).slice(5)];

  /* ---------- formatting through Intl ---------- */
  const asDate = (iso) => new Date(iso + 'T12:00:00');
  const fmt = (o) => new Intl.DateTimeFormat(LOCALE, o);
  const fDayLong = fmt({ weekday: 'long', day: 'numeric', month: 'long' });
  const fDayShort = fmt({ weekday: 'short', day: 'numeric', month: 'short' });
  const fWeekday = fmt({ weekday: 'short' });
  const fWeekdayLong = fmt({ weekday: 'long' });
  const fMonth = fmt({ month: 'long' });
  const money = new Intl.NumberFormat(LOCALE, { style: 'currency', currency: 'GBP', maximumFractionDigits: 0 });
  const clockParts = (mins) => {
    const d = new Date(2026, 10, 16, Math.floor(mins / 60), mins % 60);
    const parts = new Intl.DateTimeFormat(LOCALE, { hour: 'numeric', minute: '2-digit', hour12: true }).formatToParts(d);
    const time = parts.filter((p) => p.type !== 'dayPeriod').map((p) => p.value).join('').trim();
    const period = (parts.find((p) => p.type === 'dayPeriod') || { value: '' }).value;
    return { time, period };
  };
  const clock = (mins) => { const c = clockParts(mins); return `${c.time} ${c.period}`; };
  const duration = (mins) => {
    const h = Math.floor(mins / 60), m = mins % 60;
    if (!h) return `${m} min`;
    const frac = { 15: '¼', 30: '½', 45: '¾' }[m];
    return frac ? `${h}${frac} h` : m ? `${h} h ${m}` : `${h} h`;
  };
  const hourLabel = (h) => { const c = clockParts(h * 60); return c.time.replace(':00', '') + c.period.replace(' ', ''); };

  /* ---------- state ---------- */
  const S = {
    dog: 'biscuit', service: 'full',
    week: 0, day: '2026-11-19', groomer: 'any',
    sel: null,               // { day, start, groomers }
    status: 'loading',       // loading | ready | error
    taken: new Set(),        // "day|start" booked by someone else since the page loaded
    struck: null,            // the slot that was just taken (shown struck through)
    waitlist: new Set(),
    drawn: false,            // the comb signature plays once per task
    erroredOnce: false,
  };
  const fromUrl = () => {
    const d = params.get('day'); if (d && BUSY[d]) { S.day = d; S.week = WEEKS[0].includes(d) ? 0 : 1; }
    const g = params.get('groomer'); if (g === 'Maya' || g === 'Theo') S.groomer = g;

  /* ---------- summary chips ---------- */

  /* ---------- week strip (slot-picker: slides in the direction of travel) ---------- */

  /* ---------- the big figure (number-change: rolls in the direction of the change) ---------- */

    if (S.status === 'error') return { key: 'error', html: `<div class="fig-main"><span class="fig-unit">Times didn't load</span></div><p class="fig-sub">Your dog, service and day are kept. Try again below.</p>` };
    if (S.sel && S.sel.day === S.day) {

  let lastOrder = -1;

  /* ---------- the day comb ---------- */
  function renderComb() {
    const teeth = $('#teeth');
    if (!teeth.children.length) {
      teeth.innerHTML = Array.from({ length: QUARTERS }, (_, q) => `<i class="tooth${q % 4 === 0 ? ' hour' : ''}"></i>`).join('');
      $('#hours').innerHTML = [8, 10, 12, 14, 16].map((h) => `<span style="inset-inline-start:${((h * 60 - OPEN) / (CLOSE - OPEN)) * 100}%">${hourLabel(h)}</span>`).join('');
    }
    const ready = S.status === 'ready', windows = [];
    [...teeth.children].forEach((t, q) => {
      const a = OPEN + q * 15, open = ready && people(S.groomer).some((p) => free(S.day, p, a, a + 15));
      t.classList.toggle('busy', !open);
      if (open) { const w = windows[windows.length - 1]; if (w && w[1] === a) w[1] = a + 15; else windows.push([a, a + 15]); }
    });
    $('#combText').textContent = ready ? (windows.length ? 'Groomers free ' + windows.map(([a, b]) => `${clock(a)} to ${clock(b)}`).join(', ') + '.' : 'No free time this day.') : '';
    const span = $('#combSpan'), on = ready && S.sel && S.sel.day === S.day;
    const pin = $('#pin');
    if (on) {
      const s = (S.sel.start - OPEN) / (CLOSE - OPEN), l = mins() / (CLOSE - OPEN);

      pin.textContent = `${clock(S.sel.start)}–${clock(S.sel.start + mins())}`;
      if (!S.drawn) {           // expressive moment 1: the visit draws along the comb, first pick of the task
        S.drawn = true; span.classList.remove('comb-signature'); void span.offsetWidth; span.classList.add('comb-signature');
        setTimeout(() => span.classList.remove('comb-signature'), token('hero'));
      } else if (!wasOn) { span.style.transition = 'none'; void span.offsetWidth; span.style.transition = ''; }

  /* ---------- times ---------- */
  const PARTS = [['Morning', 'before 11', 0, 660], ['Midday', '11 to 1:30', 660, 810], ['Afternoon', 'pick up by 5', 810, CLOSE]];
  function slotHtml(x) {

  }

        </div>${onList ? `<p class="fine">We'll text 07700 900 418 if a time opens. You can leave the list from the text.</p>` : ''}</div>`;
    }

      <textarea id="note" name="note" autocomplete="off" placeholder="e.g. a bit shorter on the ears than last time">${S.note || ''}</textarea></div>
      <p class="fine">Free to cancel or move until 24 hours before. Pay at the salon.</p>
      <p class="form-error" id="bookError" hidden></p>
      <div class="sheet-actions"><button class="btn btn-primary btn-book" type="button" data-act="book">Book appointment</button>
      <button class="btn btn-secondary" type="button" data-act="close">Change time</button></div>`, from);
    sheet.querySelector('#note').addEventListener('input', (e) => { S.note = e.target.value; });
  }
  function bookedHtml() {
    const d = DOGS[S.dog], sel = S.sel, who = sel.who[0];
    return `<div class="grab" aria-hidden="true"></div><section class="booked-signature" role="status" aria-labelledby="sheetTitle">
      <div class="booked-signature-stub" aria-hidden="true">
        <div class="booked-signature-comb">${Array.from({ length: 10 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>
        <svg class="booked-signature-mark" viewBox="0 0 48 48"><circle class="booked-signature-ring" cx="24" cy="24" r="22"/><path class="booked-signature-tick" d="M15 24.5l6 6 12-13"/></svg>
      </div>
      <h2 id="sheetTitle" tabindex="-1">Booked</h2>
      <p class="booked-signature-fact">See you ${fWeekdayLong.format(asDate(sel.day))}, ${d.name}.<br><span>Drop off ${clock(sel.start)} · ready about ${clock(sel.start + mins())} · with ${who}</span></p>
      </section>
      <div class="sheet-actions"><button class="btn btn-primary" type="button" data-act="ics"><i class="ph ph-calendar-plus" aria-hidden="true"></i>Add to calendar</button>
      <button class="btn btn-secondary" type="button" data-act="done">Done</button></div>`;
  }
  async function book(btn) {
    if (btn.dataset.busy) return;
    btn.dataset.busy = '1'; btn.style.minInlineSize = btn.offsetWidth + 'px';
    btn.innerHTML = `<span class="spin" aria-hidden="true"></span>Booking…`; btn.setAttribute('aria-disabled', 'true');
    await wait(NETWORK_MS * 2);
    if (FORCED === 'conflict' && !S.conflicted) {
      S.conflicted = true; S.taken.add(S.sel.day + '|' + S.sel.start);
      S.struck = { day: S.sel.day, start: S.sel.start, groomers: S.sel.who }; S.sel = null; S.drawn = false;
      closeSheet(); renderWeek();
      if (S.day !== S.struck.day) goDay(S.struck.day); else renderAll();
      $('#times').focus();
      return;
    }
    if (S.sel.who.length > 1) S.sel.who = [S.sel.who[0]];
    S.booked = { ...S.sel, dog: S.dog, service: S.service };
    const inner = $('#sheetInner'); inner.style.minBlockSize = inner.offsetHeight + 'px'; // keep the sheet still while its content changes
    inner.classList.add('done'); inner.innerHTML = bookedHtml();
    sheet.querySelector('#sheetTitle').focus();
  }
  function downloadIcs() {
    const b = S.booked, d = DOGS[b.dog], [y, m, dd] = b.day.split('-');
    const t = (mm) => `${y}${m}${dd}T${String(Math.floor(mm / 60)).padStart(2, '0')}${String(mm % 60).padStart(2, '0')}00`;
    const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Brindle//Booking//EN', 'BEGIN:VEVENT', `UID:${b.day}-${b.start}-${b.dog}@brindle`,
      `DTSTART;TZID=Europe/London:${t(b.start)}`, `DTEND;TZID=Europe/London:${t(b.start + DOGS[b.dog].prices[b.service][0])}`,
      `SUMMARY:${d.name}: ${SERVICES[b.service].name} at Brindle`, `LOCATION:Brindle, 14 Mercer Lane`,
      `DESCRIPTION:Drop off ${clock(b.start)}. Ready about ${clock(b.start + DOGS[b.dog].prices[b.service][0])} with ${b.who[0]}.`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
    a.download = `brindle-${d.name.toLowerCase()}-${b.day}.ics`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Calendar file saved');
  }
  function finishBooking() {
    const b = S.booked; S.taken.add(b.day + '|' + b.start); S.sel = null; S.drawn = false; S.note = '';
    closeSheet(); renderAll(); renderWeek();
    toast(`${DOGS[b.dog].name} is booked for ${fDayShort.format(asDate(b.day))}, ${clock(b.start)}`);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('button, a'); if (!el) return;
    if (el.matches('.day')) return goDay(el.dataset.day);
    if (el.matches('.slot')) { if (el.getAttribute('aria-disabled') !== 'true') pick(+el.dataset.start); return; }
    if (el.dataset.pick) { S.struck = null; renderAll(); pick(+el.dataset.pick); return; }
    if (el.dataset.goto) return goDay(el.dataset.goto, true);
    if (el.dataset.dog) { if (el.dataset.dog !== S.dog) { S.dog = el.dataset.dog; reconcile(); } return closeSheet(); }
    if (el.dataset.svc) { if (el.dataset.svc !== S.service) { S.service = el.dataset.svc; reconcile(); } return closeSheet(); }
    switch (el.dataset.act || el.id) {
      case 'retry': return loadDay();
      case 'any': S.groomer = 'any'; toUrl(); renderSeg(); return renderAll();
      case 'waitlist': {
        const k = S.day + S.groomer; S.waitlist.has(k) ? S.waitlist.delete(k) : S.waitlist.add(k);
        renderAll(); $('#timesView [data-act="waitlist"]')?.focus(); return;
      }
      case 'close': return closeSheet();
      case 'book': return book(el);
      case 'ics': return downloadIcs();
      case 'done': return finishBooking();
      case 'dogChip': return dogSheet(el);
      case 'svcChip': case 'backBtn': return serviceSheet(el);
      case 'prevWeek': if (S.week > 0) goDay(WEEKS[S.week - 1].find((d) => openCount(d, 'any')) || WEEKS[S.week - 1][0]); return;
      case 'nextWeek': if (S.week < WEEKS.length - 1) goDay(WEEKS[S.week + 1].find((d) => openCount(d, 'any')) || WEEKS[S.week + 1][0]); return;
      case 'reviewBtn':
        if (!S.sel) { $('#ctaSum span').textContent = 'Pick one of the times above first'; const f = $('#timesView .slot[tabindex="0"]'); (f || $('#times')).focus(); f?.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); return; }
        return reviewSheet(el);
    }
    if (el.closest('#seg')) { S.groomer = el.dataset.g; toUrl(); renderSeg(); renderAll(); }
  });
  // a dog or service change keeps the day; a picked time that no longer fits is dropped with a note
  function reconcile() {
    if (S.sel) {
      const still = slotsFor(S.sel.day).find((x) => x.start === S.sel.start && !x.taken);
      if (still) S.sel.who = still.who;
      else { const t = clock(S.sel.start); S.sel = null; S.drawn = false; toast(`${t} no longer fits a ${SERVICES[S.service].name.toLowerCase()}. Pick another time.`); }
    }
    lastFigureKey = ''; renderWeek(); renderAll();
  }

  // arrow keys: days, groomer choice and times are radio groups with one tab stop each
  document.addEventListener('keydown', (e) => {
    const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    const el = e.target; if (!(e.key in keys) || !el.matches('.day, .slot, #seg button')) return;
    e.preventDefault();
    const scope = el.matches('.slot') ? [...$('#timesView').querySelectorAll('.times-layer:not([data-leave]) .slot:not([aria-disabled="true"])')]
      : el.matches('.day') ? [...$('#weekView').querySelectorAll('.days:not([data-leave]) .day')] : [...$('#seg').querySelectorAll('button')];
    const next = scope[(scope.indexOf(el) + keys[e.key] + scope.length) % scope.length];
    next.focus(); next.click();
    if (next.matches('.slot')) { scope.forEach((s) => (s.tabIndex = -1)); next.tabIndex = 0; }
  });
  addEventListener('resize', () => renderSeg(false));
  addEventListener('message', (e) => { if (e.data?.type === 'fgu:theme') root.dataset.theme = e.data.theme; });

  /* ---------- first paint: stage, then the first rows, once per session ---------- */
  let firstPaint = false;
  try { firstPaint = !sessionStorage.getItem('brindle-fp'); sessionStorage.setItem('brindle-fp', '1'); } catch { firstPaint = true; }
  if (params.has('still')) firstPaint = false;
  if (firstPaint) { root.classList.add('fp'); setTimeout(() => root.classList.remove('fp'), token('medium') * 2); }
  function firstPaintRows() {
    if (!firstPaint || reduced()) return; firstPaint = false;
    const rows = [...$('#timesView').querySelectorAll('.times-layer .slot')].slice(0, 6);
    const step = parseFloat(getComputedStyle(root).getPropertyValue('--stagger'));
    rows.forEach((r, i) => r.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }],
      { duration: token('standard'), delay: i * step, easing: getComputedStyle(root).getPropertyValue('--ease-enter').trim(), fill: 'backwards' }));
  }

  /* ---------- direction preview (the .design/directions copy): auto-play the transition once ---------- */
  function previewAutoplay() {
    if (root.dataset.preview !== 'direction' || params.has('still') || reduced()) return;
    setTimeout(async () => {
      while (S.status !== 'ready') await wait(100);
      pick(570);
      await wait(token('hero') + 1200);
      S.sel = null; S.drawn = false; renderComb(); renderFigure(); renderCta();
      $('#timesView').querySelectorAll('.slot').forEach((b) => b.setAttribute('aria-checked', 'false'));
    }, 600);
  }

  fromUrl(); renderChips(); renderWeek(); renderSeg(false); renderCta(); loadDay(); previewAutoplay();
  document.fonts?.ready.then(() => renderSeg(false));
})();
</script>
</body>
