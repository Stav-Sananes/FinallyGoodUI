/* invoice ledger */
.ledger { inline-size: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.ledger th { text-align: start; padding: var(--space-2) var(--space-3); border-block-end: 1px solid var(--color-border); }
.ledger th.num, .ledger td.num { text-align: end; }
.ledger td { padding: var(--space-3); border-block-end: 1px solid var(--color-border); vertical-align: middle; }
.ledger tr:last-child td { border-block-end: 0; }
.ledger td:first-child, .ledger th:first-child { padding-inline-start: 0; }
.ledger td:last-child, .ledger th:last-child { padding-inline-end: 0; }
.inv-row { transition: background-color var(--duration-short) var(--ease-move); }
.client { font-weight: 600; font-size: var(--text-base); overflow-wrap: anywhere; }
.project { color: var(--color-muted-foreground); }
.inv-no { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--color-muted-foreground); }
.amount { font-size: var(--text-base); }
.status { display: inline-flex; align-items: center; gap: var(--space-2); font-weight: 500; white-space: nowrap; }
.status[data-tone="danger"] { color: var(--color-destructive); }
.status[data-tone="warning"] { color: var(--color-warning); }
.status[data-tone="info"] { color: var(--color-info); }
.status[data-tone="neutral"] { color: var(--color-muted-foreground); }
.status[data-tone="success"] { color: var(--color-success); }
.reminded { display: block; font-size: var(--text-xs); color: var(--color-muted-foreground); font-weight: 400; }
.act { inline-size: 1%; white-space: nowrap; text-align: end; }
.act-cell { display: inline-grid; justify-items: end; }
.act-cell.has-note { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: var(--space-2); }
.row-note { display: inline-flex; align-items: center; gap: var(--space-2); min-block-size: 40px; font-size: var(--text-sm); color: var(--color-muted-foreground); }
.row-note[data-tone="success"] { color: var(--color-success); }
.row-note[data-tone="danger"] { color: var(--color-destructive); }
.row-swap { animation: swap-in var(--duration-short) var(--ease-enter) both; }
@keyframes swap-in { from { opacity: 0; } }
.sheet-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: var(--space-3); margin-block-start: var(--space-4); padding-block-start: var(--space-4); border-block-start: 1px solid var(--color-border); font-size: var(--text-sm); }

/* payroll */
.pay-date { font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); font-weight: 600; letter-spacing: var(--tracking-heading); margin-block-start: var(--space-3); }
.pay-lines { display: grid; gap: var(--space-2); margin-block-start: var(--space-4); font-size: var(--text-sm); }
.pay-lines div { display: flex; justify-content: space-between; gap: var(--space-4); }
.pay-lines dt { color: var(--color-muted-foreground); }
.pay-total { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-4); padding-block-start: var(--space-2); font-weight: 600; }
.pay-total .fig { font-size: var(--text-xl); font-weight: 500; }
.pay-total-rule { color: var(--color-foreground); margin-block-start: var(--space-2); }
.covered { display: flex; gap: var(--space-2); align-items: start; margin-block-start: var(--space-4); padding: var(--space-3); border-radius: var(--radius-md); background: color-mix(in oklch, var(--color-success) 10%, var(--color-card)); font-size: var(--text-sm); }
.covered .ic { color: var(--color-success); padding-block-start: 0.125em; }
.covered strong { color: var(--color-success); }
.pay-note { margin-block-start: var(--space-3); font-size: var(--text-sm); color: var(--color-muted-foreground); }

/* spending bars */
.bars { display: grid; gap: var(--space-3); margin-block-start: var(--space-4); }
.bars li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); font-size: var(--text-sm); }
.bars .track-h { grid-column: 1 / -1; block-size: 6px; border-radius: var(--radius-sm); background: var(--color-muted); overflow: hidden; }
.bars .fill { display: block; block-size: 100%; background: var(--color-primary); transform-origin: left; transform: scaleX(var(--v)); border-radius: var(--radius-sm); }

/* tables in other views */
.view-grid { display: grid; gap: var(--space-6); }
.change-up { color: var(--color-foreground); }
.ledger tfoot td { border-block-end: 0; font-weight: 600; padding-block-start: var(--space-2); }
.total-rule { color: var(--color-foreground); }

/* ---------- empty, denied ---------- */
.empty { display: grid; justify-items: start; gap: var(--space-3); max-inline-size: 52ch; padding: var(--space-10) var(--space-8); }
.empty .double-rule { inline-size: 96px; color: var(--color-primary); }
.empty h2 { font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); font-weight: 600; }
.empty p { color: var(--color-muted-foreground); }
.empty-actions { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); margin-block-start: var(--space-2); }
.inline-empty { display: grid; gap: var(--space-2); justify-items: start; padding-block: var(--space-6); }
.inline-empty p { color: var(--color-muted-foreground); font-size: var(--text-sm); }
.locked { display: grid; gap: var(--space-3); align-content: start; justify-items: start; }
.locked .ic { color: var(--color-muted-foreground); }

/* ---------- skeleton (recipes/motion/skeleton-to-content.md) ---------- */
.sk { display: block; position: relative; overflow: hidden; background: var(--color-muted); border-radius: var(--radius-sm); block-size: 1em; }
[aria-busy="true"] .skeleton-wrap { animation: sk-appear var(--duration-short) var(--ease-enter) both; }
@keyframes sk-appear { from { opacity: 0; } }
.content-in { animation: content-in var(--duration-standard) var(--ease-enter) both; }
@keyframes content-in { from { opacity: 0; } }

/* ---------- toast (recipes/motion/toast-stack.md) ---------- */
.toast-list { position: fixed; inset: auto var(--space-4) var(--space-4) auto; display: grid; z-index: 50; }
.toast {
  grid-area: 1 / 1; align-self: end;
  display: flex; align-items: center; gap: var(--space-4);
  inline-size: min(400px, calc(100vw - 2 * var(--space-4)));
  padding: var(--space-3) var(--space-3) var(--space-3) var(--space-4);
  border-radius: var(--radius-lg); background: var(--color-foreground); color: var(--color-background);
  box-shadow: var(--shadow-lg); font-size: var(--text-sm);
  --i: 0;
  transform: translateY(calc(var(--i) * -10px)) scale(calc(1 - var(--i) * 0.05));
  opacity: calc(1 - var(--i) * 0.25);
  transform-origin: bottom center;
  transition: transform var(--duration-standard) var(--ease-enter), opacity var(--duration-standard) var(--ease-enter);
}
@starting-style { .toast { transform: translateY(8px); opacity: 0; } }
.toast p { flex: 1; }
.toast .btn { background: transparent; border-color: color-mix(in oklch, var(--color-background) 45%, transparent); color: var(--color-background); }
.toast.is-leaving { transform: translateY(8px); opacity: 0; transition: transform var(--duration-short) var(--ease-exit), opacity var(--duration-short) var(--ease-exit); }

/* ---------- motion: first paint, signature moments ---------- */
.first-paint .fp { animation: fp-rise var(--duration-long) var(--ease-enter) both; animation-delay: calc(var(--fp, 0) * var(--duration-instant)); }
@keyframes fp-rise { from { opacity: 0; transform: translateY(12px); } }
.runway-signature .rule { animation: rule-draw var(--duration-hero) var(--ease-enter-emphasized) var(--duration-short) both; }
.runway-signature .rule-collect, .runway-signature .runout, .runway-signature .collect-label { animation: fade-in var(--duration-standard) var(--ease-enter) var(--duration-hero) both; }
@keyframes rule-draw { from { transform: scaleX(0.02); } }
@keyframes fade-in { from { opacity: 0; } }
.covered-signature { animation: covered-settle var(--duration-long) var(--ease-enter) var(--duration-hero) both; }
@keyframes covered-settle { from { opacity: 0; transform: translateY(6px); } }
.bars-first .fill { animation: bar-grow var(--duration-long) var(--ease-enter) both; animation-delay: calc(min(var(--i, 0), 7) * var(--duration-instant)); }
@keyframes bar-grow { from { transform: scaleX(0.02); } }

::view-transition-old(page) { animation: var(--duration-short) var(--ease-exit) both vt-out; }
::view-transition-new(page) { animation: var(--duration-short) var(--ease-enter) both vt-in; }
@keyframes vt-out { to { opacity: 0; } }
@keyframes vt-in { from { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .first-paint .fp { animation-name: fade-in; animation-delay: 0s; }
  .runway-signature .rule { animation-name: fade-in; }
  .covered-signature { animation-name: fade-in; }
  .bars-first .fill { animation-name: fade-in; animation-delay: 0s; }
  .btn:active { transform: none; }
  .tab::after { transform: none; }
  .toast, .toast.is-leaving { transform: none; }
  @starting-style { .toast { transform: none; } }
}

/* ---------- responsive ---------- */
@media (max-width: 1080px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: var(--space-8); }
  .cash { padding-inline-end: 0; border-inline-end: 0; padding-block-end: var(--space-8); border-block-end: 1px solid var(--color-border); }
  .below { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 767px) {
  .bar { padding-inline: var(--space-4); }
  .tabs { order: 3; flex: 1 0 100%; min-inline-size: 0; }
  .tab { flex: 1 1 0; min-inline-size: 0; justify-content: center; padding-inline: var(--space-1); }
  .bar-tools { margin-inline-start: auto; }
  .sync-text { display: none; }
  .btn { min-block-size: 44px; }
  .btn-icon { inline-size: 44px; }
  .link { display: inline-block; padding-block: var(--space-3); margin-block: calc(-1 * var(--space-3)); }
  .page { padding: var(--space-4) var(--space-4) var(--space-12); }
  .stage, .sheet { padding: var(--space-4); }
  .runway-num { font-size: var(--text-5xl); line-height: var(--text-5xl--line-height); }
  .cash-total { font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); }
  .months li { padding-inline: var(--space-1); }
  .months .v { display: none; }
  .aging-keys { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ledger { font-size: var(--text-xs); }
  .ledger th, .ledger td { padding-inline: var(--space-1); }
  .ledger-inv { font-size: var(--text-sm); }
  .ledger-inv thead { display: none; }
  .ledger-inv tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--space-1) var(--space-3); padding-block: var(--space-3); border-block-end: 1px solid var(--color-border); }
  .ledger-inv tr:last-child { border-block-end: 0; }
  .ledger-inv td { display: block; padding: 0; border: 0; }
  .ledger-inv td.col-inv { display: none; }
  .ledger-inv td.num { grid-column: 2; grid-row: 1; }
  .ledger-inv td.col-status { grid-column: 1; }
  .ledger-inv td.act { grid-column: 2; inline-size: auto; }
  .sync-inline { display: block; }
  .m-long { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .m-short { display: inline; }
  .empty { padding: var(--space-6) var(--space-4); }
}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="bar">
  <a class="studio" href="#overview" aria-label="Halftone Studio, Studio Ledger overview">
    <span class="studio-mark" aria-hidden="true">HT</span>
    <span class="studio-name">Halftone Studio<span>Studio Ledger</span></span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a class="tab" href="#overview" data-view="overview">Overview</a>
    <a class="tab" href="#invoices" data-view="invoices">Invoices</a>
    <a class="tab" href="#spending" data-view="spending">Spending</a>
    <a class="tab" href="#payroll" data-view="payroll">Payroll</a>
  </nav>
  <div class="bar-tools">
    <p class="sync" id="sync" aria-live="polite"><i data-lucide="landmark" aria-hidden="true"></i><span class="sync-text" id="sync-text">Synced 7:42 AM</span></p>
    <button class="btn btn-quiet btn-icon" type="button" id="sync-now" aria-label="Sync now with your bank" title="Sync now"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>

  </div>
</header>

<main id="main" tabindex="-1"></main>

<div class="toast-list" role="status" aria-live="polite" aria-relevant="additions"></div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
(function () {
  "use strict";

  /* ---------- data: Halftone Studio, snapshot of Monday 16 November 2026 ---------- */
  var TODAY = new Date(2026, 10, 16);
  var SYNCED_AT = new Date(2026, 10, 16, 7, 42);
  var LAST_GOOD = new Date(2026, 10, 13, 16, 10);
  var OWNER = "Maren Okafor";

  var accounts = [
    { name: "Operating checking", last4: "4821", balance: 612940 },
    { name: "Tax reserve savings", last4: "0937", balance: 129370 }
  ];
  var lastMonday = { date: new Date(2026, 10, 9), cash: 760770 };
  var moves = [
    { label: "Client payments in", amount: 41600 },
    { label: "Payroll, Nov 13", amount: -51240 },
    { label: "Other spending", amount: -8820 }
  ];
  var invoices = [
    { no: "INV-2291", client: "Brightwater Health", project: "Brand system, phase 2", amount: 38400, due: new Date(2026, 9, 14), lastReminder: new Date(2026, 10, 2) },
    { no: "INV-2304", client: "Northfold Press", project: "Book series covers (6)", amount: 12600, due: new Date(2026, 9, 30) },
    { no: "INV-2310", client: "Mesa Verde Credit Union", project: "Website redesign, milestone 3", amount: 27500, due: new Date(2026, 10, 6) },
    { no: "INV-2315", client: "Little Fern Bakery", project: "Packaging refresh", amount: 4850, due: new Date(2026, 10, 13) },
    { no: "INV-2318", client: "Atlas Rail Museum", project: "Wayfinding signage", amount: 18200, due: new Date(2026, 10, 20) },
    { no: "INV-2321", client: "Corbel Architects", project: "Identity and stationery", amount: 9750, due: new Date(2026, 10, 27) },
    { no: "INV-2324", client: "Brightwater Health", project: "Brand system, phase 3 deposit", amount: 21000, due: new Date(2026, 11, 9) }
  ];
  var spending = {
    month: "October", prev: "September",
    categories: [
      { name: "Contractors", now: 14300, before: 10200 },
      { name: "Studio rent", now: 9200, before: 9200 },
      { name: "Software and subscriptions", now: 3180, before: 3060 },
      { name: "Hardware and equipment", now: 2640, before: 1380 },
      { name: "Travel and client meetings", now: 1920, before: 2750 },
      { name: "Insurance and bank fees", now: 1240, before: 1240 },
      { name: "Office and supplies", now: 860, before: 1080 }
    ],
    payroll: { now: 102480, before: 95200 }
  };
  var nextPayroll = {
    payDate: new Date(2026, 10, 30), debitDate: new Date(2026, 10, 25), people: 12,
    lines: [ { label: "Gross wages", amount: 44180 }, { label: "Employer taxes", amount: 3380 }, { label: "Benefits", amount: 3680 } ]
  };
  var pastPayroll = [
    { date: new Date(2026, 10, 13), people: 12, total: 51240 },
    { date: new Date(2026, 9, 30), people: 12, total: 51240 },
    { date: new Date(2026, 9, 15), people: 12, total: 51240 },
    { date: new Date(2026, 8, 30), people: 11, total: 47600 },
    { date: new Date(2026, 8, 15), people: 11, total: 47600 }
  ];

  /* ---------- formatting (Intl, en-US) ---------- */
  var LOCALE = "en-US";
  var money0 = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  var moneyK = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", notation: "compact", maximumFractionDigits: 0 });
  var one = new Intl.NumberFormat(LOCALE, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  var dShort = new Intl.DateTimeFormat(LOCALE, { month: "short", day: "numeric" });
  var dLong = new Intl.DateTimeFormat(LOCALE, { weekday: "long", month: "long", day: "numeric" });
  var dWeekday = new Intl.DateTimeFormat(LOCALE, { weekday: "short", month: "short", day: "numeric" });
  var dMonth = new Intl.DateTimeFormat(LOCALE, { month: "short" });
  var tTime = new Intl.DateTimeFormat(LOCALE, { hour: "numeric", minute: "2-digit" });
  var MINUS = "−";

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function money(n, fmt) {
    var parts = (fmt || money0).formatToParts(Math.abs(n));
    var out = n < 0 ? MINUS : "";
    parts.forEach(function (p) { out += p.type === "currency" ? '<span class="cur">' + esc(p.value) + "</span>" : esc(p.value); });
    return '<span class="fig">' + out + "</span>";
  }
  function moneyText(n) { return (n < 0 ? MINUS : "") + money0.format(Math.abs(n)); }
  function icon(name) { return '<i data-lucide="' + name + '" aria-hidden="true"></i>'; }
  function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
  function sum(list, key) { return list.reduce(function (t, x) { return t + x[key]; }, 0); }
  function cssMs(name) { return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--duration-" + name)) || 0; }
  function reducedMotion() { return matchMedia("(prefers-reduced-motion: reduce)").matches; }

  /* ---------- derived figures ---------- */
  var cash = sum(accounts, "balance");
  var monthSpend = sum(spending.categories, "now") + spending.payroll.now;
  var otherNow = sum(spending.categories, "now"), otherBefore = sum(spending.categories, "before");
  var dailySpend = monthSpend * 12 / 365;
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + Math.round(n)); return x; }

  function invStatus(inv) {
    var late = daysBetween(inv.due, TODAY);
    if (late >= 30) return { tone: "danger", icon: "octagon-alert", text: late + " days late", late: late };
    if (late > 0) return { tone: "warning", icon: "triangle-alert", text: late + (late === 1 ? " day late" : " days late"), late: late };
    if (late > -8) return { tone: "info", icon: "clock", text: late === 0 ? "Due today" : "Due in " + (-late) + " days", late: late };
    return { tone: "neutral", icon: "calendar", text: "Due " + dShort.format(inv.due), late: late };
  }

  /* ---------- app state ---------- */
  var params = new URLSearchParams(location.search);
  var forced = params.get("state");
  var state = {
    data: forced === "empty" ? "empty" : forced === "loading" ? "loading" : "ready",
    syncFailed: forced === "error",
    invoicesFailed: forced === "partial",
    denied: forced === "denied",
    sendFails: forced === "sendfail",
    syncedAt: SYNCED_AT,
    reminders: {}
  };
  if (forced === "cleared") invoices = [];
  var firstOverview = true;

  /* ---------- sync status in the bar ---------- */
  var syncEl = document.getElementById("sync"), syncText = document.getElementById("sync-text"), syncBtn = document.getElementById("sync-now");
  function renderSync() {
    syncEl.dataset.tone = "";
    syncBtn.disabled = false;
    if (state.data === "empty") { syncText.textContent = "No bank connected"; syncBtn.disabled = true; }
    else if (state.data === "loading") { syncText.textContent = "Syncing with your bank…"; syncBtn.disabled = true; }
    else if (state.syncFailed) { syncEl.dataset.tone = "error"; syncText.textContent = "Sync failed · showing " + dWeekday.format(LAST_GOOD) + ", " + tTime.format(LAST_GOOD); }
    else syncText.textContent = "Synced " + tTime.format(state.syncedAt);
    document.querySelectorAll("[data-sync]").forEach(function (el) { el.textContent = syncText.textContent; el.dataset.tone = syncEl.dataset.tone; });
  }

  /* ---------- views ---------- */
  function pageHead(title, sub) {
    return '<div class="page-head"><h1 tabindex="-1">' + esc(title) + "</h1>" + (sub ? "<p>" + sub + "</p>" : "") + '<p class="sync-inline" data-sync></p></div>';
  }
  function syncBanner() {
    if (!state.syncFailed) return "";
    return '<div class="banner" role="alert"><span class="ic ic-md">' + icon("cloud-off") + "</span>" +
      "<p><strong>We couldn’t reach your bank this morning.</strong> These are the numbers from " + esc(dWeekday.format(LAST_GOOD) + ", " + tTime.format(LAST_GOOD)) + ". Nothing has been lost.</p>" +
      '<button class="btn" type="button" data-action="retry-sync">' + icon("refresh-cw") + "Try again</button></div>";
  }

  function stageHTML() {
    if (state.denied) {
      return '<section class="sheet stage fp" style="--fp:0" aria-labelledby="locked-title"><div class="locked">' +
        '<span class="ic ic-md">' + icon("lock") + "</span>" +
        '<h2 id="locked-title" class="label">Cash and runway are hidden for your role</h2>' +
        '<p class="muted">Balances are visible to the studio’s owners. Ask ' + esc(OWNER) + " to give your bookkeeper login balance access.</p>" +
        '<a class="link" href="#invoices">Go to unpaid invoices</a></div></section>';
    }
    var unpaid = sum(invoices, "amount");
    var months = cash / monthSpend, monthsCollected = (cash + unpaid) / monthSpend;
    var runout = addDays(TODAY, cash / dailySpend), runoutCollected = addDays(TODAY, (cash + unpaid) / dailySpend);
    var delta = cash - lastMonday.cash;

    // runway strip: 8 ledger columns from this month on
    var start = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1), cols = 8;
    function x(d) {
      var m = (d.getFullYear() - start.getFullYear()) * 12 + d.getMonth() - start.getMonth();
      var dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      return Math.max(0, Math.min(1, (m + (d.getDate() - 1) / dim) / cols)) * 100;
    }
    var colsHTML = "";
    for (var i = 0; i < cols; i++) {
      var monthEnd = new Date(start.getFullYear(), start.getMonth() + i + 1, 0);
      var left = cash - dailySpend * daysBetween(TODAY, monthEnd);
      var out = left <= 0;
      colsHTML += '<li class="' + (out ? "is-out" : "") + '"><span class="caps">' + esc(dMonth.format(monthEnd)) + "</span>" +
        '<span class="v fig">' + (out ? "out" : esc(moneyK.format(left))) + "</span></li>";
    }
    var xToday = x(TODAY), xOut = x(runout), xCollect = x(runoutCollected);
    var stripLabel = "Runway from today, " + dShort.format(TODAY) + ", to " + dShort.format(runout) + " if no one pays; to " + dShort.format(runoutCollected) + " if unpaid invoices are collected. Projected cash at each month end: " +
      Array.prototype.map.call([0,1,2,3,4,5,6,7], function (k) { var e = new Date(start.getFullYear(), start.getMonth() + k + 1, 0); var l = cash - dailySpend * daysBetween(TODAY, e); return dMonth.format(e) + " " + (l > 0 ? moneyText(Math.round(l / 1000) * 1000) : "out"); }).join(", ") + ".";

    var movesHTML = moves.map(function (m) { return "<li><span>" + esc(m.label) + "</span>" + money(m.amount) + "</li>"; }).join("");

    return '<section class="sheet stage fp" style="--fp:0" aria-label="Cash and runway">' +
      '<div class="cash">' +
        '<h2 class="label">Cash in the bank</h2>' +
        '<p class="cash-total">' + money(cash) + "</p>" +
        '<span class="double-rule" aria-hidden="true"></span>' +
        '<p class="delta">' + icon(delta < 0 ? "trending-down" : "trending-up") + (delta < 0 ? "Down " : "Up ") + money(Math.abs(delta)) + " since Monday, " + esc(dShort.format(lastMonday.date)) + "</p>" +
        '<ul class="accounts">' + accounts.map(function (a) { return "<li><span>" + esc(a.name) + ' <span class="muted fig">••' + esc(a.last4) + "</span></span>" + money(a.balance) + "</li>"; }).join("") + "</ul>" +
        '<details class="moves"><summary>What changed this week</summary><ul>' + movesHTML + "</ul></details>" +
      "</div>" +
      '<div class="runway">' +
        '<h2 class="label">Months of runway</h2>' +
        '<p class="runway-figure"><span class="runway-num">' + one.format(months) + '</span><span class="runway-unit">months</span></p>' +
        '<p class="runway-text">At October’s spend of ' + money(monthSpend) + " a month, cash lasts until about <strong>" + esc(dShort.format(runout)) + "</strong> if no one pays us. " +
          (unpaid > 0 ? "Collect the " + money(unpaid) + " in unpaid invoices and it lasts until about <strong>" + esc(dShort.format(runoutCollected)) + "</strong> (" + one.format(monthsCollected) + " months)." : "No invoices are waiting to be paid.") + "</p>" +
        '<div class="strip" role="img" aria-label="' + esc(stripLabel) + '">' +
          '<ol class="months" aria-hidden="true">' + colsHTML + "</ol>" +
          '<div class="track" aria-hidden="true">' +
            (unpaid > 0 ? '<span class="rule-collect" style="inset-inline-start:' + xOut + "%;inline-size:" + (xCollect - xOut) + '%"></span>' : "") +
            '<span class="rule" style="inset-inline-start:' + xToday + "%;inline-size:" + (xOut - xToday) + '%"></span>' +
            '<span class="today" style="inset-inline-start:' + xToday + '%"><span class="marker-label">Today</span></span>' +
            '<span class="runout" style="inset-inline-start:' + xOut + '%"><span class="marker-label">Out ' + esc(dShort.format(runout)) + "</span></span>" +
          "</div>" +
          '<p class="strip-legend" aria-hidden="true"><span class="key">If no one pays</span>' + (unpaid > 0 ? '<span class="key is-dashed">With unpaid invoices collected</span>' : "") + "<span>Column figures: projected cash at month end</span></p>" +
        "</div>" +
      "</div>" +
    "</section>";
  }

  function rowAction(inv, st) {
    var r = state.reminders[inv.no];
    if (r === "queued") return '<span class="row-note row-swap">' + icon("clock") + "Reminder queued</span>";
    if (r === "sent") return '<span class="row-note row-swap" data-tone="success">' + icon("circle-check") + "Reminded today</span>";
    if (st.late <= 0) return "";
    var failed = r === "failed" ? '<span class="row-note row-swap" data-tone="danger">' + icon("circle-x") + "Couldn’t send</span>" : "";
    return '<span class="act-cell' + (failed ? " has-note" : "") + '">' + failed + '<button class="btn row-swap" type="button" data-action="remind" data-inv="' + esc(inv.no) + '">' + icon("send") + (failed ? "Try again" : "Send reminder") + "</button></span>";
  }
  function invoiceRows(list, opts) {
    return list.map(function (inv) {
      var st = invStatus(inv);
      var rem = inv.lastReminder && !state.reminders[inv.no] ? '<span class="reminded">Last reminder ' + esc(dShort.format(inv.lastReminder)) + "</span>" : "";
      return '<tr class="inv-row" data-inv="' + esc(inv.no) + '">' +
        '<td><span class="client" title="' + esc(inv.client) + '">' + esc(inv.client) + '</span><br><span class="project">' + esc(inv.project) + "</span></td>" +
        '<td class="col-inv"><span class="inv-no">' + esc(inv.no) + "</span>" + (opts && opts.dueCol ? '<br><span class="muted">Due ' + esc(dShort.format(inv.due)) + "</span>" : "") + "</td>" +
        '<td class="col-status"><span class="status" data-tone="' + st.tone + '">' + icon(st.icon) + esc(st.text) + "</span>" + rem + "</td>" +
        '<td class="num amount">' + money(inv.amount) + "</td>" +
        '<td class="act">' + rowAction(inv, st) + "</td></tr>";
    }).join("");
  }
  function sortedInvoices() { return invoices.slice().sort(function (a, b) { return a.due - b.due; }); }

  function agingHTML() {
    var b = { notdue: 0, b1: 0, b2: 0, b3: 0 };
    invoices.forEach(function (inv) { var l = invStatus(inv).late; if (l <= 0) b.notdue += inv.amount; else if (l <= 15) b.b1 += inv.amount; else if (l <= 30) b.b2 += inv.amount; else b.b3 += inv.amount; });
    var total = b.notdue + b.b1 + b.b2 + b.b3;
    var parts = [["b-notdue", "Not due yet", b.notdue, "--sw: color-mix(in oklch, var(--color-muted-foreground) 35%, var(--color-card))"], ["b-1", "1–15 days late", b.b1, "--sw: color-mix(in oklch, var(--color-warning) 55%, var(--color-card))"], ["b-2", "16–30 days late", b.b2, "--sw: var(--color-warning)"], ["b-3", "31–60 days late", b.b3, "--sw: var(--color-destructive)"]];
    return '<div class="aging"><div class="aging-bar" role="img" aria-label="' + esc(parts.map(function (p) { return p[1] + " " + moneyText(p[2]); }).join(", ")) + '">' +
      parts.map(function (p) { return p[2] ? '<span class="' + p[0] + '" style="flex-grow:' + (p[2] / total).toFixed(4) + '"></span>' : ""; }).join("") +
      '</div><ul class="aging-keys" aria-hidden="true">' + parts.map(function (p) { return '<li style="' + p[3] + '"><span>' + p[1] + "</span>" + money(p[2]) + "</li>"; }).join("") + "</ul></div>";
  }

  function invoicesSection(opts) {
    var full = opts && opts.full;
    var head = '<div class="sheet-head"><h2 id="inv-title">Unpaid invoices</h2>' + (full ? "" : (invoices.length ? '<a class="link" href="#invoices">See all ' + invoices.length + " invoices</a>" : "")) + "</div>";
    if (state.invoicesFailed) {
      return '<section class="sheet fp" style="--fp:1" aria-labelledby="inv-title">' + head +
        '<div class="inline-empty" role="alert"><p><strong>Invoices didn’t load from your accounting tool.</strong> Cash, runway and payroll above are up to date.</p>' +
        '<button class="btn" type="button" data-action="retry-invoices">' + icon("refresh-cw") + "Try again</button></div></section>";
    }
    if (!invoices.length) {
      return '<section class="sheet fp" style="--fp:1" aria-labelledby="inv-title">' + head +
        '<div class="inline-empty"><p><strong>No unpaid invoices.</strong> Every client has paid. New invoices appear here when you send them from your accounting tool.</p></div></section>';
    }
    var unpaid = sum(invoices, "amount");
    var overdueList = invoices.filter(function (i) { return invStatus(i).late > 0; });
    var overdue = sum(overdueList, "amount");
    var clients = {}; overdueList.forEach(function (i) { clients[i.client] = 1; });
    var shown = full ? sortedInvoices() : sortedInvoices().filter(function (i) { return invStatus(i).late > -8; });
    var hidden = invoices.length - shown.length;
    return '<section class="sheet fp" style="--fp:1" aria-labelledby="inv-title">' + head +
      '<p class="finding">' + money(unpaid) + " unpaid. <strong>" + money(overdue) + " of it is overdue</strong>, from " + Object.keys(clients).length + " clients.</p>" +
      agingHTML() +
      '<table class="ledger ledger-inv"><caption class="sr-only">' + (full ? "All unpaid invoices" : "Overdue and due this week") + ", oldest due date first</caption>" +
      '<thead><tr><th scope="col" class="caps">Client and project</th><th scope="col" class="caps col-inv">Invoice</th><th scope="col" class="caps">Status</th><th scope="col" class="caps num">Amount</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead>' +
      "<tbody>" + invoiceRows(shown, { dueCol: full }) + "</tbody></table>" +
      (!full && hidden > 0 ? '<div class="sheet-foot"><span class="muted">' + hidden + " more not due for over a week: " + money(sum(sortedInvoices().filter(function (i) { return invStatus(i).late <= -8; }), "amount")) + '</span><a class="link" href="#invoices">See all invoices</a></div>' : "") +
      "</section>";
  }

  function payrollSection(big) {
    var total = sum(nextPayroll.lines, "amount");
    var op = accounts[0].balance;
    var covered = op >= total;
    var lines = nextPayroll.lines.map(function (l) { return "<div><dt>" + esc(l.label) + "</dt><dd>" + money(l.amount) + "</dd></div>"; }).join("");
    var coveredHTML = state.denied ? "" : '<p class="covered' + (big ? "" : " covered-mark") + '"><span class="ic">' + icon(covered ? "circle-check" : "octagon-alert") + "</span><span>" +
      (covered ? "<strong>Covered.</strong> Operating checking holds " + money(op) + ", about " + Math.round(op / total) + " times this run." : "<strong>Not covered.</strong> Operating checking is " + money(total - op) + " short.") + "</span></p>";
    return '<section class="sheet fp" style="--fp:2" aria-labelledby="pay-title">' +
      '<div class="sheet-head"><h2 id="pay-title">Next payroll</h2>' + (big ? "" : '<a class="link" href="#payroll">Past runs</a>') + "</div>" +
      '<p class="pay-date">' + esc(dLong.format(nextPayroll.payDate)) + "</p>" +
      '<p class="muted">' + nextPayroll.people + " people</p>" +
      '<dl class="pay-lines">' + lines + "</dl>" +
      '<span class="double-rule pay-total-rule" aria-hidden="true"></span>' +
      '<p class="pay-total"><span>Total</span>' + money(total) + "</p>" +
      coveredHTML +
      '<p class="pay-note">Leaves operating checking on ' + esc(dWeekday.format(nextPayroll.debitDate)) + ", a day early because of Thanksgiving.</p>" +
      "</section>";
  }

  function spendingSection() {
    var max = Math.max.apply(null, spending.categories.map(function (c) { return c.now; }));
    var cats = spending.categories.slice().sort(function (a, b) { return b.now - a.now; });
    var top = cats.reduce(function (best, c) { return (c.now - c.before) > (best.now - best.before) ? c : best; }, cats[0]);
    var diff = otherNow - otherBefore;
    return '<section class="sheet fp" style="--fp:3" aria-labelledby="spend-title">' +
      '<div class="sheet-head"><h2 id="spend-title">Spending in ' + spending.month + '</h2><a class="link" href="#spending">See all spending</a></div>' +
      '<p class="finding">Outside payroll: <strong>' + money(otherNow) + "</strong>, " + (diff >= 0 ? "up " : "down ") + money(Math.abs(diff)) + " on " + spending.prev + ". " + esc(top.name) + " made most of the rise (+" + money(top.now - top.before) + ").</p>" +
      '<ol class="bars" aria-label="Spending in ' + spending.month + ' by category, largest first">' + cats.map(function (c, i) {
        return '<li style="--i:' + i + '"><span>' + esc(c.name) + "</span>" + money(c.now) + '<span class="track-h" aria-hidden="true"><span class="fill" style="--v:' + (c.now / max).toFixed(3) + '"></span></span></li>';
      }).join("") + "</ol></section>";
  }

  function emptyHTML() {
    return '<section class="sheet fp" style="--fp:0" aria-labelledby="empty-title"><div class="empty">' +
      '<span class="double-rule" aria-hidden="true"></span>' +
      '<h2 id="empty-title">Connect your bank to start the ledger</h2>' +
      "<p>Cash, months of runway and the next payroll appear here once Studio Ledger can read your business accounts. It reads balances and transactions; it can’t move money.</p>" +
      '<div class="empty-actions"><button class="btn btn-primary" type="button" data-action="connect">' + icon("landmark") + "Connect bank account</button></div>" +
      "</div></section>";
  }

  function skeletonHTML() {
    function lines(n, widths) { var s = ""; for (var i = 0; i < n; i++) s += '<span class="sk" style="inline-size:' + widths[i % widths.length] + '%;margin-block:var(--space-3)"></span>'; return s; }
    return '<div class="skeleton-wrap" aria-hidden="true">' +
      '<div class="sheet stage"><div class="cash">' + lines(1, [40]) + '<span class="sk" style="block-size:var(--text-4xl);inline-size:80%"></span>' + lines(3, [70, 90, 60]) + '</div>' +
      '<div class="runway">' + lines(1, [20]) + '<span class="sk" style="block-size:var(--text-6xl);inline-size:45%"></span>' + lines(2, [90, 70]) + '<span class="sk" style="block-size:var(--space-16)"></span></div></div>' +
      '<div class="below"><div class="sheet">' + lines(6, [30, 70, 100, 100, 100, 100]) + '</div><div class="side"><div class="sheet">' + lines(5, [40, 70, 100, 100, 60]) + '</div><div class="sheet">' + lines(5, [50, 100, 90, 80, 70]) + "</div></div></div></div>";
  }

  function overviewHTML() {
    var sub = esc(dLong.format(TODAY)) + " · week " + isoWeek(TODAY);
    if (state.data === "empty") return pageHead("Overview", sub) + emptyHTML();
    if (state.data === "loading") return pageHead("Overview", sub) + '<div aria-busy="true"><p class="sr-only">Syncing with your bank…</p>' + skeletonHTML() + "</div>";
    return pageHead("Overview", sub) + syncBanner() + stageHTML() +
      '<div class="below">' + invoicesSection() + '<div class="side">' + payrollSection(false) + spendingSection() + "</div></div>";
  }

  function invoicesViewHTML() {
    if (state.data !== "ready") return pageHead("Invoices") + loadingOrEmptyNote();
    return pageHead("Invoices", "Every unpaid invoice, oldest due date first") + syncBanner() + '<div class="view-grid">' + invoicesSection({ full: true }) + "</div>";
  }
  function spendingViewHTML() {
    if (state.data !== "ready") return pageHead("Spending") + loadingOrEmptyNote();
    var rows = spending.categories.slice().sort(function (a, b) { return b.now - a.now; }).map(function (c) {
      var d = c.now - c.before;
      return '<tr><td>' + esc(c.name) + '</td><td class="num">' + money(c.now) + '</td><td class="num">' + money(c.before) + '</td><td class="num">' + (d === 0 ? '<span class="muted fig">no change</span>' : (d > 0 ? '<span class="fig">+</span>' : "") + money(d)) + "</td></tr>";
    }).join("");
    return pageHead("Spending", spending.month + " compared with " + spending.prev + ", outside payroll") + syncBanner() +
      '<div class="view-grid"><section class="sheet" aria-labelledby="spt"><div class="sheet-head"><h2 id="spt">Where ' + spending.month + "’s money went</h2></div>" +
      '<table class="ledger"><thead><tr><th scope="col" class="caps">Category</th><th scope="col" class="caps num">' + monthHead(spending.month) + '</th><th scope="col" class="caps num">' + monthHead(spending.prev) + '</th><th scope="col" class="caps num">Change</th></tr></thead><tbody>' + rows + "</tbody>" +
      '<tfoot><tr><td>Total outside payroll<span class="double-rule total-rule" aria-hidden="true"></span></td><td class="num">' + money(otherNow) + '</td><td class="num">' + money(otherBefore) + '</td><td class="num"><span class="fig">+</span>' + money(otherNow - otherBefore) + "</td></tr></tfoot></table>" +
      '<p class="finding">Payroll and benefits were ' + money(spending.payroll.now) + " in " + spending.month + ' (' + money(spending.payroll.before) + ' in ' + spending.prev + '). They’re on the <a class="link" href="#payroll">Payroll</a> page.</p></section></div>';
  }
  function monthHead(m) { return '<span class="m-long">' + m + '</span><span class="m-short" aria-hidden="true">' + m.slice(0, 3) + "</span>"; }
  function payrollViewHTML() {
    if (state.data !== "ready") return pageHead("Payroll") + loadingOrEmptyNote();
    var rows = pastPayroll.map(function (p) { return "<tr><td>" + esc(dWeekday.format(p.date)) + '</td><td class="num"><span class="fig">' + p.people + '</span></td><td class="num">' + money(p.total) + "</td></tr>"; }).join("");
    return pageHead("Payroll", "Paid on the 15th and the last business day of each month") + syncBanner() +
      '<div class="below">' + payrollSection(true) +
      '<section class="sheet" aria-labelledby="past-title"><div class="sheet-head"><h2 id="past-title">Recent payroll runs</h2></div>' +
      '<table class="ledger"><thead><tr><th scope="col" class="caps">Paid</th><th scope="col" class="caps num">People</th><th scope="col" class="caps num">Total</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      '<p class="finding">Payroll rose to 12 people on October 1.</p></section></div>';
  }
  function loadingOrEmptyNote() {
    if (state.data === "loading") return '<div aria-busy="true"><p class="sr-only">Syncing with your bank…</p><div class="sheet skeleton-wrap" aria-hidden="true"><span class="sk" style="inline-size:40%"></span><span class="sk" style="margin-block:var(--space-4)"></span><span class="sk" style="inline-size:80%"></span></div></div>';
    return '<section class="sheet"><div class="inline-empty"><p>Nothing to show until your bank is connected.</p><a class="link" href="#overview">Go to Overview to connect it</a></div></section>';
  }

  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 86400000 + 1) / 7);
  }

  /* ---------- render + routing ---------- */
  var VIEWS = { overview: ["Overview", overviewHTML], invoices: ["Invoices", invoicesViewHTML], spending: ["Spending", spendingViewHTML], payroll: ["Payroll", payrollViewHTML] };
  var mainEl = document.querySelector("main");
  function currentView() { var h = location.hash.replace("#", ""); return VIEWS[h] ? h : "overview"; }

  function signatureOnce(key) {
    try { if (sessionStorage.getItem(key)) return false; sessionStorage.setItem(key, "1"); } catch (e) { /* storage blocked */ }
    return true;
  }

  function render(opts) {
    var v = currentView();
    document.title = VIEWS[v][0] + " · Studio Ledger";
    document.querySelectorAll(".tab").forEach(function (t) { if (t.dataset.view === v) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current"); });
    mainEl.innerHTML = '<div class="page' + (opts && opts.fadeIn ? " content-in" : "") + '">' + VIEWS[v][1]() + "</div>";
    renderSync();
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } });

    if (v === "overview" && state.data === "ready" && firstOverview) {
      firstOverview = false;
      if (signatureOnce("ledger-runway")) {
        var stage = mainEl.querySelector(".stage"); if (stage && !state.denied) stage.classList.add("runway-signature");
        var cov = mainEl.querySelector(".covered-mark"); if (cov) cov.classList.add("covered-signature");
        var bars = mainEl.querySelector(".bars"); if (bars) bars.classList.add("bars-first");
      }
    }
    if (opts && opts.focus) { var h = mainEl.querySelector("h1"); if (h) h.focus({ preventScroll: false }); }
  }

  function navigate() {
    document.documentElement.classList.remove("first-paint");
    if (!document.startViewTransition || reducedMotion()) { render({ focus: true }); return; }
    document.startViewTransition(function () { render({ focus: true }); });
  }
  window.addEventListener("hashchange", navigate);

  /* ---------- actions ---------- */
  var SYNC_WAIT = 1200; // simulated bank round-trip (not a motion value)
  var UNDO_WINDOW = 8000; // reading time for the undo toast (not a motion value)

  function runSync(then) {
    state.data = "loading";
    render();
    setTimeout(function () {
      state.data = "ready"; state.syncFailed = false; state.syncedAt = new Date();
      if (then) then();
      render({ fadeIn: true });
    }, SYNC_WAIT);
  }

  mainEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b) return;
    var a = b.dataset.action;
    if (a === "retry-sync" || a === "connect") runSync();
    else if (a === "retry-invoices") { b.disabled = true; setTimeout(function () { state.invoicesFailed = false; render({ fadeIn: true }); }, SYNC_WAIT); }
    else if (a === "remind") queueReminder(b.dataset.inv);
  });
  syncBtn.addEventListener("click", function () { runSync(); });

  function findInv(no) { return invoices.filter(function (i) { return i.no === no; })[0]; }
  function updateRow(no) {
    var row = mainEl.querySelector('tr[data-inv="' + no + '"]');
    var inv = findInv(no);
    if (!row || !inv) return;
    var cell = row.querySelector("td.act");
    cell.innerHTML = rowAction(inv, invStatus(inv));
    var remCell = row.querySelector(".reminded"); if (remCell && state.reminders[no]) remCell.remove();
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
  }
  function queueReminder(no) {
    var inv = findInv(no); if (!inv) return;
    state.reminders[no] = "queued"; updateRow(no);
    var timer = setTimeout(function () {
      state.reminders[no] = state.sendFails ? "failed" : "sent"; updateRow(no);
      if (state.sendFails) toast("Reminder to " + inv.client + " didn’t send. The email service didn’t answer. Try again from the row.");
    }, UNDO_WINDOW);
    toast("Reminder to " + inv.client + " for " + moneyText(inv.amount) + " queued. It sends in 8 seconds.", {
      action: "Undo", timeout: UNDO_WINDOW, onAction: function () {
        clearTimeout(timer); delete state.reminders[no]; updateRow(no);
        var btn = mainEl.querySelector('button[data-inv="' + no + '"]'); if (btn) btn.focus();
      }
    });
  }

  /* toast stack */
  var list = document.querySelector(".toast-list");
  function restack() { Array.prototype.forEach.call(list.children, function (t, i) { t.style.setProperty("--i", i); }); }
  function toast(message, o) {
    o = o || {};
    var el = document.createElement("div"); el.className = "toast";
    el.innerHTML = "<p></p>" + (o.action ? '<button class="btn" type="button"></button>' : "");
    el.querySelector("p").textContent = message;
    if (o.action) { var btn = el.querySelector("button"); btn.textContent = o.action; btn.addEventListener("click", function () { if (o.onAction) o.onAction(); dismiss(el); }); }
    list.prepend(el);
    while (list.children.length > 3) list.lastElementChild.remove();
    restack();
    var timeout = o.timeout || 6000;
    var timer = setTimeout(function () { dismiss(el); }, timeout);
    el.addEventListener("pointerenter", function () { clearTimeout(timer); });
    el.addEventListener("pointerleave", function () { timer = setTimeout(function () { dismiss(el); }, 2000); });
    el.addEventListener("focusin", function () { clearTimeout(timer); });
  }
  function dismiss(el) {
    if (!el.isConnected || el.classList.contains("is-leaving")) return;
    el.classList.add("is-leaving");
    var done = function () { if (el.isConnected) el.remove(); restack(); };
    el.addEventListener("transitionend", done, { once: true });
    setTimeout(done, cssMs("short") + 50);
  }

  /* theme toggle (per viewer) */
  var themeBtn = document.getElementById("theme");
  function isDark() { var t = document.documentElement.dataset.theme; return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
  function renderThemeBtn() {
    var dark = isDark();
    themeBtn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    themeBtn.innerHTML = icon(dark ? "sun" : "moon");
    if (window.lucide) window.lucide.createIcons({ attrs: { "stroke-width": 1.5 } });
  }
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("ledger-theme", next); } catch (e) { /* not saved */ }
    renderThemeBtn();
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderThemeBtn);

  render();
  renderThemeBtn();
})();
</script>
</body>
</html>
