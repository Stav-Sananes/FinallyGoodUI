/* groomer switch (tabs-indicator technique) */
.switch { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border-radius: var(--radius-full); background: var(--color-muted); margin-block-start: var(--space-4); padding: var(--space-1); }

@media (hover: hover) and (pointer: fine) { .slot:hover:not([aria-disabled="true"]):not([aria-checked="true"]) .slot-time { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; text-decoration-color: var(--color-mark); } }

/* motif in each row: the day as a tiny comb with this visit marked */

/* states */
.state-box { display: grid; gap: var(--space-3); justify-items: start; padding-block: var(--space-4); max-inline-size: 46ch; }

  display: grid; grid-template-columns: auto 1fr; gap: var(--space-3); align-items: start;
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--color-muted); margin-block-end: var(--space-4);
  font-size: var(--text-sm);
}

.notice-error .ph { color: var(--color-destructive); }
.notice .btn { min-block-size: 44px; margin-block-start: var(--space-2); padding-inline: var(--space-3); font-size: var(--text-sm); }

/* skeleton: the comb ghost, shown only if loading takes > 300ms */

@keyframes sk-appear { from { opacity: 0; } }

.sk { display: block; block-size: 14px; border-radius: var(--radius-sm); background: var(--color-muted); }
.sk-time { block-size: 22px; }
.sk-meta { inline-size: 70%; }
.sk-comb { block-size: 12px; background: repeating-linear-gradient(90deg, var(--color-muted) 0 2px, transparent 2px 8px); border-block-start: 2px solid var(--color-muted); border-radius: 0; }

/* action bar */
.actionbar {
  position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 9;
  padding: var(--space-3) max(var(--space-4), env(safe-area-inset-right)) calc(var(--space-3) + env(safe-area-inset-bottom)) max(var(--space-4), env(safe-area-inset-left));

}

.actionbar-hint[data-alert] { color: var(--color-destructive); font-weight: 600; }

/* review */
.summary { margin-block-start: var(--space-6); display: grid; max-inline-size: 640px; }
.summary-row { display: grid; grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-4); align-items: center; padding-block: var(--space-4); border-block-end: 1px solid var(--color-border); }
.summary-row dt { font-size: var(--text-sm); color: var(--color-muted-foreground); grid-column: 1; }
.summary-row dd { margin: 0; font-weight: 600; grid-column: 1; font-variant-numeric: tabular-nums; }
.summary-row .btn-quiet { grid-column: 2; grid-row: 1 / span 2; text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
.summary-big { font-family: var(--font-display); font-size: var(--text-2xl); letter-spacing: var(--text-2xl--letter-spacing); line-height: var(--text-2xl--line-height); }
.field { display: grid; gap: var(--space-1); margin-block-start: var(--space-6); max-inline-size: 640px; }
.field label { font-weight: 600; }
.field .hint { font-size: var(--text-sm); color: var(--color-muted-foreground); }
.field textarea { font: inherit; font-size: var(--text-base); min-block-size: 96px; padding: var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-input); background: var(--color-card); color: var(--color-foreground); resize: vertical; }
.fineprint { margin-block-start: var(--space-4); font-size: var(--text-sm); color: var(--color-muted-foreground); max-inline-size: 60ch; }
.inline-error { display: flex; gap: var(--space-2); align-items: flex-start; color: var(--color-destructive); font-weight: 600; font-size: var(--text-sm); }

/* booked: the signature */
.booked { display: grid; gap: var(--space-4); max-inline-size: 640px; padding-block-start: var(--space-8); }
.booked .comb { margin: var(--space-2) 0 0; }

.signature-teeth span[data-stay] { background: var(--color-mark); opacity: 1; block-size: 28px; animation: signature-tooth var(--duration-standard) var(--ease-enter-emphasized) both; animation-delay: calc(var(--n) * var(--stagger)); }
@keyframes signature-tooth { from { transform: scaleY(0.3); opacity: 0.3; } }
.signature-fact { animation: signature-rise var(--duration-standard) var(--ease-enter) var(--duration-standard) both; }
@keyframes signature-rise { from { opacity: 0; transform: translateY(6px); } }
.booked[data-settled] *, .booked[data-settled] .signature-teeth span { animation: none; }
.booked-actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-block-start: var(--space-4); }

/* home */
.home { display: grid; gap: var(--space-6); max-inline-size: 640px; }
.appt { display: grid; gap: var(--space-3); padding-block: var(--space-4); border-block: 1px solid var(--color-border); }
.appt-when { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 600; letter-spacing: var(--text-2xl--letter-spacing); line-height: var(--text-2xl--line-height); font-variant-numeric: tabular-nums; }
.appt-meta { color: var(--color-muted-foreground); }

/* toast with undo */
.toasts { position: fixed; inset-inline: var(--space-4); inset-block-end: calc(var(--space-6) + env(safe-area-inset-bottom)); z-index: 30; display: grid; justify-items: center; pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--color-primary); color: var(--color-primary-foreground); animation: toast-in var(--duration-standard) var(--ease-enter) both; max-inline-size: 480px; }

.toast[data-leaving] { animation: toast-out var(--duration-short) var(--ease-exit) both; }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

/* ---------- Desktop: stage left, picking right ---------- */
@media (min-width: 900px) {
  .view { padding-block-end: var(--space-16); }
  .time-layout { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); column-gap: var(--space-16); align-items: start; }
  .stage-col { position: sticky; inset-block-start: calc(var(--header-h) + var(--space-6)); }
  .stage { --stage-min: 420px; padding-block-start: var(--space-12); }
  .readout { font-size: clamp(64px, 6.4vw, 96px); }
  .readout.readout-prompt { font-size: clamp(40px, 3.6vw, 56px); }
  .days { gap: var(--space-2); }
  .actionbar { position: sticky; inset-block-end: 0; inset-inline: auto; margin-block-start: var(--space-6); padding-inline: 0; background: var(--color-background); }

}

}
@keyframes fade-in { from { opacity: 0; } }

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <header class="topbar" id="topbar"></header>
  <main id="main" tabindex="-1"><div class="view" id="view"></div></main>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<p class="sr-only" role="status" id="announcer"></p>

<script>
"use strict";

/* ---------- Motion tokens, read live from CSS (no literals) ---------- */
const rootStyle = () => getComputedStyle(document.documentElement);
const ms = (name) => parseFloat(rootStyle().getPropertyValue(`--duration-${name}`)) || 0;
const prefersReducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

/* Simulated server timing: business timing, not motion. */
const DIARY_LATENCY_MS = 650;
const BOOKING_LATENCY_MS = 900;
const UNDO_WINDOW_MS = 8000;

/* ---------- Domain data (sample content from the brief) ---------- */
const OPEN_MIN = 8 * 60;
const CLOSE_MIN = 17 * 60;
const SLOT_STEP_MIN = 30;
const TODAY = new Date(2026, 10, 16); // Mon 16 Nov 2026

const DOGS = [
  { id: "bella", name: "Bella", breed: "Cockapoo", size: "medium", coat: "curly coat" },
  { id: "biscuit", name: "Biscuit", breed: "Miniature dachshund", size: "small", coat: "smooth coat" },
];
const SERVICES = [
  { id: "bath", name: "Bath & tidy", what: "Wash, blow-dry, brush-out, ears and nails", minutes: { medium: 60, small: 45 }, price: { medium: 45, small: 38 } },
  { id: "full", name: "Full groom", what: "Bath plus a full haircut, scissored to your brief", minutes: { medium: 120, small: 90 }, price: { medium: 70, small: 60 } },
  { id: "nails", name: "Nail trim", what: "Clip and file, no bath", minutes: { medium: 15, small: 15 }, price: { medium: 15, small: 15 } },
];
const GROOMERS = [
  { id: "either", name: "Either groomer", note: "Most times to choose from" },
  { id: "sam", name: "Sam", note: "Hand-scissoring, doodles and spaniels" },
  { id: "priya", name: "Priya", note: "Small breeds and nervous dogs" },
];
const SALON = { name: "Brindle", address: "14 Alder Street" };

/* Busy stretches per groomer per day (minutes from midnight). Closed days are absent. */
const DIARY = {
  "2026-11-17": { sam: [[480, 900]], priya: [[480, 600], [720, 1020]] },
  "2026-11-18": { sam: [[600, 720]], priya: [[480, 780], [900, 1020]] },
  "2026-11-19": { sam: [[690, 810], [900, 1020]], priya: [[480, 1020]] },
  "2026-11-20": { sam: [[480, 720]], priya: [[480, 540], [660, 1020]] },
  "2026-11-21": { sam: [[480, 1020]], priya: [[480, 1020]] },
  "2026-11-24": { sam: [[780, 900]], priya: [[480, 570]] },
  "2026-11-25": { sam: [[480, 660]], priya: [[840, 1020]] },
  "2026-11-26": { sam: [[540, 660]], priya: [[600, 780]] },
  "2026-11-27": { sam: [[480, 600]], priya: [[720, 840]] },
  "2026-11-28": { sam: [[480, 900]], priya: [[480, 960]] },
};
const FLAKY = { "2026-11-27": "all", "2026-11-25": "priya" }; // fail on first load, then recover

/* ---------- Formatting (Intl, user's locale) ---------- */
const LOCALE = navigator.languages?.[0] || "en-US";
const fmtWeekdayShort = new Intl.DateTimeFormat(LOCALE, { weekday: "short" });
const fmtWeekdayLong = new Intl.DateTimeFormat(LOCALE, { weekday: "long" });
const fmtDayLong = new Intl.DateTimeFormat(LOCALE, { weekday: "long", day: "numeric", month: "long" });
const fmtDayShort = new Intl.DateTimeFormat(LOCALE, { weekday: "short", day: "numeric", month: "short" });
const fmtTime = new Intl.DateTimeFormat(LOCALE, { hour: "numeric", minute: "2-digit" });
const fmtHour = new Intl.DateTimeFormat(LOCALE, { hour: "numeric" });
const fmtMoney = new Intl.NumberFormat(LOCALE, { style: "currency", currency: "USD", maximumFractionDigits: 0 });

const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const dateFromIso = (iso) => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const atMinutes = (iso, minutes) => { const d = dateFromIso(iso); d.setHours(0, minutes, 0, 0); return d; };
const timeText = (iso, minutes) => fmtTime.format(atMinutes(iso, minutes));
const durationText = (minutes) => minutes < 60 ? `${minutes} min` : (minutes % 60 ? `${Math.floor(minutes / 60)} h ${minutes % 60}` : `${minutes / 60} h`);
const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Time with its day period set quieter on the same baseline (craft.number-setting). */
function timeHtml(iso, minutes) {
  return fmtTime.formatToParts(atMinutes(iso, minutes)).map((p) =>
    p.type === "dayPeriod" ? `<span class="unit">${p.value}</span>` : p.type === "literal" && /\s/.test(p.value) ? "" : escapeHtml(p.value)
  ).join("");
}

/* ---------- Availability ---------- */
const BOOKING_WINDOW_DAYS = 14;
function windowDays() {
  return Array.from({ length: BOOKING_WINDOW_DAYS }, (_, i) => { const d = new Date(TODAY); d.setDate(d.getDate() + 1 + i); return isoDay(d); });
}
const isClosed = (iso) => !(iso in DIARY);

function freeStarts(busy, minutes) {
  const starts = [];
  for (let t = OPEN_MIN; t + minutes <= CLOSE_MIN; t += SLOT_STEP_MIN) {
    if (!busy.some(([a, b]) => t < b && t + minutes > a)) starts.push(t);
  }
  return starts;
}

/** Times for one day: [{start, groomers:[...]}], filtered by the chosen groomer. */
function timesFor(iso, minutes, groomerId, loadedGroomers = ["sam", "priya"]) {
  if (isClosed(iso)) return [];
  const byStart = new Map();
  for (const g of loadedGroomers) {
    if (groomerId !== "either" && g !== groomerId) continue;
    for (const t of freeStarts(DIARY[iso][g], minutes)) {
      if (state.taken.has(`${iso}|${t}|${g}`)) continue;
      byStart.set(t, [...(byStart.get(t) || []), g]);
    }
  }
  return [...byStart.entries()].sort((a, b) => a[0] - b[0]).map(([start, groomers]) => ({ start, groomers }));
}

/* ---------- App state ---------- */
const params = new URLSearchParams(location.search);
const FORCED = params.get("state");

const state = {
  dogId: "bella",
  serviceId: "full",
  groomerId: FORCED === "groomer-empty" ? "priya" : "either",
  day: { closed: "2026-11-23", full: "2026-11-21", error: "2026-11-27", partial: "2026-11-25", "groomer-empty": "2026-11-19" }[FORCED] || null,
  time: null,          // { start, groomers }
  note: "",
  booking: null,       // confirmed appointment
  taken: new Set(),    // "iso|start|groomer" booked by someone else meanwhile
  loaded: new Map(),   // iso -> { status: "ok" | "error" | "partial", groomers: [...] }
  failedOnce: new Set(),
  conflict: null,      // { iso, start }
  bookFailedOnce: false,
  pendingStart: null,  // time to select once a day finishes loading
};

const dog = () => DOGS.find((d) => d.id === state.dogId);
const service = () => SERVICES.find((s) => s.id === state.serviceId);
const groomer = () => GROOMERS.find((g) => g.id === state.groomerId);
const stayMinutes = () => service().minutes[dog().size];
const groomerNames = (ids) => ids.map((id) => GROOMERS.find((g) => g.id === id).name).join(" or ");

function firstDayWithTimes(fromIso) {
  return windowDays().find((iso) => iso >= (fromIso || "") && timesFor(iso, stayMinutes(), state.groomerId).length) || null;
}

/* ---------- Diary loading (simulated network) ---------- */
function loadDiary(iso) {
  if (FORCED === "loading") return new Promise(() => {});
  return new Promise((resolve) => setTimeout(() => {
    const flaky = FLAKY[iso];
    const firstTime = !state.failedOnce.has(iso);
    if (flaky && firstTime && FORCED !== "full") {
      state.failedOnce.add(iso);
      resolve(flaky === "all" ? { status: "error", groomers: [] } : { status: "partial", groomers: ["sam"] });
      return;
    }
    resolve({ status: "ok", groomers: ["sam", "priya"] });
  }, DIARY_LATENCY_MS));
}

/* ---------- Router ---------- */
const STEPS = ["dog", "service", "groomer", "time", "review"];
const ROUTES = ["home", ...STEPS, "booked"];
let currentRoute = null;

function routeFromHash() {
  const r = location.hash.replace(/^#\/?/, "") || "time";
  return ROUTES.includes(r) ? r : "time";
}
function go(route) {
  if (location.hash === `#/${route}`) render();
  else location.hash = `#/${route}`;
}
function directionTo(route) {
  const order = (r) => ROUTES.indexOf(r);
  if (currentRoute === null) return null;
  return order(route) >= order(currentRoute) ? "forward" : "back";
}

/* ---------- Header ---------- */
function renderHeader(route) {
  const header = document.getElementById("topbar");
  const stepIndex = STEPS.indexOf(route);
  if (stepIndex === -1) {
    header.innerHTML = `<span></span><div class="topbar-mid"><span class="wordmark">Brindle</span></div><span></span>`;
    return;
  }
  const teeth = STEPS.map((_, i) => `<span ${i < stepIndex ? "data-done" : ""} ${i === stepIndex ? "data-current" : ""}></span>`).join("");
  const back = stepIndex > 0
    ? `<button class="icon-btn" type="button" data-go="${STEPS[stepIndex - 1]}" aria-label="Back to ${STEPS[stepIndex - 1]}"><i class="ph ph-arrow-left" aria-hidden="true"></i></button>`
    : `<span></span>`;
  header.innerHTML = `${back}
    <div class="topbar-mid"><span class="topbar-step">Step ${stepIndex + 1} of ${STEPS.length}</span><span class="progress-comb" aria-hidden="true">${teeth}</span></div>
    <button class="icon-btn" type="button" data-go="home" aria-label="Close booking (your choices are kept)"><i class="ph ph-x" aria-hidden="true"></i></button>`;
}

/* ---------- Shared bits ---------- */
function combHtml({ span = null, muted = false, teethClass = "", stay = null } = {}) {
  const total = (CLOSE_MIN - OPEN_MIN) / 15;
  const teeth = Array.from({ length: total + 1 }, (_, i) => {
    const minute = OPEN_MIN + i * 15;
    const inStay = stay && minute >= stay.start && minute <= stay.start + stay.minutes;
    const n = inStay ? (minute - stay.start) / 15 : 0;
    return `<span ${minute % 60 === 0 ? "data-hour" : ""} ${inStay ? `data-stay style="--n:${n}"` : ""}></span>`;
  }).join("");
  const hours = [8, 11, 14, 17].map((h) => {
    const at = (h * 60 - OPEN_MIN) / (CLOSE_MIN - OPEN_MIN);
    return `<span style="--at:${at}">${fmtHour.format(atMinutes("2026-11-17", h * 60))}</span>`;
  }).join("");
  const spanEl = span ? `<div class="comb-span" id="comb-span"></div>` : "";
  return `<div class="comb" aria-hidden="true" ${muted ? "data-muted" : ""}>
    ${spanEl}<div class="comb-spine"></div><div class="comb-teeth ${teethClass}">${teeth}</div><div class="comb-hours">${hours}</div></div>`;
}
const fraction = (minute) => (minute - OPEN_MIN) / (CLOSE_MIN - OPEN_MIN);

function miniComb(start, minutes) {
  const ticks = Array.from({ length: 10 }, () => "<i></i>").join("");
  return `<span class="mini-comb" aria-hidden="true">${ticks}<span class="mini-span" style="--start:${fraction(start)};--len:${minutes / (CLOSE_MIN - OPEN_MIN)}"></span></span>`;
}

function announce(text) {
  const el = document.getElementById("announcer");
  el.textContent = "";
  requestAnimationFrame(() => { el.textContent = text; });
}

function choiceRow({ checked, attrs, lead, name, sub, side = "" }) {
  return `<li><button class="choice" type="button" role="radio" aria-checked="${checked}" ${attrs}>
    ${lead}<span><span class="choice-name">${name}</span><span class="choice-sub">${sub}</span></span>
    ${side || `<span class="radio-dot"><i class="ph ph-check" aria-hidden="true"></i></span>`}</button></li>`;
}

/* ---------- Views: steps 1–3 ---------- */
function viewDog() {
  return `<h1 class="title" tabindex="-1">Who’s coming in?</h1>
    <p class="lede">Pick the dog you’re booking for.</p>
    <ul class="choices" role="radiogroup" aria-label="Dog">
      ${DOGS.map((d) => choiceRow({ checked: d.id === state.dogId, attrs: `data-dog="${d.id}"`, lead: `<span class="monogram">${d.name[0]}</span>`, name: d.name, sub: `${d.breed} · ${d.size} · ${d.coat}` })).join("")}
    </ul>`;
}
function viewService() {
  const size = dog().size;
  return `<h1 class="title" tabindex="-1">What does ${escapeHtml(dog().name)} need?</h1>
    <p class="lede">Times are for a ${size} dog. We’ll confirm the price when you pick up.</p>
    <ul class="choices" role="radiogroup" aria-label="Service">
      ${SERVICES.map((s) => choiceRow({
        checked: s.id === state.serviceId, attrs: `data-service="${s.id}"`, lead: `<i class="ph ph-scissors" aria-hidden="true"></i>`,
        name: s.name, sub: s.what,
        side: `<span class="choice-side"><strong>${s.minutes[size] >= 60 ? "about " : ""}${durationText(s.minutes[size])}</strong>${s.id === "nails" ? "" : "from "}${fmtMoney.format(s.price[size])}</span>`,
      })).join("")}
    </ul>`;
}
function viewGroomer() {
  return `<h1 class="title" tabindex="-1">Who should groom ${escapeHtml(dog().name)}?</h1>
    <p class="lede">Brindle has two groomers. Either gives you the most times.</p>
    <ul class="choices" role="radiogroup" aria-label="Groomer">
      ${GROOMERS.map((g) => choiceRow({
        checked: g.id === state.groomerId, attrs: `data-groomer-choice="${g.id}"`,
        lead: g.id === "either" ? `<i class="ph ph-users" aria-hidden="true"></i>` : `<span class="monogram">${g.name[0]}</span>`,
        name: g.name, sub: g.note,
      })).join("")}
    </ul>`;
}

/* ---------- View: time (key screen) ---------- */
function viewTime() {
  const d = dog(), s = service();
  return `<div class="time-layout">
    <div class="stage-col">
      <h1 class="title" tabindex="-1">When can ${escapeHtml(d.name)} come in?</h1>
      <ul class="picks" aria-label="Your choices so far">
        <li><button class="pick" type="button" data-go="dog"><span class="monogram monogram-sm">${d.name[0]}</span>${escapeHtml(d.name)}<span class="sr-only">, change dog</span></button></li>
        <li><button class="pick" type="button" data-go="service">${s.name} <span class="muted">· about ${durationText(stayMinutes())}</span><span class="sr-only">, change service</span></button></li>
        <li><button class="pick" type="button" data-go="groomer" id="pick-groomer">${groomer().name}<span class="sr-only">, change groomer</span></button></li>
      </ul>
      <section class="stage" aria-label="Your appointment" id="stage"></section>
    </div>
    <div class="pick-col">
      <div class="section-label"><h2 class="caps" id="days-label">Day</h2><span class="caps" aria-hidden="true">Free times · next 2 weeks</span></div>
      <div class="days" role="radiogroup" aria-labelledby="days-label" id="days"></div>
      <div class="switch" role="radiogroup" aria-label="Groomer" id="groomer-switch"></div>
      <div class="times-region" id="times" aria-live="polite"></div>
      <div class="actionbar"><div class="actionbar-inner">
        <p class="actionbar-hint" id="continue-hint"></p>
        <button class="btn btn-primary btn-block" type="button" id="continue">Continue</button>
      </div></div>
    </div>
  </div>`;
}

function stageHeadHtml() {
  const iso = state.day;
  const t = state.time;
  const minutes = stayMinutes();
  const name = escapeHtml(dog().name);
  const dayLine = iso ? fmtDayLong.format(dateFromIso(iso)) : "Choose a day";
  const readout = t
    ? `<p class="readout readout-swap"><span>${timeHtml(iso, t.start)}</span><i class="ph ph-arrow-right" aria-hidden="true"></i><span>${timeHtml(iso, t.start + minutes)}</span></p>
       <p class="readout-labels"><span>Drop off</span><span>Pick up about <b>${timeText(iso, t.start + minutes)}</b></span><span>with <b>${groomerNames(t.groomers)}</b></span></p>`
    : `<p class="readout readout-prompt readout-swap">Pick a drop‑off time</p>
       <p class="readout-labels"><span>${name} stays about ${durationText(minutes)}. You’ll see when to collect ${name}.</span></p>`;
  return `<div class="stage-head"><p class="stage-day">${dayLine}</p>${readout}</div>`;
}

function renderStage() {
  const stage = document.getElementById("stage");
  if (!stage) return;
  const iso = state.day;
  stage.innerHTML = `${stageHeadHtml()}${combHtml({ span: true, muted: !iso || isClosed(iso) })}
    <p class="stage-note"><i class="ph ph-map-pin" aria-hidden="true"></i>${SALON.name}, ${SALON.address} · open ${timeText("2026-11-17", OPEN_MIN)}–${timeText("2026-11-17", CLOSE_MIN)}, Tue–Sat</p>`;
  placeCombSpan({ instant: true });
}

/** Swap only the readout; the comb stays mounted so its span glides to the new stay. */
function renderStageHead() {
  const head = document.querySelector("#stage .stage-head");
  if (!head) return renderStage();
  head.outerHTML = stageHeadHtml();
}

/** The fawn span marks the dog's stay on the comb (transform only: translateX + scaleX). */
function placeCombSpan({ instant = false } = {}) {
  const span = document.getElementById("comb-span");
  if (!span) return;
  if (!state.time) { span.removeAttribute("data-on"); return; }
  const wasOn = span.hasAttribute("data-on");
  if (instant || !wasOn) span.setAttribute("data-instant", "");
  span.style.setProperty("--start", fraction(state.time.start));
  span.style.setProperty("--len", stayMinutes() / (CLOSE_MIN - OPEN_MIN));
  span.setAttribute("data-on", "");
  span.getBoundingClientRect();
  span.removeAttribute("data-instant");
}

function renderDays() {
  const el = document.getElementById("days");
  if (!el) return;
  el.innerHTML = windowDays().map((iso) => {
    const date = dateFromIso(iso);
    const closed = isClosed(iso);
    const loaded = state.loaded.get(iso);
    const count = closed ? 0 : timesFor(iso, stayMinutes(), state.groomerId, loaded?.groomers).length;
    const label = closed ? "Closed" : loaded?.status === "error" ? "Retry" : count ? `${count} free` : "Full";
    const shortLabel = count && !closed && loaded?.status !== "error" ? `${count}<span class="day-free-word"> free</span>` : label;
    const checked = iso === state.day;
    return `<button class="day" type="button" role="radio" aria-checked="${checked}" tabindex="${checked ? 0 : -1}" data-day="${iso}"
      ${closed ? "data-closed" : ""} ${!closed && !count ? "data-full" : ""} aria-label="${fmtDayLong.format(date)}, ${label}">
      <span class="day-wd" aria-hidden="true">${fmtWeekdayShort.format(date)}</span>
      <span class="day-num" aria-hidden="true">${date.getDate()}</span>
      <span class="day-free" aria-hidden="true">${shortLabel}</span></button>`;
  }).join("");
  const selected = el.querySelector('[aria-checked="true"]') || el.querySelector(".day");
  selected.tabIndex = 0;
}

function renderGroomerSwitch() {
  const el = document.getElementById("groomer-switch");
  if (!el) return;
  const i = GROOMERS.findIndex((g) => g.id === state.groomerId);
  el.style.setProperty("--i", i);
  el.innerHTML = `<span class="switch-thumb" aria-hidden="true"></span>` + GROOMERS.map((g) =>
    `<button class="switch-opt" type="button" role="radio" aria-checked="${g.id === state.groomerId}" tabindex="${g.id === state.groomerId ? 0 : -1}" data-groomer="${g.id}">${g.id === "either" ? "Either" : g.name}</button>`
  ).join("");
}

function skeletonHtml() {
  const row = `<div class="sk-row"><span class="sk sk-time"></span><span class="sk sk-meta"></span><span class="sk sk-comb"></span></div>`;
  return `<div class="skeleton" aria-hidden="true">${row.repeat(5)}</div><p class="sr-only">Loading times…</p>`;
}

function slotHtml(iso, t, minutes) {
  const checked = state.time && state.time.start === t.start;
  const back = timeText(iso, t.start + minutes);
  const who = groomerNames(t.groomers);
  return `<button class="slot" type="button" role="radio" aria-checked="${checked}" tabindex="-1" data-start="${t.start}"
      aria-label="${timeText(iso, t.start)} drop-off, pick up about ${back}, with ${who}">
    <span class="slot-time" aria-hidden="true">${timeHtml(iso, t.start)}</span>
    <span class="slot-meta" aria-hidden="true"><span class="nowrap">back about ${back}</span><span>with <b>${who}</b></span></span>
    <span class="slot-right" aria-hidden="true">${miniComb(t.start, minutes)}<span class="radio-dot"><i class="ph ph-check"></i></span></span>
  </button>`;
}

function takenSlotHtml(iso, start) {
  return `<button class="slot" type="button" role="radio" aria-checked="false" aria-disabled="true" tabindex="-1" data-taken
      aria-label="${timeText(iso, start)}, just booked by someone else">
    <span class="slot-time" aria-hidden="true">${timeHtml(iso, start)}</span>
    <span class="slot-meta" aria-hidden="true">Just booked by someone else</span><span></span></button>`;
}

function timesListHtml(iso, times, minutes) {
  const conflictHere = state.conflict && state.conflict.iso === iso ? state.conflict.start : null;
  const rows = [...times.map((t) => ({ start: t.start, html: slotHtml(iso, t, minutes) }))];
  if (conflictHere !== null) rows.push({ start: conflictHere, html: takenSlotHtml(iso, conflictHere) });
  rows.sort((a, b) => a.start - b.start);
  const groups = [["Morning", rows.filter((r) => r.start < 720)], ["Afternoon", rows.filter((r) => r.start >= 720)]].filter(([, r]) => r.length);
  return `<div class="slot-groups" role="radiogroup" aria-label="Drop-off time" id="slot-groups">
    <span class="slot-indicator" id="slot-indicator" aria-hidden="true"></span>
    ${groups.map(([label, r]) => `<div class="slot-group"><h3 class="caps">${label}</h3><div class="slots">${r.map((x) => x.html).join("")}</div></div>`).join("")}
  </div>`;
}

function nextFreeHtml(afterIso) {
  const next = windowDays().find((iso) => iso > afterIso && timesFor(iso, stayMinutes(), state.groomerId).length);
  if (!next) return `<p>No times in the next two weeks with ${groomer().name}. Call the salon and we’ll fit ${escapeHtml(dog().name)} in.</p>`;
  const first = timesFor(next, stayMinutes(), state.groomerId)[0];
  return `<div class="state-actions"><button class="btn btn-primary" type="button" data-jump="${next}" data-jump-time="${first.start}">
    Next free: ${fmtDayShort.format(dateFromIso(next))}, ${timeText(next, first.start)}</button></div>`;
}

function emptyStateHtml(iso) {
  const date = dateFromIso(iso);
  if (isClosed(iso)) {
    return `<div class="state-box">${combHtml({ muted: true })}
      <h3>Brindle is closed on ${fmtWeekdayLong.format(date)}s</h3>
      <p>The salon opens Tuesday to Saturday, ${timeText(iso, OPEN_MIN)}–${timeText(iso, CLOSE_MIN)}.</p>${nextFreeHtml(iso)}</div>`;
  }
  const otherHas = state.groomerId !== "either" && timesFor(iso, stayMinutes(), "either").length;
  if (otherHas) {
    const other = GROOMERS.find((g) => g.id !== "either" && g.id !== state.groomerId);
    const n = timesFor(iso, stayMinutes(), other.id).length;
    return `<div class="state-box">${combHtml({ muted: true })}
      <h3>${groomer().name} is fully booked on ${fmtWeekdayLong.format(date)}</h3>
      <p>${other.name} has ${n} ${n === 1 ? "time" : "times"} that day for a ${service().name.toLowerCase()}.</p>
      <div class="state-actions"><button class="btn btn-primary" type="button" data-groomer="${other.id}">Show ${other.name}’s times</button>
      <button class="btn" type="button" data-groomer="either">Either groomer</button></div></div>`;
  }
  return `<div class="state-box">${combHtml({ muted: true })}
    <h3>${fmtWeekdayLong.format(date)} is fully booked</h3>
    <p>${state.groomerId === "either" ? "Both groomers are" : `${groomer().name} is`} booked all day. Cancellations do come up, so check back the day before.</p>${nextFreeHtml(iso)}</div>`;
}

function errorStateHtml(iso) {
  return `<div class="state-box" role="alert">
    <span class="state-icon"><i class="ph ph-warning-circle" aria-hidden="true"></i>Couldn’t load ${fmtWeekdayLong.format(dateFromIso(iso))}’s times</span>
    <p>The salon’s diary didn’t answer. Your choices so far are saved.</p>
    <div class="state-actions"><button class="btn btn-primary" type="button" data-retry="${iso}"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Try again</button></div></div>`;
}

function partialNoticeHtml(iso) {
  return `<div class="notice notice-warn" role="status"><i class="ph ph-warning" aria-hidden="true"></i>
    <div><b>Priya’s diary didn’t load</b>, so only Sam’s times are showing.<br>
    <button class="btn" type="button" data-retry="${iso}"><i class="ph ph-arrow-clockwise" aria-hidden="true"></i>Load Priya’s times</button></div></div>`;
}

function conflictNoticeHtml() {
  const c = state.conflict;
  return `<div class="notice notice-error" role="alert"><i class="ph ph-warning-circle" aria-hidden="true"></i>
    <div><b>${timeText(c.iso, c.start)} on ${fmtWeekdayLong.format(dateFromIso(c.iso))} was booked a moment ago.</b>
    Nothing was booked for ${escapeHtml(dog().name)}. Pick another time below; your other choices are kept.</div></div>`;
}

let lastDayForDirection = null;
async function renderTimes({ dir = 0 } = {}) {
  const region = document.getElementById("times");
  if (!region) return;
  const iso = state.day;
  const wrap = (html) => `<div class="times-swap" ${dir ? `data-dir style="--dir:${dir}"` : ""}>${html}</div>`;
  if (!iso) { region.innerHTML = ""; return; }
  if (isClosed(iso)) { region.innerHTML = wrap(emptyStateHtml(iso)); updateContinue(); return; }

  const cached = state.loaded.get(iso);
  if (!cached || cached.status === "retrying") {
    region.setAttribute("aria-busy", "true");
    region.innerHTML = wrap(skeletonHtml());
    const result = await loadDiary(iso);
    state.loaded.set(iso, result);
    if (state.day !== iso || currentRoute !== "time") return;
    region.removeAttribute("aria-busy");
    renderDays();
    return renderTimes({ dir: 0 });
  }
  if (cached.status === "error") { region.innerHTML = wrap(errorStateHtml(iso)); updateContinue(); return; }

  const minutes = stayMinutes();
  const times = timesFor(iso, minutes, state.groomerId, cached.groomers);
  const partial = cached.status === "partial" && state.groomerId !== "sam" ? partialNoticeHtml(iso) : "";
  const conflict = state.conflict ? conflictNoticeHtml() : "";
  if (!times.length && !(state.conflict && state.conflict.iso === iso)) {
    region.innerHTML = wrap(conflict + partial + emptyStateHtml(iso));
  } else {
    region.innerHTML = wrap(conflict + partial + timesListHtml(iso, times, minutes));
    setRovingTabStop();
    placeIndicator({ instant: true });
    applyPendingTime(times);
  }
  announce(`${fmtDayLong.format(dateFromIso(iso))}: ${times.length ? `${times.length} drop-off ${times.length === 1 ? "time" : "times"}` : "no times"}`);
  updateContinue();
}

function applyPendingTime(times) {
  const start = state.pendingStart;
  state.pendingStart = null;
  if (start != null && times.some((t) => t.start === start)) chooseTime(start);
}

function setRovingTabStop() {
  const slots = [...document.querySelectorAll(".slot:not([aria-disabled='true'])")];
  if (!slots.length) return;
  const selected = slots.find((s) => s.getAttribute("aria-checked") === "true") || slots[0];
  selected.tabIndex = 0;
}

function placeIndicator({ instant = false } = {}) {
  const indicator = document.getElementById("slot-indicator");
  const slot = document.querySelector('.slot[aria-checked="true"]');
  if (!indicator) return;
  if (!slot) { indicator.removeAttribute("data-on"); return; }
  const wasOn = indicator.hasAttribute("data-on");
  const s = slot.getBoundingClientRect(), p = indicator.parentElement.getBoundingClientRect();
  if (instant || !wasOn) indicator.setAttribute("data-instant", "");
  indicator.style.cssText = `--x:${s.left - p.left}px;--y:${s.top - p.top}px;--w:${s.width}px;--h:${s.height}px`;
  indicator.setAttribute("data-on", "");
  indicator.getBoundingClientRect();
  indicator.removeAttribute("data-instant");
}

function updateContinue() {
  const button = document.getElementById("continue");
  const hint = document.getElementById("continue-hint");
  if (!button) return;
  const t = state.time;
  button.textContent = t ? `Continue with ${fmtWeekdayShort.format(dateFromIso(state.day))} ${timeText(state.day, t.start)}` : "Continue";
  hint.removeAttribute("data-alert");
  hint.textContent = t ? `${escapeHtml(dog().name)} back about ${timeText(state.day, t.start + stayMinutes())}` : "Pick a drop-off time to continue";
}

/* ---------- Time step: actions ---------- */
function chooseDay(iso, { focus = false } = {}) {
  if (iso === state.day) return;
  const order = windowDays();
  const dir = lastDayForDirection && order.indexOf(iso) < order.indexOf(lastDayForDirection) ? -1 : 1;
  state.day = iso;
  lastDayForDirection = iso;
  state.time = null;
  syncUrl();
  renderDays();
  renderStage();
  renderTimes({ dir: prefersReducedMotion() ? 0 : dir });
  const btn = document.querySelector(`.day[data-day="${iso}"]`);
  if (focus) btn?.focus();
}

function chooseTime(start, { focus = false } = {}) {
  const iso = state.day;
  const cached = state.loaded.get(iso);
  const t = timesFor(iso, stayMinutes(), state.groomerId, cached?.groomers).find((x) => x.start === start);
  if (!t) return;
  state.time = t;
  syncUrl();
  document.querySelectorAll(".slot").forEach((s) => {
    const on = Number(s.dataset.start) === start && !s.hasAttribute("data-taken");
    s.setAttribute("aria-checked", String(on));
    s.tabIndex = on ? 0 : -1;
  });
  placeIndicator();
  renderStageHead();
  placeCombSpan();
  updateContinue();
  if (focus) document.querySelector(`.slot[data-start="${start}"]:not([data-taken])`)?.focus();
}

function chooseGroomer(id) {
  if (id === state.groomerId) return;
  state.groomerId = id;
  state.time = null;
  syncUrl();
  const sw = document.getElementById("groomer-switch");
  if (sw) {
    sw.style.setProperty("--i", GROOMERS.findIndex((g) => g.id === id));
    sw.querySelectorAll(".switch-opt").forEach((b) => { const on = b.dataset.groomer === id; b.setAttribute("aria-checked", String(on)); b.tabIndex = on ? 0 : -1; });
  }
  const pick = document.getElementById("pick-groomer");
  if (pick) pick.innerHTML = `${groomer().name}<span class="sr-only">, change groomer</span>`;
  renderDays();
  renderStage();
  renderTimes();
}

function retryDay(iso) {
  state.loaded.set(iso, { status: "retrying" });
  renderTimes();
}

function continueFromTime() {
  if (state.time) { state.conflict = null; go("review"); return; }
  const hint = document.getElementById("continue-hint");
  hint.textContent = "Pick a drop-off time first";
  hint.setAttribute("data-alert", "");
  const first = document.querySelector(".slot:not([aria-disabled='true'])") || document.querySelector(".day[aria-checked='true']");
  first?.focus();
  first?.scrollIntoView({ block: "center", behavior: prefersReducedMotion() ? "auto" : "smooth" });
}

function syncUrl() {
  const p = new URLSearchParams(location.search);
  if (state.day) p.set("day", state.day); else p.delete("day");
  if (state.time) p.set("time", String(state.time.start)); else p.delete("time");
  p.set("groomer", state.groomerId);
  history.replaceState(null, "", `${location.pathname}?${p}${location.hash}`);
}

/* ---------- View: review ---------- */
function viewReview() {
  if (!state.time) return viewTimeMissing();
  const iso = state.day, t = state.time, d = dog(), s = service();
  const backAt = t.start + stayMinutes();
  return `<h1 class="title" tabindex="-1">Check ${escapeHtml(d.name)}’s appointment</h1>
    <p class="lede">Nothing is booked until you tap the button below.</p>
    <dl class="summary">
      <div class="summary-row"><dt>${fmtDayLong.format(dateFromIso(iso))}</dt><dd class="summary-big">${timeHtml(iso, t.start)} – ${timeHtml(iso, backAt)}</dd>
        <button class="btn btn-quiet" type="button" data-go="time">Change<span class="sr-only"> time</span></button></div>
      <div class="summary-row"><dt>Dog</dt><dd>${escapeHtml(d.name)}, ${d.breed.toLowerCase()}</dd><button class="btn btn-quiet" type="button" data-go="dog">Change<span class="sr-only"> dog</span></button></div>
      <div class="summary-row"><dt>Service</dt><dd>${s.name}, about ${durationText(stayMinutes())}</dd><button class="btn btn-quiet" type="button" data-go="service">Change<span class="sr-only"> service</span></button></div>
      <div class="summary-row"><dt>Groomer</dt><dd>${t.groomers.length > 1 ? "Sam or Priya, whoever’s free" : groomerNames(t.groomers)}</dd><button class="btn btn-quiet" type="button" data-go="groomer">Change<span class="sr-only"> groomer</span></button></div>
      <div class="summary-row"><dt>Price</dt><dd>${s.id === "nails" ? "" : "from "}${fmtMoney.format(s.price[d.size])}, pay at pick-up</dd></div>
    </dl>
    <div class="field">
      <label for="note">Anything ${escapeHtml(d.name)}’s groomer should know? <span class="hint">(optional)</span></label>
      <span class="hint" id="note-hint">Coat, health, how ${escapeHtml(d.name)} likes to be handled.</span>
      <textarea id="note" aria-describedby="note-hint" autocomplete="off">${escapeHtml(state.note)}</textarea>
    </div>
    <p class="inline-error" id="book-error" role="alert" hidden></p>
    <div class="actionbar"><div class="actionbar-inner">
      <p class="actionbar-hint">Free to cancel up to 24 hours before.</p>
      <button class="btn btn-primary btn-block submit" type="button" id="book" data-state="idle">
        <span class="submit-label" data-for="idle">Book ${fmtWeekdayLong.format(dateFromIso(iso))} ${timeText(iso, t.start)}</span>
        <span class="submit-label" data-for="pending" aria-hidden="true"><span class="spinner"></span>Booking…</span>
        <span class="submit-label" data-for="done" aria-hidden="true"><i class="ph ph-check" aria-hidden="true"></i>Booked</span>
      </button></div></div>`;
}
function viewTimeMissing() {
  return `<h1 class="title" tabindex="-1">Pick a time first</h1>
    <p class="lede">Choose when ${escapeHtml(dog().name)} can come in, then check the details here.</p>
    <div class="state-actions spaced"><button class="btn btn-primary" type="button" data-go="time">Choose a time</button></div>`;
}

async function book() {
  const button = document.getElementById("book");
  const error = document.getElementById("book-error");
  if (button.dataset.state !== "idle") return;
  state.note = document.getElementById("note").value.trim();
  error.hidden = true;
  button.dataset.state = "pending";
  button.setAttribute("aria-busy", "true");
  await new Promise((r) => setTimeout(r, BOOKING_LATENCY_MS));
  const { start, groomers } = state.time;
  const iso = state.day;
  const wantsConflict = FORCED === "conflict" || (iso === "2026-11-17" && start === 900);
  if (FORCED === "book-error" && !state.bookFailedOnce) {
    state.bookFailedOnce = true;
    button.dataset.state = "idle"; button.removeAttribute("aria-busy");
    error.innerHTML = `<i class="ph ph-wifi-slash" aria-hidden="true"></i><span>Not booked yet: we couldn’t reach the salon. Check your signal and tap the button again. Your choices are kept.</span>`;
    error.hidden = false;
    return;
  }
  if (wantsConflict) {
    groomers.forEach((g) => state.taken.add(`${iso}|${start}|${g}`));
    state.conflict = { iso, start };
    state.time = null;
    go("time");
    return;
  }
  button.dataset.state = "done";
  state.booking = { iso, start, minutes: stayMinutes(), groomers, dogName: dog().name, serviceName: service().name, note: state.note, justBooked: true };
  groomers.forEach((g) => state.taken.add(`${iso}|${start}|${g}`));
  state.time = null;
  state.note = "";
  setTimeout(() => go("booked"), ms("medium"));
}

/* ---------- View: booked (signature moment) ---------- */
function viewBooked() {
  const b = state.booking;
  if (!b) return viewHome();
  const settled = !b.justBooked || prefersReducedMotion();
  b.justBooked = false;
  return `<section class="booked" role="status" ${settled ? "data-settled" : ""}>
    <h1 class="title" tabindex="-1">${escapeHtml(b.dogName)}’s booked in</h1>
    ${combHtml({ stay: { start: b.start, minutes: b.minutes }, teethClass: "signature-teeth" })}
    <div class="signature-fact">
      <p class="appt-when">${fmtDayLong.format(dateFromIso(b.iso))}</p>
      <p class="appt-meta">Drop off ${timeText(b.iso, b.start)}, pick up about ${timeText(b.iso, b.start + b.minutes)} · ${b.serviceName} with ${b.groomers.length > 1 ? "Sam or Priya" : groomerNames(b.groomers)}</p>
      <p class="appt-meta">${SALON.name}, ${SALON.address}. We’ll text you when ${escapeHtml(b.dogName)} is ready.</p>
    </div>
    <div class="booked-actions">
      <button class="btn" type="button" id="add-calendar"><i class="ph ph-calendar-plus" aria-hidden="true"></i>Add to calendar</button>
      <button class="btn btn-primary" type="button" data-go="home">Done</button>
    </div></section>`;
}

function downloadCalendarFile() {
  const b = state.booking;
  const stamp = (d) => `${isoDay(d).replace(/-/g, "")}T${String(d.getHours()).padStart(2, "0")}${String(d.getMinutes()).padStart(2, "0")}00`;
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Brindle//Booking//EN", "BEGIN:VEVENT",
    `UID:${b.iso}-${b.start}@brindle`, `DTSTAMP:${stamp(new Date())}`,
    `DTSTART:${stamp(atMinutes(b.iso, b.start))}`, `DTEND:${stamp(atMinutes(b.iso, b.start + b.minutes))}`,
    `SUMMARY:${b.dogName}: ${b.serviceName} at Brindle`, `LOCATION:${SALON.name}\\, ${SALON.address}`,
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: `brindle-${b.iso}.ics` });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), ms("hero"));
  announce("Calendar file downloaded");
}

/* ---------- View: home ---------- */
function viewHome() {
  const b = state.booking;
  const draft = state.time ? `<p class="lede">You were booking ${escapeHtml(dog().name)}’s ${service().name.toLowerCase()} for ${fmtDayShort.format(dateFromIso(state.day))}, ${timeText(state.day, state.time.start)}.</p>` : "";
  const appt = b ? `<section class="appt" aria-labelledby="next-label">
      <h2 class="caps" id="next-label">Next groom</h2>
      <p class="appt-when">${fmtDayShort.format(dateFromIso(b.iso))}, ${timeText(b.iso, b.start)}</p>
      <p class="appt-meta">${escapeHtml(b.dogName)} · ${b.serviceName} · back about ${timeText(b.iso, b.start + b.minutes)}</p>
      <div class="state-actions"><button class="btn" type="button" id="reschedule">Change time</button><button class="btn btn-danger" type="button" id="cancel-booking">Cancel booking</button></div>
    </section>` : `<section class="appt"><h2 class="caps">Next groom</h2><p class="appt-meta">Nothing booked yet.</p></section>`;
  return `<div class="home">
    <div><h1 class="title" tabindex="-1">Hi Maya</h1>${draft}</div>
    ${appt}
    <div><button class="btn btn-primary" type="button" data-go="${state.time ? "review" : "time"}">${state.time ? "Finish booking" : "Book a groom"}</button></div>
  </div>`;
}

function cancelBooking() {
  const removed = state.booking;
  state.booking = null;
  removed.groomers.forEach((g) => state.taken.delete(`${removed.iso}|${removed.start}|${g}`));
  render();
  showToast(`${removed.dogName}’s groom on ${fmtWeekdayLong.format(dateFromIso(removed.iso))} is cancelled`, "Undo", () => { state.booking = { ...removed, justBooked: false }; removed.groomers.forEach((g) => state.taken.add(`${removed.iso}|${removed.start}|${g}`)); render(); announce("Booking restored"); });
}

function showToast(text, actionLabel, onAction) {
  const region = document.getElementById("toasts");
  region.innerHTML = "";
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = `<span>${escapeHtml(text)}</span><button class="btn" type="button">${actionLabel}</button>`;
  const dismiss = () => { toast.setAttribute("data-leaving", ""); setTimeout(() => toast.remove(), ms("short")); };
  toast.querySelector("button").addEventListener("click", () => { onAction(); dismiss(); });
  region.append(toast);
  setTimeout(dismiss, UNDO_WINDOW_MS);
}

/* ---------- Render ---------- */
const VIEWS = { home: viewHome, dog: viewDog, service: viewService, groomer: viewGroomer, time: viewTime, review: viewReview, booked: viewBooked };

function render() {
  const route = routeFromHash();
  const dir = directionTo(route);
  const view = document.getElementById("view");
  renderHeader(route);
  view.innerHTML = VIEWS[route]();
  view.removeAttribute("data-enter");
  if (dir && route !== currentRoute) { view.getBoundingClientRect(); view.setAttribute("data-enter", dir); }
  const isFirstRender = currentRoute === null;
  currentRoute = route;
  if (route === "time") mountTime();
  if (!isFirstRender) { view.querySelector("h1")?.focus({ preventScroll: true }); window.scrollTo(0, 0); }
}

function mountTime() {
  if (!state.day) state.day = firstDayWithTimes() || windowDays()[0];
  lastDayForDirection = state.day;
  renderDays();
  renderGroomerSwitch();
  renderStage();
  renderTimes();
}

/* ---------- Events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("button, a");
  if (!el) return;
  const ds = el.dataset;
  if (ds.go) return go(ds.go);
  if (ds.dog) { state.dogId = ds.dog; state.time = null; return go("service"); }
  if (ds.service) { state.serviceId = ds.service; state.time = null; return go("groomer"); }
  if (ds.groomerChoice) { state.groomerId = ds.groomerChoice; state.time = null; return go("time"); }
  if (ds.day) return chooseDay(ds.day);
  if (ds.groomer) return chooseGroomer(ds.groomer);
  if (ds.retry) return retryDay(ds.retry);
  if (ds.jump) { state.pendingStart = Number(ds.jumpTime); chooseDay(ds.jump); return; }
  if (ds.start !== undefined && el.classList.contains("slot")) { if (el.getAttribute("aria-disabled") !== "true") chooseTime(Number(ds.start)); return; }
  if (el.id === "continue") return continueFromTime();
  if (el.id === "book") return book();
  if (el.id === "add-calendar") return downloadCalendarFile();
  if (el.id === "cancel-booking") return cancelBooking();
  if (el.id === "reschedule") { const b = state.booking; state.day = b.iso; state.time = null; return go("time"); }
});

/* Arrow keys move the choice inside each radio group (one tab stop per group). */
document.addEventListener("keydown", (e) => {
  const keys = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
  if (!(e.key in keys) && e.key !== "Home" && e.key !== "End") return;
  const item = e.target.closest('[role="radio"]');
  const group = item?.closest('[role="radiogroup"]');
  if (!group) return;
  const items = [...group.querySelectorAll('[role="radio"]:not([aria-disabled="true"])')];
  let i = items.indexOf(item);
  i = e.key === "Home" ? 0 : e.key === "End" ? items.length - 1 : (i + keys[e.key] + items.length) % items.length;
  const next = items[i];
  e.preventDefault();
  if (next.dataset.day) chooseDay(next.dataset.day, { focus: true });
  else if (next.classList.contains("slot")) chooseTime(Number(next.dataset.start), { focus: true });
  else if (next.dataset.groomer) { chooseGroomer(next.dataset.groomer); document.querySelector(`.switch-opt[data-groomer="${next.dataset.groomer}"]`)?.focus(); }
  else next.focus();
});

addEventListener("hashchange", render);
addEventListener("resize", () => placeIndicator({ instant: true }));
addEventListener("message", (e) => { if (e.data?.type === "fgu:theme") document.documentElement.dataset.theme = e.data.theme; });

/* Restore view state from the URL (ia-nav.url-as-state). */
(function restoreFromUrl() {
  const day = params.get("day"), time = params.get("time"), g = params.get("groomer");
  if (g && GROOMERS.some((x) => x.id === g) && !FORCED) state.groomerId = g;
  if (day && windowDays().includes(day) && !FORCED) state.day = day;
  if (FORCED === "conflict") { state.day = "2026-11-17"; state.conflict = { iso: "2026-11-17", start: 900 }; ["sam"].forEach((x) => state.taken.add(`2026-11-17|900|${x}`)); }
  if (state.day && time && !FORCED) {
    const t = timesFor(state.day, stayMinutes(), state.groomerId).find((x) => x.start === Number(time));
    if (t) state.time = t;
  }
})();

render();
</script>
<script>
/* Direction preview: auto-play the one real transition once (skipped under reduced motion or ?still). */
(function autoPlayOnce() {
  if (new URLSearchParams(location.search).has("still") || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const AUTO_START_MS = 600, AUTO_HOLD_MS = 1200;
  const waitForSlots = () => new Promise((resolve) => { const t = setInterval(() => { if (document.querySelector(".slot")) { clearInterval(t); resolve(); } }, 50); });
  setTimeout(async () => {
    document.querySelector('.day[data-day="2026-11-19"]')?.click();
    await waitForSlots();
    document.querySelector('.slot[data-start="570"]')?.click();
    setTimeout(() => document.querySelector('.slot[data-start="480"]')?.click(), ms("standard") + AUTO_HOLD_MS);
  }, AUTO_START_MS);
})();
</script>
