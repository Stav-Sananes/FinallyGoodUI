/* ---------- base ---------- */
/* metric-matched local fallbacks so the web-font swap does not move text */
@font-face { font-family: "Source Sans fallback"; src: local("Arial"), local("Helvetica"); size-adjust: 89%; ascent-override: 110%; descent-override: 31%; line-gap-override: 0%; }
@font-face { font-family: "Newsreader fallback"; src: local("Georgia"), local("Times New Roman"); size-adjust: 96%; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; block-size: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: var(--text-base--line-height);
  color: var(--color-foreground);
  background: var(--color-background);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
p { text-wrap: pretty; }
.ph { font-size: var(--icon-md); line-height: 1; inline-size: var(--icon-md); block-size: var(--icon-md); display: inline-grid; place-items: center; flex: none; }
.ph.sm { font-size: var(--icon-sm); inline-size: var(--icon-sm); block-size: var(--icon-sm); }
[hidden] { display: none !important; }
.visually-hidden { position: absolute !important; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.skip-link { position: absolute; inset-inline-start: var(--space-2); inset-block-start: var(--space-2); z-index: 100; padding: var(--space-2) var(--space-3); background: var(--color-primary); color: var(--color-primary-foreground); border-radius: var(--radius-md); transform: translateY(-200%); }
.skip-link:focus-visible { transform: none; }
:focus-visible { outline: 2px solid var(--color-ring); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* keycap: the motif */
kbd {
  display: inline-grid; place-items: center;
  min-inline-size: 18px; block-size: 18px; padding-inline: var(--space-1);
  font: 600 var(--text-xs)/1 var(--font-sans);
  color: var(--color-muted-foreground);
  background: var(--color-card);
  border-radius: var(--radius-sm);
  box-shadow: inset 0 0 0 1px var(--color-border), inset 0 -1px 0 var(--color-input);
  white-space: nowrap;
}
.kbd-row { display: inline-flex; gap: var(--space-1); align-items: center; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  min-block-size: var(--control-h); padding: 0 var(--space-3);
  border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--color-foreground);
  font-size: var(--text-base); font-weight: 600; white-space: nowrap;
  transition: transform var(--duration-instant) var(--ease-snappy), background-color var(--duration-micro) var(--ease-move);
}
.btn:active { transform: scale(0.97); }
.btn-ink { background: var(--color-primary); color: var(--color-primary-foreground); box-shadow: var(--shadow-sm); }
.btn-ink kbd, .toast .btn kbd { background: transparent; color: inherit; box-shadow: inset 0 0 0 1px currentColor, inset 0 -1px 0 currentColor; opacity: 0.75; }
.btn-line { box-shadow: inset 0 0 0 1px var(--color-input); background: var(--color-card); }
.btn-ghost { color: var(--color-muted-foreground); font-weight: 400; }
.btn-danger { color: var(--color-destructive); }
.icon-btn { inline-size: var(--control-h); padding: 0; justify-content: center; color: var(--color-muted-foreground); }
@media (hover: hover) and (pointer: fine) {
  .btn-ghost:hover, .icon-btn:hover, .btn-line:hover { background: var(--color-accent); color: var(--color-foreground); }
  .btn-ink:hover { box-shadow: var(--shadow-md); }
}

/* ---------- shell ---------- */
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  block-size: 100dvh;
}
.sidebar {
  background: var(--color-sidebar);
  border-inline-end: 1px solid var(--color-border);
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: var(--space-3) var(--space-2);
  min-block-size: 0; overflow: auto;
}
.team { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-1) var(--space-2); }
.team-mark { inline-size: 24px; block-size: 24px; border-radius: var(--radius-sm); background: var(--color-primary); color: var(--color-primary-foreground); display: grid; place-items: center; font: 600 var(--text-xs)/1 var(--font-mono); }
.team-name { font-weight: 600; }
.team-sub { color: var(--color-muted-foreground); font-size: var(--text-sm); }
.search-btn { justify-content: flex-start; inline-size: 100%; font-weight: 400; color: var(--color-muted-foreground); }
.search-btn .kbd-row { margin-inline-start: auto; }
.nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.nav-item {
  display: flex; align-items: center; gap: var(--space-2);
  inline-size: 100%; min-block-size: 30px; padding: 0 var(--space-2);
  border: 0; border-radius: var(--radius-md); background: transparent;
  color: var(--color-foreground); text-align: start; font-size: var(--text-base);
}
.nav-item .ph { color: var(--color-muted-foreground); }
.nav-item .count { margin-inline-start: auto; color: var(--color-muted-foreground); font-size: var(--text-sm); font-variant-numeric: tabular-nums; }
.nav-item[aria-current="page"] { background: var(--color-card); box-shadow: var(--shadow-sm), inset 0 0 0 1px var(--color-border); font-weight: 600; }
.nav-item[aria-current="page"] .ph { color: var(--color-foreground); }
@media (hover: hover) and (pointer: fine) { .nav-item:not([aria-current="page"]):hover { background: var(--color-accent); } }
.triage-count {
  margin-inline-start: auto; min-inline-size: 22px; block-size: 20px; padding: 0 var(--space-1);
  border-radius: var(--radius-full); background: var(--color-mark); color: var(--color-mark-foreground);
  font-size: var(--text-xs); font-weight: 700; font-variant-numeric: tabular-nums;
  display: inline-grid; place-items: center; overflow: hidden;
}
.triage-count[data-zero] { background: transparent; color: var(--color-muted-foreground); font-weight: 400; }
.triage-count .roll { display: block; grid-area: 1 / 1; }
.nav-group-label { padding: 0 var(--space-2) var(--space-1); font-size: var(--text-xs); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-caps); color: var(--color-muted-foreground); }
.sidebar-foot { margin-block-start: auto; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2); border-block-start: 1px solid var(--color-border); }
.me { display: flex; align-items: center; gap: var(--space-2); min-inline-size: 0; flex: 1; }
.me-name { font-size: var(--text-sm); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.avatar {
  inline-size: 22px; block-size: 22px; flex: none; border-radius: var(--radius-full);
  display: inline-grid; place-items: center;
  background: var(--color-muted); color: var(--color-foreground);
  box-shadow: inset 0 0 0 1px var(--color-border);
  font-size: var(--text-xs); font-weight: 600; letter-spacing: 0;
}
.avatar.none { background: transparent; color: var(--color-muted-foreground); box-shadow: inset 0 0 0 1px var(--color-input); }
.avatar.me-av { background: var(--color-mark-tint); }

/* ---------- workspace: list + panel ---------- */
.workspace { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-inline-size: 0; min-block-size: 0; position: relative; }
.list-col { display: flex; flex-direction: column; min-inline-size: 0; min-block-size: 0; container: list / inline-size; }
.list-head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4) var(--space-2); }
.list-head h1 { font-size: var(--text-xl); line-height: var(--text-xl--line-height); letter-spacing: var(--text-xl--letter-spacing); font-weight: 600; }
.list-head .total { color: var(--color-muted-foreground); font-variant-numeric: tabular-nums; }
.list-head .spacer { flex: 1; }
.mobile-only { display: none !important; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: 0 var(--space-4) var(--space-2); border-block-end: 1px solid var(--color-border); }
.chip {
  display: inline-flex; align-items: center; gap: var(--space-1);
  min-block-size: 26px; padding: 0 var(--space-2);
  border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--color-muted-foreground);
  box-shadow: inset 0 0 0 1px var(--color-border);
  font-size: var(--text-base);
}
.chip[data-active] { color: var(--color-foreground); background: var(--color-card); box-shadow: inset 0 0 0 1px var(--color-input); }
.chip strong { font-weight: 600; }
@media (hover: hover) and (pointer: fine) { .chip:hover { color: var(--color-foreground); background: var(--color-accent); } }
.filters .clear { font-size: var(--text-base); min-block-size: 26px; }
.filters .hint { margin-inline-start: auto; color: var(--color-muted-foreground); font-size: var(--text-sm); display: inline-flex; gap: var(--space-1); align-items: center; }

.banner { display: flex; align-items: center; gap: var(--space-2); margin: var(--space-2) var(--space-4) 0; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--color-muted); font-size: var(--text-sm); }
.banner .ph { color: var(--color-warning); }
.banner .btn { margin-inline-start: auto; }

.list-scroll { flex: 1; min-block-size: 0; overflow: auto; overscroll-behavior: contain; padding-block-end: var(--space-4); }
.list-scroll:focus-visible { outline-offset: -2px; }
.list-scroll[role="listbox"]:focus-visible { outline-color: transparent; }
.list-scroll[role="listbox"]:focus-visible .row[aria-selected="true"] { box-shadow: inset 0 0 0 2px var(--color-ring); }
.group { margin: 0; padding: 0; }
.group-head {
  position: sticky; inset-block-start: 0; z-index: 1;
  display: flex; align-items: center; gap: var(--space-2);
  block-size: 32px; padding: 0 var(--space-4);
  background: var(--color-background);
  border-block-end: 1px solid var(--color-border);
  font-size: var(--text-sm); font-weight: 600;
}
.group-head .count { color: var(--color-muted-foreground); font-weight: 400; font-variant-numeric: tabular-nums; }
.rows { padding: var(--space-1) var(--space-2); display: grid; gap: 0; }
.row {
  display: grid; align-items: center;
  grid-template-columns: 16px 68px minmax(0, 1fr) auto 22px 40px;
  column-gap: var(--space-3);
  block-size: var(--row-h); padding: 0 var(--space-2);
  border-radius: var(--radius-md);
  cursor: default; user-select: none;
  position: relative;
}
.row { isolation: isolate; }
.row[data-new]::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: var(--color-mark-tint); opacity: 0; animation: row-new var(--duration-medium) var(--ease-move) var(--duration-micro) both; pointer-events: none; }
@keyframes row-new { from { opacity: 1; } }
.row .key { color: var(--color-muted-foreground); }
.row .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .labels { display: flex; gap: var(--space-1); }
.row .age { text-align: end; color: var(--color-muted-foreground); font-size: var(--text-base); font-variant-numeric: tabular-nums; }
.row[aria-selected="true"] { background: var(--color-mark-tint); }
.row[aria-selected="true"]::before { content: ""; position: absolute; inset-block: var(--space-2); inset-inline-start: 0; inline-size: 2px; border-radius: var(--radius-full); background: var(--color-mark); }
.row.restricted .title { color: var(--color-muted-foreground); }
@media (hover: hover) and (pointer: fine) { .row:not([aria-selected="true"]):hover { background: var(--color-accent); } }
.lab { font-size: var(--text-xs); color: var(--color-muted-foreground); padding: 0 var(--space-1); border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--color-border); line-height: 18px; white-space: nowrap; }
@container list (width < 620px) { .row .labels { display: none; } .row { grid-template-columns: 16px 64px minmax(0, 1fr) 22px 36px; } .statusbar .legend { display: none; } }

/* status + priority glyphs (data encoding) */
.sg, .pg { inline-size: 14px; block-size: 14px; flex: none; display: block; }
.sg-triage { color: var(--color-mark); }
.sg-backlog, .sg-todo, .sg-declined { color: var(--color-muted-foreground); }
.sg-progress { color: var(--color-warning); }
.sg-review { color: var(--color-info); }
.sg-done { color: var(--color-success); }
.sg-cut { stroke: var(--color-background); }
.pg { color: var(--color-muted-foreground); }
.pg-urgent { color: var(--color-urgent); }
.pg .off { opacity: 0.3; }
.pg-mark { stroke: var(--color-card); }

.statusbar {
  display: flex; align-items: center; gap: var(--space-3);
  min-block-size: 32px; padding: 0 var(--space-4);
  border-block-start: 1px solid var(--color-border);
  font-size: var(--text-base); color: var(--color-muted-foreground);
}
.statusbar .sync { white-space: nowrap; display: inline-flex; align-items: center; gap: var(--space-1); }
.statusbar .sync[data-state="offline"] .ph { color: var(--color-warning); }
.statusbar .sync[data-state="ok"] .ph { color: var(--color-success); }
.legend { margin-inline-start: auto; display: inline-flex; flex-wrap: wrap; justify-content: flex-end; gap: var(--space-1) var(--space-3); align-items: center; }
.legend span { display: inline-flex; gap: var(--space-1); align-items: center; }
.legend .mono { color: var(--color-foreground); }

/* skeleton */
.skel { display: grid; align-content: start; gap: var(--space-2); padding: var(--space-3) var(--space-4); }
.skel-bar { block-size: 12px; border-radius: var(--radius-sm); background: var(--color-muted); }
.skel-row { display: grid; grid-template-columns: 16px 56px 1fr 22px; gap: var(--space-3); align-items: center; block-size: var(--row-h); }
.skel-head { inline-size: 120px; block-size: 14px; margin-block: var(--space-2); }
.skel .dot { inline-size: 14px; block-size: 14px; border-radius: var(--radius-sm); background: var(--color-muted); }
.skel .av { inline-size: 22px; block-size: 22px; border-radius: var(--radius-full); background: var(--color-muted); }

/* empty + error states */
.state { display: grid; justify-items: start; gap: var(--space-3); max-inline-size: 30rem; margin: var(--space-12) auto; padding: 0 var(--space-6); }
.state h2 { font-size: var(--text-xl); line-height: var(--text-xl--line-height); font-weight: 600; }
.state p { color: var(--color-muted-foreground); }
.state .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.state .icon { color: var(--color-muted-foreground); font-size: var(--icon-lg); inline-size: var(--icon-lg); block-size: var(--icon-lg); }
.state.error .icon { color: var(--color-destructive); }

/* Triage clear: the signature */
.cleared { justify-items: center; text-align: center; }
.cleared .actions { justify-content: center; }
.cleared h2 { font-family: var(--font-display); font-size: var(--text-3xl); line-height: var(--text-3xl--line-height); letter-spacing: var(--text-3xl--letter-spacing); font-weight: 600; }
.stamp { inline-size: 64px; block-size: 64px; color: var(--color-mark); }
.stamp-cap { fill: var(--color-mark-tint); stroke: currentColor; stroke-width: 1.5; }
.stamp-lip { fill: none; stroke: currentColor; stroke-width: 1.5; opacity: 0.5; }
.stamp-tick { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.stamp-tick-g { transform-box: fill-box; transform-origin: 20% 60%; }
.triage-signature .stamp-g { transform-box: fill-box; transform-origin: center; animation: signature-stamp var(--duration-long) var(--ease-enter-emphasized) both; }
.triage-signature .stamp-tick-g { animation: signature-tick var(--duration-standard) var(--ease-enter-emphasized) var(--duration-short) both; }
.triage-signature h2, .triage-signature p, .triage-signature .actions { animation: signature-rise var(--duration-standard) var(--ease-enter) var(--duration-standard) both; }
@keyframes signature-stamp { from { transform: scale(0.96) translateY(-4px); opacity: 0; } }
@keyframes signature-tick { from { opacity: 0; transform: scale(0.6); } }
@keyframes signature-rise { from { transform: translateY(6px); opacity: 0; } }
.count-signature .roll-out { animation: signature-roll-out var(--duration-standard) var(--ease-exit) forwards; }
.count-signature .roll-in { animation: signature-roll-in var(--duration-long) var(--ease-enter-emphasized) both; }
@keyframes signature-roll-out { to { transform: translateY(-100%); opacity: 0; } }
@keyframes signature-roll-in { from { transform: translateY(100%); opacity: 0; } }

/* ---------- panel ---------- */
.panel {
  inline-size: clamp(380px, 44cqi, 720px);
  margin: var(--space-2) var(--space-2) var(--space-2) 0;
  display: flex; flex-direction: column; min-block-size: 0;
  background: var(--color-card); color: var(--color-card-foreground);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md), inset 0 0 0 1px var(--color-border);
}
.workspace { container: ws / inline-size; }
.panel[hidden] { display: none; }
.panel[data-enter] { animation: panel-in var(--duration-short) var(--ease-enter-emphasized); }
.panel[data-leave] { animation: panel-out var(--duration-micro) var(--ease-exit) forwards; }
@keyframes panel-in { from { transform: translateX(16px); opacity: 0; } }
@keyframes panel-out { to { transform: translateX(16px); opacity: 0; } }
.panel-head { display: flex; align-items: center; gap: var(--space-2); min-block-size: 44px; padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); border-block-end: 1px solid var(--color-border); }
.panel-head .crumb { color: var(--color-muted-foreground); font-size: var(--text-base); display: inline-flex; gap: var(--space-2); align-items: center; min-inline-size: 0; }
.panel-head .crumb .mono { color: var(--color-foreground); padding: var(--space-1) var(--space-2); border-radius: var(--radius-sm); background: var(--color-muted); }
.panel-head .tools { margin-inline-start: auto; display: flex; gap: var(--space-1); }
.panel-scroll { flex: 1; min-block-size: 0; overflow: auto; overscroll-behavior: contain; padding: var(--space-5) var(--space-6) var(--space-8); }
.issue-title { font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); letter-spacing: var(--text-2xl--letter-spacing); font-weight: 600; margin-block-end: var(--space-2); }
.reported { color: var(--color-muted-foreground); font-size: var(--text-base); margin-block-end: var(--space-5); }
.triage-bar {
  display: grid; gap: var(--space-3);
  padding: var(--space-3); margin-block-end: var(--space-5);
  border-radius: var(--radius-md);
  background: var(--color-mark-tint);
}
.triage-bar p { font-size: var(--text-sm); }
.triage-bar .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.props { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-1) var(--space-3); margin: 0 0 var(--space-6); align-items: center; }
.props dt { color: var(--color-muted-foreground); font-size: var(--text-base); }
.none-val { color: var(--color-muted-foreground); }
.props dd { margin: 0; min-inline-size: 0; display: flex; flex-wrap: wrap; gap: var(--space-1); align-items: center; }
.prop-btn { justify-content: flex-start; font-weight: 400; padding: 0 var(--space-2); margin-inline-start: calc(var(--space-2) * -1); gap: var(--space-2); }
.prop-btn kbd { margin-inline-start: var(--space-1); opacity: 0; transition: opacity var(--duration-micro) var(--ease-move); }
.prop-btn:focus-visible kbd, .panel:focus-within .prop-btn kbd { opacity: 1; }
@media (hover: hover) and (pointer: fine) { .prop-btn:hover { background: var(--color-accent); } .prop-btn:hover kbd { opacity: 1; } }
.branch { display: inline-flex; align-items: center; gap: var(--space-1); min-inline-size: 0; }
.branch code { font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-sm); }
.pr .state-tag { font-weight: 600; color: var(--color-muted-foreground); }
.pr .state-tag[data-state="Open"] { color: var(--color-success); }
.pr .state-tag[data-state="Merged"] { color: var(--color-info); }
.pr-fail { color: var(--color-muted-foreground); font-size: var(--text-sm); display: inline-flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.section-title { font-size: var(--text-base); font-weight: 600; margin-block-end: var(--space-2); color: var(--color-muted-foreground); }
.desc { font-size: var(--text-md); line-height: var(--text-md--line-height); max-inline-size: 64ch; display: grid; gap: var(--space-3); margin-block-end: var(--space-8); }
.desc code { font-family: var(--font-mono); font-size: 0.86em; padding: 0 var(--space-1); background: var(--color-muted); border-radius: var(--radius-sm); }
.activity { list-style: none; margin: 0 0 var(--space-4); padding: 0; display: grid; gap: var(--space-3); }
.act { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: var(--space-2); font-size: var(--text-base); color: var(--color-muted-foreground); align-items: start; }
.act strong { color: var(--color-foreground); font-weight: 600; }
.act .ev-ic { inline-size: 22px; display: grid; place-items: center; }
.comment-body { margin-block-start: var(--space-1); color: var(--color-foreground); font-size: var(--text-md); line-height: var(--text-md--line-height); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--color-background); box-shadow: inset 0 0 0 1px var(--color-border); }
.composer { display: grid; gap: var(--space-2); }
.composer label { font-size: var(--text-sm); font-weight: 600; }
.composer textarea { min-block-size: 72px; resize: vertical; padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); border: 1px solid var(--color-input); background: var(--color-background); font-size: var(--text-lg); line-height: var(--text-lg--line-height); }
.composer .row-end { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; }
.composer .err, .field-err { color: var(--color-destructive); font-size: var(--text-sm); display: flex; align-items: center; gap: var(--space-1); }
.panel-empty { margin: auto; padding: var(--space-8); text-align: center; color: var(--color-muted-foreground); display: grid; gap: var(--space-2); justify-items: center; }
.panel-empty .ph { font-size: var(--icon-lg); inline-size: var(--icon-lg); block-size: var(--icon-lg); }
.locked { display: grid; gap: var(--space-3); max-inline-size: 48ch; }
.locked .ph { color: var(--color-muted-foreground); font-size: var(--icon-lg); inline-size: var(--icon-lg); block-size: var(--icon-lg); }
.locked h2 { font-family: var(--font-display); font-size: var(--text-2xl); line-height: var(--text-2xl--line-height); letter-spacing: var(--text-2xl--letter-spacing); font-weight: 600; }
.locked p { color: var(--color-muted-foreground); }

/* ---------- menus ---------- */
.menu {
  position: fixed; z-index: 40;
  inline-size: 248px; max-block-size: min(360px, 70dvh);
  display: flex; flex-direction: column;
  background: var(--color-card); color: var(--color-card-foreground);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--color-border);
  padding: var(--space-1);
  transform-origin: top left;
}
.menu[hidden] { display: none; }
.menu[data-anim] { animation: menu-in var(--duration-short) var(--ease-snappy); }
@keyframes menu-in { from { opacity: 0; transform: scale(0.95); } }
.menu input { border: 0; border-block-end: 1px solid var(--color-border); background: transparent; padding: var(--space-2); font-size: var(--text-lg); outline: none; }
.menu input:focus-visible { box-shadow: inset 0 -2px 0 var(--color-ring); }
.menu-title { padding: var(--space-2) var(--space-2) var(--space-1); font-size: var(--text-xs); color: var(--color-muted-foreground); font-weight: 600; text-transform: uppercase; letter-spacing: var(--tracking-caps); }
.menu-list { overflow: auto; padding-block-start: var(--space-1); }
.opt { display: flex; align-items: center; gap: var(--space-2); min-block-size: 32px; padding: 0 var(--space-2); border-radius: var(--radius-md); cursor: default; }
.opt[aria-selected="true"] { background: var(--color-accent); }
.opt .check { margin-inline-start: auto; color: var(--color-mark); }
.opt kbd { margin-inline-start: auto; }
.opt .check + kbd { margin-inline-start: var(--space-2); }
.opt.danger { color: var(--color-destructive); }
.menu-empty { padding: var(--space-3) var(--space-2); color: var(--color-muted-foreground); font-size: var(--text-sm); }

/* ---------- dialogs (palette, new issue, shortcuts) ---------- */
dialog { border: 0; padding: 0; color: var(--color-card-foreground); background: var(--color-card); }
dialog::backdrop { background: var(--color-overlay); }
.palette { inline-size: min(620px, calc(100vw - var(--space-8))); margin-block-start: 12dvh; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--color-border); overflow: hidden; }
.palette[data-anim][open] { animation: fade-in var(--duration-micro) var(--ease-move); }
@keyframes fade-in { from { opacity: 0; } }
.palette-input { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-block-end: 1px solid var(--color-border); }
.palette-input .ph { color: var(--color-muted-foreground); }
.palette-input input { flex: 1; border: 0; background: transparent; border-radius: var(--radius-sm); font-size: var(--text-lg); min-inline-size: 0; }
.palette-input .ctx { font-size: var(--text-sm); color: var(--color-muted-foreground); }
.palette-list { max-block-size: min(420px, 60dvh); overflow: auto; padding: var(--space-1) var(--space-2) var(--space-2); }
.pal-group { padding: var(--space-2) var(--space-2) var(--space-1); font-size: var(--text-xs); color: var(--color-muted-foreground); font-weight: 600; }
.palette .opt { min-block-size: 36px; }
.palette .opt .ctx { color: var(--color-muted-foreground); font-size: var(--text-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette .opt .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette mark { background: transparent; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--color-mark); text-underline-offset: 2px; }
.palette-foot { display: flex; gap: var(--space-4); padding: var(--space-2) var(--space-4); border-block-start: 1px solid var(--color-border); font-size: var(--text-sm); color: var(--color-muted-foreground); flex-wrap: wrap; }
.palette-foot span { display: inline-flex; gap: var(--space-1); align-items: center; }

.dialog { inline-size: min(560px, calc(100vw - var(--space-8))); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--color-border); }
.dialog[data-anim][open] { animation: dialog-in var(--duration-short) var(--ease-enter); }
@keyframes dialog-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } }
.dialog form { display: grid; gap: var(--space-4); padding: var(--space-5) var(--space-6) var(--space-5); }
.dialog h2 { font-size: var(--text-xl); line-height: var(--text-xl--line-height); font-weight: 600; display: flex; align-items: center; gap: var(--space-2); }
.dialog h2 .mono { color: var(--color-muted-foreground); }
.field { display: grid; gap: var(--space-1); }
.field label { font-size: var(--text-sm); font-weight: 600; }
.field .hint { font-size: var(--text-sm); color: var(--color-muted-foreground); }
.field input, .field textarea, .field select {
  inline-size: 100%; padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md); border: 1px solid var(--color-input);
  background: var(--color-background); color: var(--color-foreground);
  font-size: var(--text-lg);
}
.field select { background: var(--color-background); color: var(--color-foreground); }
.field textarea { min-block-size: 96px; resize: vertical; line-height: var(--text-lg--line-height); }
.field [aria-invalid="true"] { border-color: var(--color-destructive); }
.field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.dialog-foot { display: flex; align-items: center; gap: var(--space-2); justify-content: flex-end; padding-block-start: var(--space-2); }
.dialog-foot .note { margin-inline-end: auto; color: var(--color-muted-foreground); font-size: var(--text-sm); }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-1) var(--space-6); margin: 0; }
.keys div { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-block-size: 28px; border-block-end: 1px solid var(--color-border); font-size: var(--text-sm); }
.keys dt { order: 0; }
.keys dd { margin: 0; }
.switch-row { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); }
.switch { appearance: none; inline-size: 40px; block-size: 24px; border-radius: var(--radius-full); background: var(--color-input); position: relative; margin: 0; flex: none; transition: background-color var(--duration-micro) var(--ease-move); }
.switch::after { content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px; inline-size: 18px; block-size: 18px; border-radius: var(--radius-full); background: var(--color-card); box-shadow: var(--shadow-sm); transition: transform var(--duration-micro) var(--ease-move); }
.switch:checked { background: var(--color-mark); }
.switch:checked::after { transform: translateX(16px); }

/* ---------- toasts ---------- */
.toast-list { position: fixed; inset: auto var(--space-4) var(--space-12) auto; display: grid; z-index: 60; }
.toast {
  grid-area: 1 / 1; align-self: end;
  inline-size: min(380px, calc(100vw - var(--space-8)));
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-2) var(--space-2) var(--space-3);
  background: var(--color-primary); color: var(--color-primary-foreground);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  font-size: var(--text-sm);
  --i: 0;
  z-index: calc(10 - var(--i));
  transform: translateY(calc(var(--i) * -8px)) scale(calc(1 - var(--i) * 0.04));
  opacity: calc(1 - var(--i) * 0.3);
  transform-origin: bottom center;
  transition: transform var(--duration-short) var(--ease-move), opacity var(--duration-short) var(--ease-move);
}
@starting-style { .toast { transform: translateY(8px); opacity: 0; } }
.toast p { flex: 1; }
.toast .btn { color: var(--color-primary-foreground); min-block-size: var(--control-h); }
@media (hover: hover) and (pointer: fine) { .toast .btn:hover { box-shadow: inset 0 0 0 1px currentColor; } }
.toast.is-leaving { opacity: 0; transform: translateY(8px); transition-duration: var(--duration-micro); transition-timing-function: var(--ease-exit); }
.toast[data-kind="error"] .ph { color: var(--color-destructive); }

/* ---------- responsive ---------- */
@media (max-width: 1023px) {
  :root { --sidebar-w: 60px; }
  .sidebar .label-text, .sidebar .count, .sidebar .nav-group-label, .team-text, .me-name, .search-btn .kbd-row { display: none; }
  .sidebar { align-items: center; }
  .nav-item, .search-btn { justify-content: center; inline-size: 40px; padding: 0; }
  .triage-count { position: absolute; transform: translate(10px, -9px); min-inline-size: 18px; block-size: 16px; }
  .nav-item { position: relative; }
  .sidebar-foot { flex-direction: column; border: 0; }
  .team { padding: var(--space-1); }
  .panel { position: absolute; inset-block: 0; inset-inline-end: 0; inline-size: min(480px, 70%); z-index: 20; box-shadow: var(--shadow-lg), inset 0 0 0 1px var(--color-border); }
}
@media (max-width: 767px) {
  :root { --row-h: 44px; --control-h: 44px; }
  .chip, .filters .clear { min-block-size: 44px; }
  .skip-link { min-block-size: 44px; display: inline-flex; align-items: center; }
  .field input, .field select { min-block-size: 44px; }
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .sidebar { display: none; }
  .mobile-only { display: revert !important; }
  .topbar { display: flex !important; flex-direction: column; gap: var(--space-2); padding: var(--space-2) var(--space-3) 0; padding-block-start: max(var(--space-2), env(safe-area-inset-top)); border-block-end: 1px solid var(--color-border); background: var(--color-sidebar); }
  .topbar-row { display: flex; align-items: center; gap: var(--space-2); }
  .topbar-row .team-name { flex: 1; }
  .tabs { display: flex; gap: var(--space-1); }
  .tab { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: var(--space-1); min-block-size: 44px; padding: 0 var(--space-2); border: 0; background: transparent; color: var(--color-muted-foreground); font-size: var(--text-base); box-shadow: inset 0 -2px 0 transparent; }
  .tab[aria-current="page"] { color: var(--color-foreground); font-weight: 600; box-shadow: inset 0 -2px 0 var(--color-foreground); }
  .tab .triage-count { position: static; transform: none; margin: 0; }
  .list-head { padding-inline: var(--space-3); }
  .desktop-only { display: none !important; }
  .btn.mobile-only { display: inline-flex !important; }
  .filters { padding-inline: var(--space-3); }
  .menu input, .palette-input input { min-block-size: 44px; }
  .filters .hint { display: none; }
  .row { grid-template-columns: 16px 64px minmax(0, 1fr) 22px; }
  .row .labels, .row .age { display: none; }
  .group-head { padding-inline: var(--space-3); }

/* ================= state ================= */
const VIEWS = {
  triage: { title: "Triage", icon: "ph-tray", test: (i) => i.status === "triage", group: false },
  mine:   { title: "My issues", icon: "ph-user-circle", test: (i) => i.assignee === ME && !["triage", "declined"].includes(i.status), group: true },
  all:    { title: "All issues", icon: "ph-stack", test: (i) => !["triage", "declined"].includes(i.status), group: true },
  urgent: { title: "Urgent and high", icon: "ph-fire", saved: true, test: (i) => [1, 2].includes(i.priority) && !["triage", "declined", "done"].includes(i.status), group: true },
  review: { title: "In review", icon: "ph-git-pull-request", saved: true, test: (i) => i.status === "review", group: true },
  unassigned: { title: "Unassigned", icon: "ph-user-minus", saved: true, test: (i) => !i.assignee && !["triage", "declined", "done"].includes(i.status), group: true },
};
const S = {
  issues: [],
  view: "all",
  filters: { status: new Set(), priority: new Set(), assignee: new Set() },
  selected: null,
  panelOpen: true,
  load: "loading",      // loading | ready | error
  offline: false,
  failNext: false,
  pending: 0,           // changes waiting to sync while offline
  triageSession: { accepted: 0, declined: 0, played: false },
  singleKeys: true,
  undo: null,
  nextNum: 215,
  prRetry: {},
};
try { S.singleKeys = localStorage.getItem("tracker.singleKeys") !== "off"; } catch (e) { /* storage blocked: keep default */ }

/* ================= URL state ================= */
function readUrl() {
  const q = new URLSearchParams(location.search);
  const v = q.get("view");
  S.view = VIEWS[v] ? v : "all";
  for (const k of ["status", "priority", "assignee"]) {
    S.filters[k] = new Set((q.get(k) || "").split(",").filter(Boolean).map((x) => (k === "priority" ? Number(x) : x)));
  }
  S.selected = q.get("issue") || null;
  if (q.has("issue")) S.panelOpen = true;
  return q.get("state");
}
function writeUrl(push = false) {
  const q = new URLSearchParams(location.search);
  q.set("view", S.view);
  for (const k of ["status", "priority", "assignee"]) {
    if (S.filters[k].size) q.set(k, [...S.filters[k]].join(",")); else q.delete(k);
  }
  if (S.selected && S.panelOpen) q.set("issue", S.selected); else q.delete("issue");
  const url = `${location.pathname}?${q.toString()}`;
  if (push) history.pushState({ panel: S.panelOpen }, "", url); else history.replaceState({ panel: S.panelOpen }, "", url);
  document.title = `${VIEWS[S.view].title}${S.selected && S.panelOpen ? ` · ${S.selected}` : ""} · Engineering · Tracker`;
}

/* ================= derived ================= */
function visibleIssues(view = S.view, useFilters = true) {
  const f = S.filters;
  return S.issues.filter((i) => VIEWS[view].test(i)
    && (!useFilters || !f.status.size || f.status.has(i.status))
    && (!useFilters || !f.priority.size || f.priority.has(i.priority))
    && (!useFilters || !f.assignee.size || f.assignee.has(i.assignee || "none")));
}
const prioRank = (p) => (p === 0 ? 5 : p);
function grouped(list) {
  if (!VIEWS[S.view].group) return [{ status: "triage", items: [...list].sort((a, b) => b.createdAt - a.createdAt) }];
  return GROUP_ORDER.map((s) => ({
    status: s,
    items: list.filter((i) => i.status === s).sort((a, b) => prioRank(a.priority) - prioRank(b.priority) || b.updatedAt - a.updatedAt),
  })).filter((g) => g.items.length);
}
function orderedVisible() {
  const out = [];
  for (const g of grouped(visibleIssues())) out.push(...g.items);
  return out;
}
const byKey = (k) => S.issues.find((i) => i.key === k);
const anyFilter = () => S.filters.status.size + S.filters.priority.size + S.filters.assignee.size > 0;

/* ================= render: navigation ================= */
function countText(view) { return S.load === "ready" ? String(visibleIssues(view, false).length) : ""; }
function renderNav() {
  const primary = ["triage", "mine", "all"];
  const triageN = S.load === "ready" ? visibleIssues("triage", false).length : null;
  $("#nav-primary").innerHTML = primary.map((v) => `
    <li><button class="nav-item" type="button" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ""}>
      <i class="ph ${VIEWS[v].icon}" aria-hidden="true"></i><span class="label-text">${VIEWS[v].title}</span>
      ${v === "triage"
        ? (triageN === null ? "" : `<span class="triage-count" id="triage-count" ${triageN === 0 ? "data-zero" : ""}><span class="roll">${triageN}</span></span><span class="visually-hidden">, ${triageN} to triage</span>`)
        : `<span class="count">${countText(v)}</span>`}
    </button></li>`).join("");
  $("#nav-views").innerHTML = ["urgent", "review", "unassigned"].map((v) => `
    <li><button class="nav-item" type="button" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ""}>
      <i class="ph ${VIEWS[v].icon}" aria-hidden="true"></i><span class="label-text">${VIEWS[v].title}</span><span class="count">${countText(v)}</span>
    </button></li>`).join("");
  $("#tabs").innerHTML = primary.map((v) => `
    <button class="tab" type="button" data-view="${v}" ${S.view === v ? 'aria-current="page"' : ""}>${VIEWS[v].title}
      ${v === "triage" && triageN ? `<span class="triage-count">${triageN}</span>` : ""}</button>`).join("");
}

/* ================= render: filters ================= */
function renderFilters() {
  const f = S.filters;
  const chip = (kind, label, values) => {
    const active = values.length > 0;
    return `<button class="chip" type="button" data-filter="${kind}" ${active ? "data-active" : ""} aria-haspopup="dialog">
      ${active ? `<span>${label}:</span> <strong>${esc(listFmt.format(values))}</strong>` : `<i class="ph ph-plus sm" aria-hidden="true"></i>${label}`}
      <i class="ph ph-caret-down sm" aria-hidden="true"></i></button>`;
  };
  const statusOpts = VIEWS[S.view].group;
  $("#filters").innerHTML = `
    ${statusOpts ? chip("status", "Status", [...f.status].map((s) => STATUS[s].label)) : ""}
    ${chip("priority", "Priority", [...f.priority].map((p) => PRIORITY[p]))}
    ${chip("assignee", "Assignee", [...f.assignee].map((a) => (a === "none" ? "Unassigned" : PEOPLE[a].name)))}

    <span class="hint"><kbd>F</kbd> filter</span>`;
}

/* ================= render: list ================= */
function rowHtml(i) {

  const title = i.restricted ? `<i class="ph ph-lock-simple sm" aria-hidden="true"></i> Restricted issue` : esc(i.title);
  return `<div class="row ${i.restricted ? "restricted" : ""}" role="option" id="row-${i.key}" data-key="${i.key}" aria-selected="${sel}">
    <span title="Priority: ${PRIORITY[i.priority]}">${prioGlyph(i.priority)}<span class="visually-hidden">${PRIORITY[i.priority]}, </span></span>
    <span class="key mono">${i.key}</span>
    <span class="title">${title}</span>
    <span class="labels">${labels}</span>
    ${avatar(i.assignee)}

}
function renderList() {
  const list = $("#list");
  list.removeAttribute("role");
  const v = VIEWS[S.view];
  $("#view-title").textContent = v.title;
  if (S.load === "loading") {
    list.setAttribute("aria-busy", "true");
    $("#view-total").textContent = "";
    list.innerHTML = `<div class="skel skel-pulse" aria-label="Loading issues">${[0, 1].map((g) => `
      <div class="skel-bar skel-head"></div>${Array.from({ length: g ? 3 : 5 }, (_, n) => `
      <div class="skel-row"><span class="dot"></span><span class="skel-bar"></span><span class="skel-bar" style="inline-size:${[72, 58, 84, 64, 50][n]}%"></span><span class="av"></span></div>`).join("")}`).join("")}</div>`;
    list.setAttribute("aria-activedescendant", "");
    return;
  }

  if (S.load === "error") {

function emptyHtml() {

    </dl>

    <form class="composer" id="composer" novalidate>

      <div class="row-end"><span class="reported kbd-row"><kbd>${MOD}</kbd><kbd>↵</kbd> to post</span><button class="btn btn-line" type="submit">Post comment</button></div>

}
function animatePanelIn() {
  const p = $("#panel");
  p.setAttribute("data-enter", "");
  p.addEventListener("animationend", () => p.removeAttribute("data-enter"), { once: true });
}

function syncChange(apply, revert, describe) {

  apply();

    revert();

    toast(`Couldn’t save: ${describe}. Nothing was changed.`, { kind: "error", action: "Retry", onAction: () => syncChange(apply, revert, describe) });
    return false;

}

  const before = { status: i.status, updatedAt: i.updatedAt, log: [...(i.log || [])] };
  const to = kind === "decline" ? "declined" : kind === "backlog" ? "backlog" : "todo";
  const remainingBefore = visibleIssues("triage", false).length;
  const neighbour = neighbourOf(i.key);
  const describe = `${i.key} ${kind === "decline" ? "declined" : `accepted to ${STATUS[to].label}`}`;
  const ok = syncChange(() => {
    i.status = to; i.updatedAt = Date.now();

  $("#f-title-err").hidden = ok;
  if (ok) $("#f-title").removeAttribute("aria-invalid"); else $("#f-title").setAttribute("aria-invalid", "true");
  return ok;
}
$("#f-title").addEventListener("blur", () => { if ($("#f-title").value) validateTitle(); });
$("#f-title").addEventListener("input", () => { if ($("#f-title").getAttribute("aria-invalid")) validateTitle(); });
$("#new-form").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $("#new-form").requestSubmit(); } });
$("#new-form").addEventListener("submit", (e) => {
  e.preventDefault();
  if (!validateTitle()) { $("#f-title").focus(); return; }
  if (S.failNext) {
    S.failNext = false;
    const err = $("#f-submit-err"); err.hidden = false;
    err.querySelector("span").textContent = "Couldn’t create the issue: the server didn’t answer. Your text is still here. Try again.";
    return;
  }
  const key = `ENG-${S.nextNum++}`;
  const assignee = $("#f-assignee").value || null;
  const desc = $("#f-desc").value.trim();
  S.issues.unshift({ key, title: $("#f-title").value.trim(), status: "triage", priority: Number($("#f-priority").value), assignee, labels: [], createdAt: Date.now(), updatedAt: Date.now(), reporter: ME, via: "the tracker", desc: desc ? desc.split(/\n{2,}/).map(esc) : ["No description yet."], comments: [] });
  if (S.offline) S.pending++;
  $("#new-form").reset();
  $("#new-dialog").close();
  if (S.view === "triage") { S.selected = key; }
  renderAll();
  const row = $(`#row-${key}`);
  if (row) { row.setAttribute("data-new", ""); row.addEventListener("animationend", () => row.removeAttribute("data-new"), { once: true }); }
  toast(`${key} filed in Triage`, { action: S.view === "triage" ? undefined : "Open", onAction: () => jumpTo(key) });
});
$("#new-dialog").addEventListener("click", (e) => { if (e.target === $("#new-dialog")) $("#new-dialog").close(); });
$("#new-dialog").addEventListener("cancel", (e) => {
  if ($("#f-title").value.trim() || $("#f-desc").value.trim()) {
    // protect unsaved work: keep the draft for next time instead of discarding it
    toast("Draft kept. Press C to finish it.");
  }
});

/* ================= shortcuts dialog ================= */
function openKeys(how) {
  const d = $("#keys-dialog");
  const rows = [["J or ↓", "Next issue"], ["K or ↑", "Previous issue"], ["Enter", "Open issue"], ["Esc", "Close panel or menu"], ["S", "Change status"], ["P", "Change priority"], ["A", "Assign"], ["Y", "Accept (triage)"], ["B", "Move to Backlog (triage)"], ["N", "Decline (triage)"], ["C", "New issue"], ["F", "Filter by status"], ["Z", "Undo last change"], ["G then T / M / A", "Go to Triage / My issues / All"], [`${MOD} K`, "Command menu"], ["?", "This list"]];
  $("#keys-list").innerHTML = rows.map(([k, l]) => `<div><dt>${l}</dt><dd class="kbd-row">${k.split(" ").map((p) => (["or", "then", "/"].includes(p) ? `<span class="reported">${p}</span>` : `<kbd>${esc(p)}</kbd>`)).join("")}</dd></div>`).join("");
  $("#single-keys").checked = S.singleKeys;
  if (how === "pointer" && !reducedMotion()) d.setAttribute("data-anim", ""); else d.removeAttribute("data-anim");
  d.showModal();
}
$("#single-keys").addEventListener("change", (e) => {
  S.singleKeys = e.target.checked;
  try { localStorage.setItem("tracker.singleKeys", S.singleKeys ? "on" : "off"); } catch (err) { /* storage blocked */ }
  toast(S.singleKeys ? "Single-key shortcuts on" : `Single-key shortcuts off. ${MOD} K still opens the command menu.`);
});

/* ================= theme ================= */
function currentTheme() {
  const t = document.documentElement.dataset.theme;
  return t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("tracker.theme", next); } catch (e) { /* storage blocked */ }
  updateThemeBtn();
}
function updateThemeBtn() {
  const dark = currentTheme() === "dark";
  const b = $("#theme-btn");
  b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  b.innerHTML = `<i class="ph ${dark ? "ph-sun" : "ph-moon"}" aria-hidden="true"></i>`;
}
try { const t = localStorage.getItem("tracker.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* storage blocked */ }

/* ================= navigation + misc actions ================= */
function goView(v) {
  if (!VIEWS[v]) return;
  S.view = v;
  if (!VIEWS[v].group) S.filters.status.clear();
  ensureSelection();
  if (isOverlayPanel()) S.panelOpen = false;
  renderAll();
  if (v === "triage" && S.triageSession.accepted + S.triageSession.declined > 0) S.triageSession.played = true;
  focusList();
}
function jumpTo(key) {
  const i = byKey(key); if (!i) return;
  const v = i.status === "triage" ? "triage" : VIEWS[S.view].test(i) ? S.view : "all";
  S.view = v;
  for (const k in S.filters) S.filters[k].clear();
  S.selected = key; S.panelOpen = true;
  renderAll();
  $(`#row-${CSS.escape(key)}`)?.scrollIntoView({ block: "nearest" });
  if (isOverlayPanel()) (isPhone() ? $("#panel-back") : $("#panel-close"))?.focus({ preventScroll: true }); else focusList();
}
function clearFilters() { for (const k in S.filters) S.filters[k].clear(); ensureSelection(); renderAll(); focusList(); }
const linkFor = (key) => `${location.origin}${location.pathname}?view=all&issue=${key}`;
async function copyText(text, done) {
  try { await navigator.clipboard.writeText(text); toast(done); }
  catch (e) { toast("Couldn’t reach the clipboard. Copy it from the address bar instead.", { kind: "error" }); }
}

/* ================= loading + preview states ================= */
function load({ state } = {}) {
  S.load = "loading"; renderAll();
  if (state === "loading") return; // held: simulated slow network
  if (state === "error") { S.load = "error"; renderAll(); return; }
  S.issues = state === "empty" ? [] : seedIssues();
  S.load = "ready";
  S.syncedAt = Date.now();
  if (state === "offline") { S.offline = true; S.syncedAt = Date.now() - 18 * 60000; }
  if (state === "savefail") S.failNext = true;
  ensureSelection();
  renderAll();
}
function applyPreview(st) {
  const q = new URLSearchParams(location.search); q.set("state", st);
  history.replaceState(null, "", `${location.pathname}?${q}`);
  S.offline = false; S.failNext = false; S.pending = 0;
  S.triageSession = { accepted: 0, declined: 0, played: false };
  load({ state: st });
  if (st === "savefail") toast("The next change you make will fail to save, so you can see the rollback.");
}

/* ================= events: clicks ================= */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-key]");
  if (!t) return;
  if (t.matches(".row")) {
    const key = t.dataset.key;
    if (key !== S.selected) select(key, { scroll: false });
    if (!S.panelOpen || isOverlayPanel()) openPanel("pointer");
    return;
  }
  if (t.dataset.view) { e.preventDefault(); goView(t.dataset.view); return; }
  if (t.dataset.filter) { openFilter(t.dataset.filter, t, "pointer"); return; }
  if (t.dataset.pick) { openPicker(t.dataset.pick, "pointer"); return; }
  const a = t.dataset.action;
  const i = S.selected && byKey(S.selected);
  switch (a) {
    case "palette": openPalette("pointer"); break;
    case "new": openNew("pointer"); break;
    case "close-new": $("#new-dialog").close(); break;
    case "shortcuts": openKeys("pointer"); break;
    case "theme": toggleTheme(); break;
    case "clear-filters": clearFilters(); break;
    case "close-panel": closePanel("pointer"); break;
    case "accept": triageDecision("accept"); break;
    case "accept-backlog": triageDecision("backlog"); break;
    case "decline": triageDecision("decline"); break;
    case "copy-link": copyText(linkFor(i.key), `Link to ${i.key} copied`); break;
    case "copy-branch": copyText(i.branch, "Branch name copied"); break;
    case "retry-load": history.replaceState(null, "", location.pathname + `?view=${S.view}`); load(); break;
    case "reconnect": {
      const n = S.pending; S.offline = false; S.pending = 0; S.syncedAt = Date.now();
      renderAll(); toast(n ? `Back online. ${plural(n, "change", "changes")} synced.` : "Back online. Everything is up to date.");
      break;
    }
    case "retry-pr": S.prRetry[i.key] = true; renderPanel(); break;
    case "request-access":
      if (!i.accessRequested) { i.accessRequested = true; renderPanel(); toast(`Asked Dana Okafor for access to ${i.key}`); }
      break;
    case "more":
      openMenu({ anchor: t, title: `More · ${i.key}`, how: "pointer", filterable: false, options: [
        { value: "me", label: "Assign to me", icon: avatar(ME) },
        { value: "link", label: "Copy link", icon: '<i class="ph ph-link sm" aria-hidden="true"></i>' },
        ...(i.branch ? [{ value: "branch", label: "Copy branch name", icon: '<i class="ph ph-git-branch sm" aria-hidden="true"></i>' }] : []),
        { value: "delete", label: "Delete issue", icon: '<i class="ph ph-trash sm" aria-hidden="true"></i>', danger: true },
      ], onPick: (o) => {
        if (o.value === "me") setField(i.key, "assignee", ME);
        if (o.value === "link") copyText(linkFor(i.key), `Link to ${i.key} copied`);
        if (o.value === "branch") copyText(i.branch, "Branch name copied");
        if (o.value === "delete") deleteIssue(i.key);
      } });
      break;
    case "views-menu":
      openMenu({ anchor: t, title: "Views", how: "pointer", filterable: false, options: ["urgent", "review", "unassigned"].map((v) => ({ value: v, label: `${VIEWS[v].title} (${visibleIssues(v, false).length})`, icon: `<i class="ph ${VIEWS[v].icon} sm" aria-hidden="true"></i>`, current: S.view === v })), onPick: (o) => goView(o.value) });
      break;
  }
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "composer") return;
  e.preventDefault();
  postComment();
});
function postComment() {
  const ta = $("#comment"); const text = ta.value.trim();
  const err = $("#comment-err");
  if (!text) { err.hidden = false; ta.setAttribute("aria-invalid", "true"); ta.focus(); return; }
  const i = byKey(S.selected);
  const c = { who: ME, text, at: Date.now() };
  const ok = syncChange(() => i.comments.push(c), () => i.comments.splice(i.comments.indexOf(c), 1), "your comment");
  if (!ok) { ta.value = text; return; }
  renderPanel(); renderStatusbar();
  $(".panel-scroll")?.scrollTo({ top: 1e6 });
  $("#comment")?.focus();
}
document.addEventListener("input", (e) => { if (e.target.id === "comment" && e.target.value.trim()) { $("#comment-err").hidden = true; e.target.removeAttribute("aria-invalid"); } });

/* ================= events: keyboard ================= */
let gPending = false, gTimer = null;
const typingIn = (el) => el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
document.addEventListener("keydown", (e) => {
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette("key"); return; }
  if (e.target.id === "comment" && mod && e.key === "Enter") { e.preventDefault(); postComment(); return; }
  if (!menu.el.hidden) return; // the menu handles its own keys
  if ($("#palette").open || $("#new-dialog").open || $("#keys-dialog").open) return;
  if (typingIn(e.target)) { if (e.key === "Escape") e.target.blur(); return; }
  if (mod || e.altKey) return;
  const k = e.key;
  // arrows and Escape always work; letters only when single-key shortcuts are on
  if (k === "ArrowDown") { e.preventDefault(); move(1); return; }
  if (k === "ArrowUp") { e.preventDefault(); move(-1); return; }
  if (k === "Escape") { if (S.panelOpen) { e.preventDefault(); closePanel("key"); } return; }
  if (k === "Enter" && (e.target === $("#list") || e.target === document.body)) { e.preventDefault(); openPanel("key"); return; }
  if (!S.singleKeys || k.length !== 1) return;
  if (gPending) {
    gPending = false; clearTimeout(gTimer);
    const map = { t: "triage", m: "mine", a: "all" };
    if (map[k.toLowerCase()]) { e.preventDefault(); goView(map[k.toLowerCase()]); }
    return;
  }
  if (e.target.closest && e.target.closest("button") && (k === " ")) return;
  switch (k.toLowerCase()) {
    case "j": e.preventDefault(); move(1); break;
    case "k": e.preventDefault(); move(-1); break;
    case "o": e.preventDefault(); openPanel("key"); break;
    case "s": e.preventDefault(); openPicker("status", "key"); break;
    case "p": e.preventDefault(); openPicker("priority", "key"); break;
    case "a": e.preventDefault(); openPicker("assignee", "key"); break;
    case "y": e.preventDefault(); triageDecision("accept"); break;
    case "b": e.preventDefault(); triageDecision("backlog"); break;
    case "n": e.preventDefault(); triageDecision("decline"); break;
    case "c": e.preventDefault(); openNew("key"); break;
    case "f": e.preventDefault(); { const chip = $('[data-filter="status"]') || $('[data-filter="priority"]'); openFilter(chip.dataset.filter, chip, "key"); } break;
    case "z": if (S.undo) { e.preventDefault(); const u = S.undo; S.undo = null; u(); toast("Undone"); } break;
    case "g": gPending = true; gTimer = setTimeout(() => (gPending = false), 1200); break;
    case "?": e.preventDefault(); openKeys("key"); break;
  }
});
$("#list").addEventListener("dblclick", (e) => { if (e.target.closest(".row")) openPanel("pointer"); });
addEventListener("popstate", () => { const keep = S.selected; readUrl(); if (!S.selected) S.selected = keep; if (!new URLSearchParams(location.search).has("issue")) S.panelOpen = isOverlayPanel() ? false : S.panelOpen; ensureSelection(); renderAll(); });
matchMedia("(max-width: 1023px)").addEventListener("change", () => { S.panelOpen = !isOverlayPanel(); renderAll(); });
addEventListener("resize", () => { if (!menu.el.hidden) closeMenu(false); });

/* ================= boot ================= */
document.querySelectorAll(".mod-key").forEach((k) => (k.textContent = MOD));
const initialState = readUrl();
if (isOverlayPanel() && !new URLSearchParams(location.search).has("issue")) S.panelOpen = false;
load({ state: initialState });
document.documentElement.dataset.ready = "";
</script>
</body>
</html>
