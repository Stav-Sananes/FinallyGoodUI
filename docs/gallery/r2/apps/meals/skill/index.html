  if (!t) return;
  if (t.hasAttribute("data-close")) return sheet.close();
  if (t.hasAttribute("data-clear-search")) { renderPickBody(""); return document.getElementById("pick-search").focus(); }
  if (t.dataset.pick) { sheet.close(); return setEvening(sheetDay, R(t.dataset.pick)); }
  if (t.hasAttribute("data-night-off")) { sheet.close(); return setEvening(sheetDay, OFF); }
  if (t.hasAttribute("data-clear")) { sheet.close(); return clearEvening(sheetDay); }
});
sheet.addEventListener("close", () => { sheet.style.setProperty("--sheet-y", "0px"); });
/* drag the handle down to dismiss; arrow-down does the same from the keyboard */
(function sheetDrag() {
  const handle = sheet.querySelector(".sheet-handle");
  let startY = 0, offset = 0, lastY = 0, lastT = 0, velocity = 0;
  const set = (px) => { offset = px; sheet.style.setProperty("--sheet-y", `${px}px`); };
  handle.addEventListener("pointerdown", (e) => { startY = lastY = e.clientY; lastT = e.timeStamp; velocity = 0; handle.setPointerCapture(e.pointerId); sheet.setAttribute("data-dragging", ""); });
  handle.addEventListener("pointermove", (e) => {
    if (!sheet.hasAttribute("data-dragging")) return;
    const dy = e.clientY - startY;
    set(dy < 0 ? dy / (1 + Math.abs(dy) / 40) : dy);
    velocity = (e.clientY - lastY) / Math.max(1, e.timeStamp - lastT); lastY = e.clientY; lastT = e.timeStamp;
  });
  handle.addEventListener("pointerup", () => {
    if (!sheet.hasAttribute("data-dragging")) return;
    sheet.removeAttribute("data-dragging");
    if (velocity > 0.5 || offset > sheet.offsetHeight * 0.35) { sheet.close(); return; }
    set(0);
  });
  handle.addEventListener("keydown", (e) => { if (e.key === "ArrowDown") { e.preventDefault(); sheet.close(); } });
})();

/* ---------- plan changes: optimistic, rolled back on failure ---------- */
function setEvening(idx, entry) {
  const offset = current.week ?? 0;
  const key = `${offset}|${idx}`;
  const before = plans[offset][idx];
  const itemsBefore = shoppingList(offset).length;
  plans[offset][idx] = entry;
  delete app.saveErrors[key];
  const wasSet = celebrated.has(String(offset));
  render(current, { focus: false });
  playFill(idx);
  bumpFigure(itemsBefore);
  const name = entry?.recipe ? recipeById[entry.recipe].name : entry?.off ? "Night off" : "cleared";
  if (app.previewState === "offline") {
    setTimeout(() => {
      plans[offset][idx] = before;
      app.saveErrors[key] = `Couldn’t save ${dayName(offset, idx)}: you’re offline. Your pick is kept here.`;
      app.pending = { idx, entry };
      render(current, { focus: false });
      announce(`Couldn’t save ${dayName(offset, idx)}. You’re offline.`);
    }, ms("long") * 2);
    return;
  }
  const added = shoppingList(offset).length - itemsBefore;
  if (plannedCount(offset) === 7 && !wasSet) { celebrated.add(String(offset)); playSignature(); announce(`${setTitle(offset)}. 7 dinners, ${shoppingList(offset).length} things on the list.`); }
  else announce(`${dayName(offset, idx)}: ${name}.${added > 0 ? ` ${added} new things on the list.` : ""}`);
  restoreFocusToRow(idx);
}
function clearEvening(idx) {
  const offset = current.week ?? 0;
  const before = plans[offset][idx];
  const itemsBefore = shoppingList(offset).length;
  plans[offset][idx] = null;
  if (plannedCount(offset) < 7) celebrated.delete(String(offset));
  render(current, { focus: false });
  bumpFigure(itemsBefore);
  restoreFocusToRow(idx);
  toast(`${dayName(offset, idx)} cleared.`, { action: "Undo", onAction: () => { plans[offset][idx] = before; if (plannedCount(offset) === 7) celebrated.add(String(offset)); render(current, { focus: false }); playFill(idx); restoreFocusToRow(idx); } });
}
function restoreFocusToRow(idx) { view.querySelector(`.evening[data-idx="${idx}"] [data-plan], .evening[data-idx="${idx}"] .dish-name`)?.focus({ preventScroll: true }); }
function playFill(idx) {
  const dish = document.getElementById(`dish-${idx}`);
  if (!dish) return;
  dish.dataset.state = "entering"; dish.setAttribute("data-new", "");
  requestAnimationFrame(() => requestAnimationFrame(() => (dish.dataset.state = "in")));
  dish.addEventListener("animationend", () => dish.removeAttribute("data-new"), { once: true });
}
function bumpFigure(before) {
  const el = document.getElementById("item-figure");
  if (!el || Number(el.textContent) === before) return;
  el.setAttribute("data-changed", "");
  el.addEventListener("animationend", () => el.removeAttribute("data-changed"), { once: true });
}
function playSignature() {
  const p = document.getElementById("progress");
  if (!p) return;
  p.dataset.signature = "play";
  setTimeout(() => (p.dataset.signature = "settled"), ms("hero") + ms("standard"));
}

/* ---------- toasts (recipe: toast-stack) ---------- */
const toastList = document.querySelector(".toast-list");
function restack() { [...toastList.children].forEach((t, k) => t.style.setProperty("--i", k)); }
function toast(message, { action, onAction, timeout = 8000 } = {}) { // reading time, not motion
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<p></p>${action ? '<button type="button"></button>' : ""}`;
  el.querySelector("p").textContent = message;
  if (action) Object.assign(el.querySelector("button"), { textContent: action, onclick: () => { onAction?.(); dismiss(el); } });
  toastList.prepend(el);
  while (toastList.children.length > 3) toastList.lastElementChild.remove();
  restack();
  let timer = setTimeout(() => dismiss(el), timeout);
  el.addEventListener("pointerenter", () => clearTimeout(timer));
  el.addEventListener("pointerleave", () => (timer = setTimeout(() => dismiss(el), timeout / 4)));
  el.addEventListener("focusin", () => clearTimeout(timer));
}
function dismiss(el) {
  if (!el.isConnected || el.classList.contains("is-leaving")) return;
  el.classList.add("is-leaving");
  const done = () => { el.remove(); restack(); };
  el.addEventListener("transitionend", done, { once: true });
  setTimeout(done, ms("short") + ms("instant"));
}

/* ---------- recipe view ---------- */
let wakeLock = null;
function renderRecipe(route) {
  const r = recipeById[route.id];
  const backHref = current.from === "recipes" ? "#recipes" : `#week/${lastWeek}`;
  const backLabel = current.from === "recipes" ? "Recipes" : weekTitle(lastWeek);
  if (!r) {
    view.innerHTML = `<div class="page"><a class="back" href="${backHref}"><i class="ph ph-arrow-left" aria-hidden="true"></i>${backLabel}</a>
      <section class="state-block"><h1 tabindex="-1" class="page-title">That recipe isn’t here</h1><p>It may have been removed from your recipes. Your week is unchanged.</p><a class="btn btn-ink" href="#week">Back to this week</a></section></div>`;
    return;
  }
  const onDays = (plans[0] || []).map((e, k) => (e?.recipe === r.id ? k : null)).filter((k) => k !== null);
  const when = onDays.includes(todayIndex) ? "Tonight" : onDays.length ? `This week · ${listFmt.format(onDays.map((k) => dayName(0, k)))}` : "Not in this week’s plan";
  const canWake = "wakeLock" in navigator;
  view.innerHTML = `<article class="page">
    <a class="back" href="${backHref}"><i class="ph ph-arrow-left" aria-hidden="true"></i>${backLabel}</a>
    <header class="recipe-head">
      <p class="caps">${when}</p>
      <h1 tabindex="-1">${esc(r.name)}</h1>
      <p class="recipe-meta"><span class="num"><i class="ph ph-clock icon-sm" aria-hidden="true"></i>${r.mins}&nbsp;min</span><span>Serves 3</span>${r.veg ? `<span class="tag"><i class="ph ph-leaf icon-sm" aria-hidden="true"></i>Vegetarian</span>` : ""}</p>
      <div class="recipe-actions">
        <button class="btn btn-ink" type="button" data-wake aria-pressed="${wakeLock ? "true" : "false"}" ${canWake ? "" : "disabled"}><i class="ph ph-sun-dim" aria-hidden="true"></i><span>${wakeLock ? "Screen stays on" : "Keep screen on while cooking"}</span></button>
        <span class="hint" id="wake-hint">${canWake ? "So your phone doesn’t lock with floury hands." : "This browser can’t keep the screen on."}</span>
      </div>
    </header>
    <div class="recipe-body">
      <section aria-labelledby="ing-title"><h2 id="ing-title">Ingredients</h2>
        <ul class="ings">${r.ings.map((g) => `<li><span>${esc(g.n)}</span><span class="leader" aria-hidden="true"></span><span class="q">${qty(g.q, g.u)}</span></li>`).join("")}</ul></section>
      <section aria-labelledby="method-title"><h2 id="method-title">Method</h2>
        <ol class="steps">${r.steps.map((s) => `<li><span>${esc(s)}</span></li>`).join("")}</ol></section>
    </div></article>`;
}
async function toggleWake(btn) {
  try {
    if (wakeLock) { await wakeLock.release(); wakeLock = null; }
    else { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; if (current.view === "recipe") render(current, { focus: false }); }); }
    render(current, { focus: false });
    view.querySelector("[data-wake]")?.focus();
  } catch {
    document.getElementById("wake-hint").textContent = "Couldn’t keep the screen on. Your battery saver may be blocking it.";
  }
}

/* ---------- recipes view ---------- */
function renderRecipes() {
  view.innerHTML = `<div class="page"><h1 tabindex="-1" class="page-title">Recipes</h1><p class="page-sub">${RECIPES.length} recipes the household cooks. Open one to see its ingredients and method.</p>
    <ul class="recipe-rows">${RECIPES.map((r) => {
      const on = (plans[0] || []).map((e, k) => (e?.recipe === r.id ? fmtShortDay.format(dayDate(0, k)) : null)).filter(Boolean);
      return `<li><a href="#recipe/${r.id}"><span><span class="dish-name">${esc(r.name)}</span><span class="dish-meta"><span><span class="num">${r.mins}</span>&nbsp;min</span>${r.veg ? `<span class="tag"><i class="ph ph-leaf icon-sm" aria-hidden="true"></i>Vegetarian</span>` : ""}</span></span><span class="pick-on">${on.length ? `This week: ${listFmt.format(on)}` : ""}</span></a></li>`;
    }).join("")}</ul></div>`;
}

/* ---------- list view ---------- */
function renderList() {
  const offset = 0;
  const list = shoppingList(offset);
  const left = itemsLeft(offset);
  if (!list.length) {
    view.innerHTML = `<div class="page"><h1 tabindex="-1" class="page-title">Shopping list</h1>
      <section class="state-block"><h2>Nothing to buy yet</h2><p>Plan a dinner and its ingredients land here, sorted by aisle.</p><a class="btn btn-ink" href="#week">Plan this week</a></section></div>`;
    return;
  }
  const doneCount = list.length - left;
  const groups = AISLES.map((a) => ({ ...a, items: list.filter((it) => it.a === a.id) })).filter((a) => a.items.length);
  view.innerHTML = `<div class="page"><h1 tabindex="-1" class="page-title">Shopping list</h1>
    <p class="page-sub">${weekRange(offset)} · <span class="num">${left}</span> of <span class="num">${list.length}</span> left · in your store’s aisle order</p>
    <div class="list-tools">${left === 0 ? `<span>All done. Nice shop.</span>` : `<span class="page-sub">Tap an item when it’s in the basket.</span>`}
      <button class="btn btn-quiet btn-sm" type="button" data-clear-ticked ${doneCount ? "" : "disabled"}>Clear ticked${doneCount ? ` (${doneCount})` : ""}</button></div>
    ${groups.map((g) => {
      const gl = g.items.filter((it) => !ticked.has(`${offset}|${it.key}`)).length;
      return `<section class="aisle" aria-labelledby="aisle-${g.id}"><div class="aisle-head"><h2 id="aisle-${g.id}">${g.name}</h2><span>${gl ? `${gl} left` : "Done"}</span></div>
      <ul>${g.items.map((it) => `<li class="item"><label class="check"><input type="checkbox" data-item="${esc(it.key)}" ${ticked.has(`${offset}|${it.key}`) ? "checked" : ""}><svg class="check-box" viewBox="0 0 16 16" aria-hidden="true"><path class="check-tick" d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>
        <span class="item-text"><span class="item-line"><span class="item-name">${esc(it.n)}</span><span class="leader" aria-hidden="true"></span><span class="item-q">${qty(it.q, it.u)}</span></span><span class="item-for">for ${listFmt.format(it.days)}</span></span></label></li>`).join("")}</ul></section>`;
    }).join("")}
  </div>`;
}

/* ---------- events ---------- */
view.addEventListener("click", (e) => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.matches('[aria-disabled="true"]')) { e.preventDefault(); return; }
  if (t.dataset.plan !== undefined) return openPicker(Number(t.dataset.plan), t);
  if (t.dataset.retry !== undefined) { const p = app.pending; if (p) setEvening(p.idx, p.entry); return; }
  if (t.dataset.action === "retry") {
    app.previewState = "loading"; render(current);
    setTimeout(() => { app.previewState = "full"; render(current); }, ms("long") * 2);
    return;
  }
  if (t.hasAttribute("data-wake")) return toggleWake(t);
  if (t.hasAttribute("data-clear-ticked")) {
    const removed = [...ticked].filter((k) => k.startsWith("0|"));
    removed.forEach((k) => { ticked.delete(k); got.add(k); });
    render(current, { focus: false });
    view.querySelector("h1")?.focus({ preventScroll: true });
    toast(`${removed.length} ticked ${removed.length === 1 ? "item" : "items"} cleared.`, { action: "Undo", onAction: () => { removed.forEach((k) => { got.delete(k); ticked.add(k); }); render(current, { focus: false }); } });
  }
});
view.addEventListener("change", (e) => {
  if (e.target.id === "preview-state") { app.previewState = e.target.value; render(current); return; }
  if (e.target.dataset.item) {
    const key = `0|${e.target.dataset.item}`;
    if (e.target.checked) ticked.add(key); else ticked.delete(key);
    const label = e.target.closest(".aisle");
    const list = shoppingList(0);
    const id = label?.querySelector("h2")?.id.replace("aisle-", "");
    const gl = list.filter((it) => it.a === id && !ticked.has(`0|${it.key}`)).length;
    label.querySelector(".aisle-head span").textContent = gl ? `${gl} left` : "Done";
    const left = itemsLeft(0), doneCount = list.length - left;
    view.querySelector(".page-sub .num").textContent = left;
    const clr = view.querySelector("[data-clear-ticked]");
    clr.disabled = !doneCount; clr.textContent = `Clear ticked${doneCount ? ` (${doneCount})` : ""}`;
    updateTabCount();
  }
});

/* ---------- start ---------- */
const params = new URLSearchParams(location.search);
if (["loading", "error", "offline"].includes(params.get("state"))) app.previewState = params.get("state");
render(current, { focus: false });
</script>
