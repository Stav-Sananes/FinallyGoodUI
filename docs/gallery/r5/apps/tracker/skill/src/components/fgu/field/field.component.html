<div data-fgu="field" data-part="root" [attr.data-variant]="variant">
  <label data-part="label" [attr.for]="(controlId ? controlId : uid + '-control')">{{ label }}</label>
  @if (hint) {
    <p data-part="hint" [attr.id]="uid + '-hint'">{{ hint }}</p>
  }
  @if (multiline) {
    <textarea
      data-part="control"
      [attr.id]="(controlId ? controlId : uid + '-control')"
      [attr.name]="name"
      [attr.placeholder]="placeholder"
      [attr.autocomplete]="autocomplete"
      [attr.required]="required ? '' : null"
      [attr.disabled]="disabled ? '' : null"
      [attr.aria-invalid]="invalid ? 'true' : null"
      [attr.aria-describedby]="(hint ? uid + '-hint ' : '') + uid + '-error'"
      [attr.rows]="rows"
      [value]="value"
      (input)="onValueInput($event)"
    ></textarea>
  } @else {
    <input
      data-part="control"
      [attr.id]="(controlId ? controlId : uid + '-control')"
      [attr.name]="name"
      [attr.placeholder]="placeholder"
      [attr.autocomplete]="autocomplete"
      [attr.required]="required ? '' : null"
      [attr.disabled]="disabled ? '' : null"
      [attr.aria-invalid]="invalid ? 'true' : null"
      [attr.aria-describedby]="(hint ? uid + '-hint ' : '') + uid + '-error'"
      [attr.type]="type"
      [value]="value"
      (input)="onValueInput($event)"
    />
  }
  <p
    data-part="error"
    [attr.id]="uid + '-error'"
    aria-live="polite"
    [attr.data-controlled]="error ? '' : undefined"
  >{{ error }}</p>
</div>
