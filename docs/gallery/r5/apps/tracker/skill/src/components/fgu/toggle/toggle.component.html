<label data-fgu="toggle" data-part="root" [attr.data-variant]="variant">
  <input
    data-part="control"
    type="checkbox"
    [attr.name]="name"
    [attr.value]="value"
    [checked]="checked"
    [attr.disabled]="disabled ? '' : null"
    [attr.aria-invalid]="invalid ? 'true' : null"
    [attr.role]="variant === 'switch' ? 'switch' : null"
  />
  <span data-part="label">
    <ng-content />
  </span>
</label>
