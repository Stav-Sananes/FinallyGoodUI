<div data-part="root" role="status" aria-label="Notifications">
  @for (item of toasts; track item.id) {
    <div data-part="toast" [attr.data-variant]="item.variant" [attr.data-timeout]="item.timeoutMs ?? null" (dismiss)="drop($event, item.id)">
      <p data-part="message">{{ item.text }}</p>
      @if (item.actionLabel) {
        <button type="button" data-part="action" (click)="actionPressed.emit(item.id)">{{ item.actionLabel }}</button>
      }
      <button type="button" data-part="dismiss" aria-label="Dismiss">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" /></svg>
      </button>
    </div>
  }
</div>
