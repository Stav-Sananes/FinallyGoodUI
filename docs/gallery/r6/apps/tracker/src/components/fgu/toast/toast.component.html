<div data-fgu="toast" data-part="root" role="status" [attr.aria-label]="label" (dismiss)="onDismiss($event)">
  @for (t of toasts; track t.id) {
    <div
      data-part="toast"
      [attr.data-variant]="t.variant ? t.variant : 'status'"
      [attr.data-id]="t.id"
      [attr.data-timeout]="t.timeout"
    >
      <p data-part="message">{{ t.message }}</p>
      @if (t.action) {
        <button data-part="action" type="button" (click)="t.onAction && t.onAction(t.id)">{{ t.action }}</button>
      }
      <button data-part="dismiss" type="button" aria-label="Dismiss">&times;</button>
    </div>
  }
  <ng-content />
</div>
