<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disclosure reference</title>
<!-- tokens.css: node scripts/emit-tokens.mjs --in tokens/default.tokens.json --format css > tokens.css -->
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="../disclosure.css">
</head>
<body>
<main id="demo">
  <div data-part="root" data-variant="single">
    <div data-part="item">
      <h3 data-part="heading"><button type="button" data-part="trigger" id="t-ship" aria-expanded="true" aria-controls="p-ship"><span>Shipping</span><span data-part="indicator" aria-hidden="true"></span></button></h3>
      <div data-part="panel" id="p-ship" role="region" aria-labelledby="t-ship"><div data-part="content"><p>Orders leave the warehouse within two working days.</p></div></div>
    </div>
    <div data-part="item">
      <h3 data-part="heading"><button type="button" data-part="trigger" id="t-ret" aria-expanded="false" aria-controls="p-ret"><span>Returns</span><span data-part="indicator" aria-hidden="true"></span></button></h3>
      <div data-part="panel" id="p-ret" role="region" aria-labelledby="t-ret"><div data-part="content"><p>Free returns within thirty days, unused and in the box.</p></div></div>
    </div>
    <div data-part="item">
      <h3 data-part="heading"><button type="button" data-part="trigger" id="t-gift" aria-expanded="false" aria-controls="p-gift" disabled><span>Gift cards</span><span data-part="indicator" aria-hidden="true"></span></button></h3>
      <div data-part="panel" id="p-gift" role="region" aria-labelledby="t-gift"><div data-part="content"><p>Not available in your region.</p></div></div>
    </div>
  </div>
</main>
<script type="module">
  import { attach } from "../disclosure.js";
  attach(document.getElementById("demo"));
</script>
</body>
</html>
