<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Fixture list</title>
<script>document.documentElement.dataset.theme = localStorage.getItem('fx-theme') || 'dark';</script>
<link rel="stylesheet" href="styles.css">
</head><body><main><h1>Items</h1><div id="out">Loading…</div></main>
<script>
const out = document.getElementById('out');
const show = (items) => { out.innerHTML = items.length ? '<ul>' + items.map((i) => '<li><a href="detail.html?id=' + i.id + '">' + i.name + '</a></li>').join('') + '</ul>' : '<p>No items yet</p>'; };
if (new URLSearchParams(location.search).get('state') === 'empty') show([]);
else fetch('data/items.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(show).catch(() => { out.innerHTML = '<p role="alert">Could not load items</p>'; });
</script></body></html>
